// ─── AUTH ─────────────────────────────────────────────────────────────────────
const COGNITO_CLIENT_ID='__COGNITO_CLIENT_ID__';
const COGNITO_URL='https://cognito-idp.sa-east-1.amazonaws.com/';

let authToken=localStorage.getItem('ht:token')||null;
let authRefresh=localStorage.getItem('ht:refresh')||null;
let pendingEmail='';
let authMode='login';

function cognito(target,body){
  return fetch(COGNITO_URL,{method:'POST',headers:{'Content-Type':'application/x-amz-json-1.1','X-Amz-Target':'AWSCognitoIdentityProviderService.'+target},body:JSON.stringify(body)}).then(r=>r.json());
}
function authTab(mode){
  authMode=mode;
  const isLogin=mode==='login';
  document.getElementById('tab-login').style.cssText=`flex:1;padding:9px;border-radius:8px;font-size:13px;font-weight:500;background:${isLogin?'#fff':'transparent'};color:${isLogin?'#1C1917':'#78716C'};border:none`;
  document.getElementById('tab-register').style.cssText=`flex:1;padding:9px;border-radius:8px;font-size:13px;font-weight:500;background:${isLogin?'transparent':'#fff'};color:${isLogin?'#78716C':'#1C1917'};border:none`;
  document.getElementById('auth-btn').textContent=isLogin?'Entrar':'Criar conta';
  document.getElementById('auth-error').textContent='';
}
async function authSubmit(){
  const email=document.getElementById('auth-email').value.trim();
  const password=document.getElementById('auth-password').value;
  const errEl=document.getElementById('auth-error');
  const btn=document.getElementById('auth-btn');
  if(!email||!password){errEl.textContent='Preencha e-mail e senha.';return;}
  btn.disabled=true;btn.textContent='...';errEl.textContent='';
  if(authMode==='login'){
    const res=await cognito('InitiateAuth',{AuthFlow:'USER_PASSWORD_AUTH',ClientId:COGNITO_CLIENT_ID,AuthParameters:{USERNAME:email,PASSWORD:password}});
    if(res.AuthenticationResult){
      authToken=res.AuthenticationResult.AccessToken;
      authRefresh=res.AuthenticationResult.RefreshToken;
      localStorage.setItem('ht:token',authToken);
      localStorage.setItem('ht:refresh',authRefresh);
      showScreen('home');setBnavActive('hoje');render(true);
    }else{
      const t=res.__type||'';
      if(t.includes('NotAuthorized')) errEl.textContent='E-mail ou senha incorretos.';
      else if(t.includes('UserNotConfirmed')) errEl.textContent='Confirme o e-mail antes de entrar.';
      else errEl.textContent='Erro ao entrar. Tente novamente.';
    }
  }else{
    const res=await cognito('SignUp',{ClientId:COGNITO_CLIENT_ID,Username:email,Password:password,UserAttributes:[{Name:'email',Value:email}]});
    if(res.UserSub){
      pendingEmail=email;
      document.getElementById('auth-form').style.display='none';
      document.getElementById('auth-tabs').style.display='none';
      document.getElementById('auth-confirm').style.display='block';
    }else{
      const t=res.__type||'';
      if(t.includes('UsernameExists')) errEl.textContent='E-mail já cadastrado.';
      else if(t.includes('InvalidPassword')) errEl.textContent='Senha fraca. Use pelo menos 8 caracteres.';
      else errEl.textContent='Erro ao criar conta. Tente novamente.';
    }
  }
  btn.disabled=false;btn.textContent=authMode==='login'?'Entrar':'Criar conta';
}
async function confirmCode(){
  const code=document.getElementById('auth-code').value.trim();
  const errEl=document.getElementById('auth-confirm-error');
  if(!code){errEl.textContent='Digite o código.';return;}
  const res=await cognito('ConfirmSignUp',{ClientId:COGNITO_CLIENT_ID,Username:pendingEmail,ConfirmationCode:code});
  if(res.__type){errEl.textContent='Código inválido ou expirado.';return;}
  const pw=document.getElementById('auth-password').value;
  const login=await cognito('InitiateAuth',{AuthFlow:'USER_PASSWORD_AUTH',ClientId:COGNITO_CLIENT_ID,AuthParameters:{USERNAME:pendingEmail,PASSWORD:pw}});
  if(login.AuthenticationResult){
    authToken=login.AuthenticationResult.AccessToken;
    authRefresh=login.AuthenticationResult.RefreshToken;
    localStorage.setItem('ht:token',authToken);
    localStorage.setItem('ht:refresh',authRefresh);
    showScreen('home');render(true);
  }else{
    document.getElementById('auth-form').style.display='block';
    document.getElementById('auth-tabs').style.display='flex';
    document.getElementById('auth-confirm').style.display='none';
    authTab('login');
    document.getElementById('auth-error').textContent='Conta confirmada! Faça login.';
  }
}
async function tryRefresh(){
  if(!authRefresh) return false;
  const res=await cognito('InitiateAuth',{AuthFlow:'REFRESH_TOKEN_AUTH',ClientId:COGNITO_CLIENT_ID,AuthParameters:{REFRESH_TOKEN:authRefresh}});
  if(res.AuthenticationResult){
    authToken=res.AuthenticationResult.AccessToken;
    localStorage.setItem('ht:token',authToken);
    return true;
  }
  return false;
}
function signOut(){
  authToken=null;authRefresh=null;
  localStorage.removeItem('ht:token');localStorage.removeItem('ht:refresh');
  showScreen('auth');
}

// ─── API ─────────────────────────────────────────────────────────────────────
const API_URL='__API_URL__';
const USE_API=API_URL.startsWith('https://');

function loadDay(date){
  try{const s=localStorage.getItem('ht:'+date);return s?JSON.parse(s):makeEmpty(date);}
  catch{return makeEmpty(date);}
}
async function fetchRemote(date){
  if(!authToken) return null;
  try{
    const r=await fetch(`${API_URL}?date=${date}`,{headers:{authorization:'Bearer '+authToken}});
    if(r.status===401){const ok=await tryRefresh();if(ok)return fetchRemote(date);signOut();return null;}
    if(r.ok){const d=await r.json();return d||null;}
  }catch{}
  return null;
}
function saveDay(date,d){
  try{localStorage.setItem('ht:'+date,JSON.stringify(d));}catch{}
  if(!USE_API||!authToken) return;
  fetch(`${API_URL}?date=${date}`,{method:'PUT',headers:{'content-type':'application/json',authorization:'Bearer '+authToken},body:JSON.stringify(d)}).catch(()=>{});
}

function calcScore(d, date){
  const sups=getSups(d.tr);
  const mD=MEALS.filter(m=>d.meals[m.id]).length;
  const wD=d.water>=goals.aguaCopos?1:0;
  const slD=SLEEPS.find(s=>s.id===d.sleep)?.ok?1:0;
  const coD=d.sleepOk?1:0;
  const spD=sups.filter(s=>d.sups[s.id]).length;
  const isGym=isGymType(d.tr);
  let tD=0;
  if(isGym&&date){const sess=loadGymSession(date,d.tr);tD=sess&&sess.some(ex=>ex.sets.some(s=>s.done))?1:0;}
  const tT=isGym?1:0;
  const total=MEALS.length+1+2+sups.length+tT;
  const done=mD+wD+slD+coD+spD+tD;
  return{meals:{d:mD,t:MEALS.length},water:{d:wD,t:1},sleep:{d:slD+coD,t:2},
         sups:{d:spD,t:sups.length},treino:{d:tD,t:tT},
         pct:total>0?Math.round(done/total*100):0,done,total};
}

    showToast('🎉 100% do dia — incrível!');

function renderNutricaoResumo(){
  const peso=parseFloat(goals.pesoAtual)||0;
  if(!peso) return '';

  const obj=goals.objetivo||'manutencao';
  const factorMap={cutting:2.2,manutencao:1.6,bulking:1.8};
  const protMeta=goals.protMeta||Math.round(peso*(factorMap[obj]||1.6));
  const calMeta=goals.calorias||1800;

  const refeicoesDone=MEALS.filter(m=>dayData.meals[m.id]).length;
  const det0=getMealDetail(MEALS[0]?.id||'cafe',dayData);
  const hasRealMacros=det0&&det0.macro&&det0.macro.includes('prot');
  let protIngerida=0;
  if(hasRealMacros){
    MEALS.forEach(m=>{
      if(!dayData.meals[m.id]) return;
      const det=getMealDetail(m.id,dayData);
      const match=det?.macro?.match(/~?(\d+)g prot/);
      if(match) protIngerida+=parseInt(match[1]);
    });
  } else {
    protIngerida=refeicoesDone*Math.round(protMeta/MEALS.length);
  }

  let calIngerida=0;
  MEALS.forEach(m=>{
    if(!dayData.meals[m.id]) return;
    const det=getMealDetail(m.id,dayData);
    const match=det?.macro?.match(/~?(\d+)\s*kcal/);
    if(match) calIngerida+=parseInt(match[1]);
  });

  function barHtml(val,meta,unit,color){
    const pct=meta>0?Math.min(100,Math.round(val/meta*100)):0;
    return`<div style="background:#FAFAF9;border:1px solid #E7E5E4;border-radius:10px;padding:10px 12px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
        <span style="font-size:12px;font-weight:700;color:#1C1917">${val}${unit}</span>
        <span style="font-size:11px;color:#78716C">meta: ${meta}${unit}</span>
        <span style="font-size:12px;font-weight:700;font-family:'DM Mono',monospace;color:${pct>=100?'#16A34A':pct>=70?color:'#A8A29E'}">${pct}%</span>
      </div>
      <div style="height:6px;background:#E7E5E4;border-radius:99px;overflow:hidden">
        <div style="width:${pct}%;height:100%;background:${pct>=100?'#16A34A':color};border-radius:99px;transition:width .6s ease"></div>
      </div>
    </div>`;
  }

  const protPct=protMeta>0?Math.round(protIngerida/protMeta*100):0;
  let alerta='';
  const hora=new Date().getHours();
  if(hora>=20&&protPct<70&&protMeta>0){
    alerta=`<div style="background:#FFF7ED;border:1px solid #FED7AA;border-radius:10px;padding:10px 12px;font-size:12px;color:#92400E;line-height:1.5">
      ⚠️ Proteína em ${protPct}% às ${hora}h — faltam ${protMeta-protIngerida}g para fechar o dia
    </div>`;
  }

  const objLabel={cutting:'Cutting · déficit',manutencao:'Manutenção',bulking:'Bulking · superávit'}[obj]||obj;
  const factorLabel={cutting:'2,2g/kg',manutencao:'1,6g/kg',bulking:'1,8g/kg'}[obj]||'1,6g/kg';

  return`<div class="card">
    <div class="sec-hdr"><div class="sec-lbl"><span>📊</span> RESUMO NUTRICIONAL</div><span style="font-size:10px;color:#78716C">${objLabel}</span></div>
    <div style="font-size:10px;color:#78716C;margin-bottom:8px;padding:6px 10px;background:#FAFAF9;border-radius:8px">
      🥩 Meta proteína: <b>${protMeta}g</b> (${factorLabel} × ${peso}kg)
    </div>
    ${barHtml(protIngerida,protMeta,'g','#818cf8')}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
      <div>
        <div style="font-size:10px;color:#78716C;margin-bottom:5px">🥩 Proteína</div>
        <div style="font-size:17px;font-weight:700;font-family:'DM Mono',monospace;color:${protPct>=100?'#16A34A':'#818cf8'}">${protIngerida}g</div>
        <div style="font-size:10px;color:#A8A29E">de ${protMeta}g · ${protPct}%</div>
        <div style="height:4px;background:#E7E5E4;border-radius:99px;margin-top:5px;overflow:hidden"><div style="width:${Math.min(100,protPct)}%;height:100%;background:#818cf8;border-radius:99px"></div></div>
      </div>
      <div>
        <div style="font-size:10px;color:#78716C;margin-bottom:5px">🔥 Calorias</div>
        <div style="font-size:17px;font-weight:700;font-family:'DM Mono',monospace;color:${calIngerida>=calMeta?'#16A34A':'#fb923c'}">${calIngerida}</div>
        <div style="font-size:10px;color:#A8A29E">de ${calMeta} kcal · ${calMeta>0?Math.round(calIngerida/calMeta*100):0}%</div>
        <div style="height:4px;background:#E7E5E4;border-radius:99px;margin-top:5px;overflow:hidden"><div style="width:${Math.min(100,calMeta>0?Math.round(calIngerida/calMeta*100):0)}%;height:100%;background:#fb923c;border-radius:99px"></div></div>
      </div>
    </div>
    ${alerta?`<div style="margin-top:8px">${alerta}</div>`:''}
  </div>`;
}

function calcStreak(){
  let s=0;
  const t=today();
  for(let i=0;i<365;i++){
    const d=addDays(t,-i);
    const dd=loadDay(d);
    if(calcScore(dd,d).pct>=80) s++;
    else break;
  }
  return s;
}
function renderStreakBadge(){
  const s=calcStreak();
  if(!s) return;
  const hot=s>=7?'streak-hot':'';
  const html=`<div class="streak-badge ${hot}">🔥 ${s}</div>`;
  const mh=document.getElementById('mh-streak');
  const sb=document.getElementById('sb-streak');
  if(mh) mh.innerHTML=html;
  if(sb) sb.innerHTML=html;
}

function showHistory(){
  const days=60;
  const hist=[];
  for(let i=0;i<days;i++){
    const d=addDays(today(),-i);
    const dd=loadDay(d);
    hist.push({date:d,pct:calcScore(dd,d).pct});
  }
  const avg=Math.round(hist.reduce((a,d)=>a+d.pct,0)/hist.length);
  const great=hist.filter(d=>d.pct>=80).length;
  let streak=0; for(const d of hist){if(d.pct>=80)streak++;else break;}

  const stats=[{l:'Média 60d',v:avg+'%',c:'#6C63FF'},{l:'Dias ótimos',v:great,c:'#16A34A'},{l:'Sequência',v:streak+'d',c:'#D97706'}];
  const statsHtml=stats.map(s=>`<div class="card" style="padding:14px 10px;text-align:center;margin-bottom:0"><div style="font-size:22px;font-weight:800;color:${s.c}">${s.v}</div><div style="font-size:10px;color:#78716C;font-weight:600;margin-top:3px">${s.l}</div></div>`).join('');

  const hist60=[...hist].reverse();
  const firstDow=getDow(hist60[0].date);
  const offsetCells=Array(firstDow).fill('<div></div>').join('');
  const calCells=hist60.map(({date,pct})=>{
    const bg=pct===0?'#F0EFED':pct>=80?'#DCFCE7':pct>=55?'#FEF9C3':'#FEE2E2';
    const c=pct===0?'#A8A29E':pct>=80?'#16A34A':pct>=55?'#92400E':'#DC2626';
    const {date:d}=dispDate(date);
    return`<div title="${d} — ${pct}%" style="aspect-ratio:1;border-radius:6px;background:${bg};display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:500;font-family:'DM Mono',monospace;color:${c}">${pct>0?pct:''}</div>`;
  }).join('');

  const listRows=hist.map(({date,pct})=>{
    const{day,date:d}=dispDate(date);
    const c=pct>=80?'#34d399':pct>=55?'#fbbf24':pct>0?'#f87171':'#D4D0CE';
    return`<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 10px;background:#FAFAF9;border-radius:10px;border:1px solid #E7E5E4;margin-bottom:6px">
      <div><span style="font-size:12px;font-weight:700;color:#1C1917">${day} </span><span style="font-size:12px;color:#78716C">${d}</span></div>
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:60px;height:4px;background:#F0EFED;border-radius:99px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${c};border-radius:99px"></div></div>
        <span style="font-size:12px;font-weight:700;color:${c};font-family:'DM Mono',monospace;width:32px;text-align:right">${pct}%</span>
      </div>
    </div>`;
  }).join('');

  document.getElementById('history-body').innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px">${statsHtml}</div>
    <div class="card">
      <div class="sec-hdr"><div class="sec-lbl"><span>📅</span> ÚLTIMOS 60 DIAS</div></div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">
        ${DAYS.map(d=>`<div style="font-size:9px;color:#78716C;font-weight:700;text-align:center;margin-bottom:4px">${d}</div>`).join('')}
        ${offsetCells}${calCells}
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;justify-content:center;flex-wrap:wrap">
        ${[{c:'#DCFCE7',tc:'#16A34A',l:'≥80%'},{c:'#FEF9C3',tc:'#92400E',l:'55–79%'},{c:'#FEE2E2',tc:'#DC2626',l:'<55%'},{c:'#F0EFED',tc:'#A8A29E',l:'Sem dado'}].map(x=>`<div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:10px;border-radius:3px;background:${x.c};border:1px solid ${x.tc}40"></div><span style="font-size:10px;font-weight:500;color:${x.tc}">${x.l}</span></div>`).join('')}
      </div>
    </div>
    <div class="card"><div class="sec-hdr"><div class="sec-lbl"><span>📋</span> DETALHES</div></div><div style="max-height:360px;overflow-y:auto">${listRows}</div></div>`;

  showScreen('history');setBnavActive('mais');
}

function getQuickDeltas(unit){
  const u=(unit||'').toLowerCase();
  if(/minuto|min\b/.test(u)) return [{v:15,l:'+15min'},{v:30,l:'+30min'},{v:60,l:'+1h'}];
  if(/hora/.test(u))         return [{v:0.5,l:'+30min'},{v:1,l:'+1h'},{v:2,l:'+2h'}];
  if(/r\$|reais|real/.test(u)) return [{v:50,l:'+R$50'},{v:100,l:'+R$100'},{v:500,l:'+R$500'}];
  if(/\bkm\b/.test(u))       return [{v:1,l:'+1km'},{v:5,l:'+5km'},{v:10,l:'+10km'}];
  if(/\bml\b/.test(u))       return [{v:250,l:'+250ml'},{v:500,l:'+500ml'},{v:1000,l:'+1L'}];
  if(/litro|\bl\b/.test(u))  return [{v:0.25,l:'+250ml'},{v:0.5,l:'+500ml'},{v:1,l:'+1L'}];
  if(/p[aá]gin/.test(u))     return [{v:10,l:'+10'},{v:25,l:'+25'},{v:50,l:'+50'}];
  return [{v:1,l:'+1'},{v:2,l:'+2'},{v:5,l:'+5'}];
}

function predictCompletion(goal){
  const created=goal.createdAt||currentDate;
  const elapsed=Math.max(1,Math.round((new Date(currentDate)-new Date(created))/86400000));
  const prog=getGoalProgress(goal);
  if(!prog.total) return 'Nenhum progresso registrado ainda';
  const rate=prog.total/elapsed;
  const remaining=goal.targetValue-prog.total;
  const daysNeeded=remaining/rate;
  const predicted=new Date(currentDate+'T12:00:00');
  predicted.setDate(predicted.getDate()+Math.round(daysNeeded));
  const MONTHS=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const pStr=MONTHS[predicted.getMonth()]+' '+predicted.getFullYear();
  const deadline=goal.deadline||(currentDate.split('-')[0]+'-12-31');
  if(predicted<=new Date(deadline+'T12:00:00')) return `No ritmo atual, termina em ${pStr} ✅`;
  return `No ritmo atual, vai ultrapassar o prazo em ${pStr} ⚠️`;
}

function renderGoalsToday(){
  const active=goalsDefs.filter(g=>g.active&&!g.archived);
  if(!active.length) return '';
  const daily=active.filter(g=>g.frequency==='daily');
  const atRiskLong=active.filter(g=>g.frequency!=='daily'&&g.frequency!=='weekly'&&getGoalProgress(g).isAtRisk);
  const weekly=active.filter(g=>g.frequency==='weekly');
  const longTerm=active.filter(g=>['monthly','yearly','once'].includes(g.frequency)&&!getGoalProgress(g).isAtRisk);
  let html='';
  const focusGoals=[...daily,...atRiskLong];
  if(focusGoals.length){
    html+=`<div class="card"><div class="sec-hdr"><div class="sec-lbl"><span>🎯</span> FOCO DO DIA</div></div>`;
    focusGoals.forEach(g=>{html+=renderGoalCard(g,false);});
    html+=`</div>`;
  }
  if(weekly.length){
    html+=`<div class="card"><div class="sec-hdr"><div class="sec-lbl"><span>📅</span> ESTA SEMANA</div></div>`;
    weekly.forEach(g=>{html+=renderGoalCard(g,false);});

  }
  if(longTerm.length){
    html+=`<div class="card"><div class="sec-hdr"><div class="sec-lbl"><span>🏔️</span> LONGO PRAZO</div></div>`;
    longTerm.forEach(g=>{html+=renderGoalCard(g,true);});
    html+=`</div>`;
  }
  return html;
}

      </div>
      <div>
        <div style="font-size:10px;color:#A8A29E;margin-bottom:4px">Unidade</div>
        <input type="text" id="gf-unit" value="${g.unit||cat.units[0]||''}" placeholder="ex: livros" list="gf-unit-list" style="width:100%;${inp2}">
        <datalist id="gf-unit-list">${unitSugg}</datalist>
      </div>
      <div>
        <div style="font-size:10px;color:#A8A29E;margin-bottom:4px">Por</div>
        <select id="gf-freq" style="width:100%;${inp2}">${freqOpts}</select>
      </div>
    </div>
    <details style="margin-bottom:14px">
      <summary style="font-size:11px;color:#78716C;font-weight:700;letter-spacing:.07em;cursor:pointer;padding:4px 0">⚙️ OPÇÕES AVANÇADAS</summary>
      <div style="padding-top:10px;display:flex;flex-direction:column;gap:10px">
        <div>
          <div style="font-size:11px;color:#78716C;margin-bottom:5px">Prazo (só para frequência "Uma vez")</div>
          <input type="date" id="gf-deadline" value="${g.deadline||''}" style="width:100%;${inp2}">
        </div>
        <div>
          <div style="font-size:11px;color:#78716C;margin-bottom:5px">Vincular a tipo de treino <span style="color:#A8A29E">(lê progresso automaticamente)</span></div>
          <select id="gf-linked" onchange="document.getElementById('gf-metric-wrap').style.display=this.value?'block':'none'" style="width:100%;${inp2}"><option value="" ${!g.linkedWorkout?'selected':''}>— nenhum (entrada manual) —</option>${wkTypeOpts}</select>
        </div>
        <div id="gf-metric-wrap" style="${g.linkedWorkout?'':'display:none'}">
          <div style="font-size:11px;color:#78716C;margin-bottom:5px">Medir por</div>
          <select id="gf-linked-metric" style="width:100%;${inp2}">
            <option value="duration" ${(g.linkedMetric||'duration')==='duration'?'selected':''}>⏱️ Duração (min)</option>
            <option value="sessions" ${g.linkedMetric==='sessions'?'selected':''}>📅 Sessões realizadas</option>
          </select>
        </div>
        <div>
          <div style="font-size:11px;color:#78716C;margin-bottom:5px">Notas</div>
          <input type="text" id="gf-notes" value="${g.notes||''}" placeholder="Contexto, motivação..." style="${inp}">
        </div>
      </div>
    </details>
    <button onclick="saveGoalForm()" style="width:100%;padding:13px;background:#6C63FF;border-radius:10px;color:#fff;font-size:14px;font-weight:700;margin-bottom:8px">Salvar meta</button>
    <button onclick="cancelGoalForm()" style="width:100%;padding:11px;background:none;border:1px solid #E7E5E4;border-radius:10px;color:#78716C;font-size:13px">Cancelar</button>
    ${isEdit?`<button onclick="deleteGoalCompletely('${g.id}')" style="width:100%;padding:11px;background:none;border:1px solid #f8717140;border-radius:10px;color:#f87171;font-size:12px;margin-top:8px">🗑️ Excluir meta e histórico</button>`:''}
  </div>`;
}

function showGoalForm(id){
  if(id){
    const g=goalsDefs.find(x=>x.id===id);if(!g)return;
    _goalFormMode='edit';_goalEditId=id;_goalDraft={...g};
  } else {
    _goalFormMode='create';_goalEditId=null;_goalDraft={category:'custom',frequency:'weekly',active:true,archived:false,createdAt:currentDate};
  }
  renderGoalsMgmt();
}
function cancelGoalForm(){_goalFormMode=null;_goalEditId=null;_goalDraft={};renderGoalsMgmt();}
function saveGoalForm(){
  const title=(document.getElementById('gf-title')?.value||'').trim();
  const targetValue=parseFloat(document.getElementById('gf-target')?.value)||0;
  if(!title||!targetValue){if(!title&&document.getElementById('gf-title'))document.getElementById('gf-title').style.borderColor='#f87171';return;}
  const cat=document.getElementById('gf-cat')?.value||'custom';
  const icon=(document.getElementById('gf-icon')?.value||getCat(cat).icon).trim();
  const unit=(document.getElementById('gf-unit')?.value||'').trim()||getCat(cat).units[0]||'vezes';
  const frequency=document.getElementById('gf-freq')?.value||'weekly';
  const deadline=document.getElementById('gf-deadline')?.value||null;
  const linkedWorkout=document.getElementById('gf-linked')?.value||'';
  const linkedMetric=document.getElementById('gf-linked-metric')?.value||'duration';
  const notes=(document.getElementById('gf-notes')?.value||'').trim();
  if(_goalFormMode==='edit'&&_goalEditId){
    const idx=goalsDefs.findIndex(g=>g.id===_goalEditId);
    if(idx>=0) goalsDefs[idx]={...goalsDefs[idx],title,category:cat,icon,targetValue,unit,frequency,deadline:deadline||null,linkedWorkout,linkedMetric,notes};
  } else {
    goalsDefs.push({id:'goal_'+Date.now(),title,category:cat,icon,targetValue,unit,frequency,deadline:deadline||null,linkedWorkout,linkedMetric,notes,active:true,archived:false,createdAt:currentDate});
  }
  saveGoalsDefs();
  _goalFormMode=null;_goalEditId=null;_goalDraft={};
  renderGoalsMgmt();renderUI();
}
function goalFormTitleChange(val){
  const cat=suggestCat(val);
  const catEl=document.getElementById('gf-cat');
  if(catEl&&catEl.value==='custom'){catEl.value=cat;goalFormCatChange(cat);}
}
function goalFormCatChange(catId){
  const cat=getCat(catId);
  const iconEl=document.getElementById('gf-icon');if(iconEl)iconEl.value=cat.icon;
  const unitEl=document.getElementById('gf-unit');if(unitEl&&!unitEl.value)unitEl.value=cat.units[0]||'';
  const dl=document.getElementById('gf-unit-list');
  if(dl) dl.innerHTML=cat.units.map(u=>`<option value="${u}">`).join('');
}
function archiveGoal(id){
  const idx=goalsDefs.findIndex(g=>g.id===id);if(idx<0)return;
  goalsDefs[idx].archived=true;goalsDefs[idx].active=false;
  saveGoalsDefs();renderGoalsMgmt();renderUI();
}
function unarchiveGoal(id){
  const idx=goalsDefs.findIndex(g=>g.id===id);if(idx<0)return;
  goalsDefs[idx].archived=false;goalsDefs[idx].active=true;
  saveGoalsDefs();renderGoalsMgmt();renderUI();
}
function deleteGoalCompletely(id){
  if(!confirm('Excluir esta meta e todo o histórico de registros?')) return;
  goalsDefs=goalsDefs.filter(g=>g.id!==id);
  goalLogs=goalLogs.filter(l=>l.goalId!==id);
  saveGoalsDefs();saveGoalLogs();
  _goalFormMode=null;_goalEditId=null;_goalDraft={};
  renderGoalsMgmt();renderUI();
}

// ─── ACTIONS ─────────────────────────────────────────────────────────────────
function save(){saveDay(currentDate,dayData);}
function changeDay(n){currentDate=addDays(currentDate,n);render();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('screen-'+id).classList.add('active');}
function toggleMeal(id){dayData.meals[id]=!dayData.meals[id];save();renderUI();}
function toggleSup(id){dayData.sups[id]=!dayData.sups[id];save();renderUI();}
function setTr(id){dayData.tr=id;save();renderUI();}
function toggle(k){dayData[k]=!dayData[k];save();renderUI();}
function setJantar(v){dayData.jantarV=v;save();renderUI();}
function setWater(i){dayData.water=i<dayData.water?i:i+1;save();renderUI();}
function addWater(n){dayData.water=Math.max(0,Math.min(12,dayData.water+n));save();renderUI();}
function setSleep(id){dayData.sleep=id;save();renderUI();}
function setSleepOk(v){dayData.sleepOk=v;save();renderUI();}
function setNotes(v){dayData.notes=v;save();}
function dispDate(s){const[y,m,d]=s.split('-');const dt=new Date(+y,+m-1,+d);return{day:DAYS[dt.getDay()],date:d+' '+MONTHS[+m-1]};}

// ─── INIT ─────────────────────────────────────────────────────────────────────
if(authToken){showScreen('home');setBnavActive('hoje');render(true);}else{showScreen('auth');}
</script>
</body>
</html>
