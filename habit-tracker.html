<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<title>Rotina Diária</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sora',system-ui,sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh;-webkit-tap-highlight-color:transparent;}
button{cursor:pointer;border:none;font-family:inherit;transition:all .13s ease;}
button:active{transform:scale(.96);opacity:.85;}
textarea,input{font-family:inherit;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:2px;}
.fade-in{animation:fadeIn .22s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
#app{max-width:460px;margin:0 auto;}
.header{background:#161b22;border-bottom:1px solid #21262d;padding:12px 16px;position:sticky;top:0;z-index:50;}
.header-inner{display:flex;align-items:center;justify-content:space-between;}
.nav-btn{background:#21262d;color:#8b949e;padding:7px 13px;border-radius:8px;font-size:14px;}
.body{padding:12px 13px 60px;}
.card{background:#161b22;border:1px solid #21262d;border-radius:16px;padding:15px 13px;margin-bottom:10px;}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.sec-lbl{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:700;color:#8b949e;letter-spacing:.1em;text-transform:uppercase;}
.check-row{width:100%;display:flex;align-items:flex-start;gap:12px;padding:11px 12px;border-radius:10px;text-align:left;background:#0d1117;border:1px solid #21262d;margin-bottom:7px;}
.check-row.done{background:#0d2818;border-color:#16a34a;}
.check-circle{width:22px;height:22px;border-radius:50%;flex-shrink:0;margin-top:1px;background:transparent;border:2px solid #30363d;display:flex;align-items:center;justify-content:center;transition:all .2s ease;font-size:12px;font-weight:800;color:#fff;}
.check-circle.done{background:#16a34a;border-color:#16a34a;}
.score-bar-wrap{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.score-bar-bg{flex:1;height:5px;background:#21262d;border-radius:99px;overflow:hidden;}
.score-bar-fill{height:100%;border-radius:99px;transition:width .45s ease;}
.meal-card{width:100%;text-align:left;border-radius:12px;padding:12px 13px;background:#0d1117;border:1px solid #21262d;display:flex;align-items:flex-start;gap:12px;margin-bottom:7px;}
.meal-card.done{background:#0d2818;border-color:#16a34a;}
.badge{display:inline-block;background:#21262d;border-radius:4px;padding:2px 7px;font-size:10px;color:#8b949e;font-weight:600;margin-top:5px;}
.water-bar{flex:1;height:32px;border-radius:6px;transition:background .2s;background:#0d1117;border:1px solid #21262d;}
.water-bar.active{background:#1d4ed8;border-color:#3b82f6;}
.toggle-chip{flex:1;padding:7px 8px;border-radius:8px;font-size:11px;font-weight:600;background:#0d1117;color:#6e7681;border:1px solid #21262d;}
.toggle-chip.active{background:rgba(249,115,22,.12);color:#f97316;border-color:rgba(249,115,22,.35);}
.toggle-chip.active.fds{background:rgba(52,211,153,.12);color:#34d399;border-color:rgba(52,211,153,.35);}
.day-type-btn{padding:10px 8px;border-radius:10px;font-size:11px;font-weight:700;line-height:1.3;background:#0d1117;color:#6e7681;border:1px solid #21262d;}
.pending-dot{width:5px;height:5px;border-radius:50%;background:#f87171;margin-top:7px;flex-shrink:0;}
.screen{display:none;}.screen.active{display:block;}
</style>
</head>
<body>
<div id="app">
  <!-- AUTH SCREEN -->
  <div id="screen-auth" class="screen active">
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">
      <div style="width:100%;max-width:360px">
        <div style="text-align:center;margin-bottom:32px">
          <div style="font-size:36px;margin-bottom:10px">📋</div>
          <div style="font-size:22px;font-weight:800;color:#e6edf3">Rotina Diária</div>
          <div style="font-size:13px;color:#6e7681;margin-top:5px">Seus hábitos, em qualquer dispositivo</div>
        </div>
        <div id="auth-tabs" style="display:flex;background:#161b22;border-radius:10px;padding:3px;margin-bottom:20px;border:1px solid #21262d">
          <button onclick="authTab('login')" id="tab-login" style="flex:1;padding:9px;border-radius:8px;font-size:13px;font-weight:700;background:#21262d;color:#e6edf3">Entrar</button>
          <button onclick="authTab('register')" id="tab-register" style="flex:1;padding:9px;border-radius:8px;font-size:13px;font-weight:700;background:transparent;color:#6e7681">Criar conta</button>
        </div>
        <div id="auth-form">
          <input id="auth-email" type="email" placeholder="E-mail" autocomplete="email" style="width:100%;background:#161b22;border:1px solid #21262d;border-radius:10px;padding:13px 14px;color:#e6edf3;font-size:14px;margin-bottom:10px;outline:none">
          <input id="auth-password" type="password" placeholder="Senha (mínimo 8 caracteres)" autocomplete="current-password" style="width:100%;background:#161b22;border:1px solid #21262d;border-radius:10px;padding:13px 14px;color:#e6edf3;font-size:14px;margin-bottom:6px;outline:none">
          <div id="auth-error" style="font-size:12px;color:#f87171;min-height:18px;margin-bottom:8px;text-align:center"></div>
          <button onclick="authSubmit()" id="auth-btn" style="width:100%;padding:14px;background:#1f6feb;border-radius:10px;color:#fff;font-size:15px;font-weight:700">Entrar</button>
        </div>
        <div id="auth-confirm" style="display:none">
          <div style="font-size:13px;color:#8b949e;text-align:center;margin-bottom:16px;line-height:1.5">Enviamos um código para o seu e-mail.<br>Digite abaixo para confirmar a conta.</div>
          <input id="auth-code" type="text" inputmode="numeric" placeholder="000000" style="width:100%;background:#161b22;border:1px solid #21262d;border-radius:10px;padding:13px 14px;color:#e6edf3;font-size:22px;margin-bottom:6px;outline:none;text-align:center;letter-spacing:8px">
          <div id="auth-confirm-error" style="font-size:12px;color:#f87171;min-height:18px;margin-bottom:8px;text-align:center"></div>
          <button onclick="confirmCode()" style="width:100%;padding:14px;background:#16a34a;border-radius:10px;color:#fff;font-size:15px;font-weight:700">Confirmar e-mail</button>
        </div>
      </div>
    </div>
  </div>

  <!-- HOME SCREEN -->
  <div id="screen-home" class="screen">
    <div class="header">
      <div class="header-inner">
        <button class="nav-btn" onclick="changeDay(-1)">←</button>
        <div style="text-align:center">
          <div id="hdr-day" style="font-size:10px;color:#6e7681;font-weight:700;letter-spacing:.14em;text-transform:uppercase"></div>
          <div id="hdr-date" style="font-size:18px;font-weight:800;color:#e6edf3"></div>
          <div id="hdr-status" style="font-size:10px;height:14px;color:#34d399;font-weight:600">● HOJE</div>
          <div id="hdr-pct" style="font-size:11px;font-weight:700;margin-top:2px;height:16px"></div>
        </div>
        <button class="nav-btn" id="btn-next" onclick="changeDay(1)">→</button>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:6px;margin-top:6px">
        <button onclick="showGoals()" style="background:none;color:#6e7681;font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid #21262d">⚙️ Metas</button>
        <button onclick="showSups()" style="background:none;color:#6e7681;font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid #21262d">💊 Suplementos</button>
        <button onclick="signOut()" style="background:none;color:#6e7681;font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid #21262d">Sair</button>
      </div>
    </div>
    <div class="body" id="main-body"></div>
  </div>

  <!-- GOALS SCREEN -->
  <div id="screen-goals" class="screen">
    <div class="header">
      <div class="header-inner">
        <button class="nav-btn" onclick="showScreen('home')">←</button>
        <div style="font-size:16px;font-weight:800;color:#e6edf3">Minhas Metas</div>
        <div style="width:44px"></div>
      </div>
    </div>
    <div class="body" id="goals-body"></div>
  </div>

  <!-- SUPS SCREEN -->
  <div id="screen-sups" class="screen">
    <div class="header">
      <div class="header-inner">
        <button class="nav-btn" onclick="showScreen('home')">←</button>
        <div style="font-size:16px;font-weight:800;color:#e6edf3">Meus Suplementos</div>
        <button onclick="editSup(null)" style="background:#1f6feb;color:#fff;padding:7px 13px;border-radius:8px;font-size:14px;font-weight:700">+ Novo</button>
      </div>
    </div>
    <div class="body" id="sups-body"></div>
  </div>

  <!-- HISTORY SCREEN -->
  <div id="screen-history" class="screen">
    <div class="header">
      <div class="header-inner">
        <button class="nav-btn" onclick="showScreen('home')">←</button>
        <div style="font-size:16px;font-weight:800;color:#e6edf3">Histórico</div>
        <div style="width:44px"></div>
      </div>
    </div>
    <div class="body" id="history-body"></div>
  </div>
</div>

<script>
// ─── DATA ────────────────────────────────────────────────────────────────────
const DAYS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MONTHS=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const DOW={
  0:{tr:'descanso',  isFds:true, carb:false,perna:false},
  1:{tr:'musc_bike', isFds:false,carb:false,perna:false},
  2:{tr:'musc_bike', isFds:false,carb:true, perna:false},
  3:{tr:'bike',      isFds:false,carb:false,perna:false},
  4:{tr:'musc_bike', isFds:false,carb:true, perna:true },
  5:{tr:'musc_bike', isFds:false,carb:true, perna:false},
  6:{tr:'cardio',    isFds:true, carb:false,perna:false},
};
const TRAININGS=[
  {id:'musc_bike',label:'Musc + Bike',  icon:'🏋️🚴',color:'#818cf8'},
  {id:'musculacao',label:'Só Musculação',icon:'🏋️',  color:'#818cf8'},
  {id:'bike',      label:'Bike',         icon:'🚴',  color:'#38bdf8'},
  {id:'cardio',    label:'Cardio Longo', icon:'🏃',  color:'#34d399'},
  {id:'descanso',  label:'Descanso ativo',icon:'🛌', color:'#6e7681'},
];
const MEALS=[
  {id:'cafe',  label:'Café da manhã',icon:'☀️',time:'08:00'},
  {id:'almoco',label:'Almoço',       icon:'🥗',time:'12:00'},
  {id:'lanche',label:'Lanche',       icon:'🥛',time:'16:00'},
  {id:'jantar',label:'Jantar',       icon:'🌙',time:'19:00'},
  {id:'ceia',  label:'Ceia',         icon:'🍓',time:'21:00'},
];
function getMealDetail(id,d){
  if(id==='cafe') return d.isFds
    ?{macro:'~350 kcal · ~28g prot',hint:'Pão francês + 2 ovos + Requeijão light + Whey 14g',badge:'Final de semana'}
    :{macro:'~380 kcal · ~35g prot',hint:'Whey 28g + Banana 100g + Creatina + Leite em pó desnatado',badge:'Semana'};
  if(id==='almoco') return d.almocoCarb
    ?{macro:'~520 kcal · ~38g prot',hint:'Salada à vontade + Frango 100g + Macarrão 110g + Legumes 150g',badge:'Com carboidrato'}
    :{macro:'~380 kcal · ~36g prot',hint:'Salada à vontade + Frango 100g + Legumes assados 150g + Azeite 8g',badge:'Low carb'};
  if(id==='lanche') return{macro:'~250 kcal · ~20g prot',hint:'Barrinha de proteína 60g  —  ou  —  3 ovos + Pão grãos + Creme de ricota',badge:'Doce ou salgada'};
  if(id==='jantar'){
    if(d.jantarV==='hamburguer') return{macro:'~480 kcal · ~35g prot',hint:'Pão francês + Hambúrguer patinho 100g + Maionese light + Queijo',badge:'🍔 Hambúrguer'};
    if(d.jantarV==='rap10')      return{macro:'~330 kcal · ~30g prot',hint:'Rap10 fibras + Frango desfiado 80g + Requeijão light 30g',badge:'🌯 Rap10'};
    return{macro:'~380 kcal · ~34g prot',hint:'Salada + Frango 100g + Batata inglesa 120g + Ketchup',badge:'🍽️ Refeição'};
  }
  return{macro:'~200 kcal · ~22g prot',hint:'Iogurte grego + cacau em pó + morangos + Whey misturado',badge:'21:00'};
}
function getSups(tr,isPerna){
  if(customSups.length>0){
    return customSups.filter(s=>
      s.showOn==='always'||
      (s.showOn==='treino'&&tr!=='descanso')||
      (s.showOn==='descanso'&&tr==='descanso')
    );
  }
  const a=[
    {id:'pump',  label:'PUMP — pré-treino',sub:'Cafeína + Ioimbina + Capsaicina + Astaxantina',icon:'⚡',showIf:tr!=='descanso'},
    {id:'oxi',   label:'Oximetalona 4mg',  sub:'1 comprimido antes do treino de perna',icon:'💪',showIf:isPerna},
    {id:'f2',    label:'Fórmula 2',         sub:'Berberina + Inositol + Cromo + Topiramato — antes do jantar',icon:'🟣'},
    {id:'dhea',  label:'DHEA 25mg',         sub:'1 comprimido à noite',icon:'🟡'},
    {id:'omega', label:'Ômega-3',           sub:'Dose diária',icon:'🐟'},
    {id:'zm',    label:'Zinco + Magnésio',  sub:'Growth — dose diária',icon:'⚪'},
    {id:'col',   label:'Colágeno',          sub:'Dose diária',icon:'🟤'},
  ];
  return a.filter(s=>s.showIf===undefined||s.showIf);
}
const SLEEPS=[{id:'s1',l:'< 6h',ok:false},{id:'s2',l:'6–7h',ok:false},{id:'s3',l:'7–8h',ok:true},{id:'s4',l:'8h+',ok:true}];

// ─── CUSTOM SUPPLEMENTS ──────────────────────────────────────────────────────
let customSups=loadCustomSups();
let _supEditId=null;
let _importPreview=[];

function loadCustomSups(){
  try{return JSON.parse(localStorage.getItem('ht:csups')||'[]');}catch{return[];}
}
function saveCustomSups(){
  try{localStorage.setItem('ht:csups',JSON.stringify(customSups));}catch{}
  if(!USE_API||!authToken) return;
  fetch(`${API_URL}?date=__csups__`,{method:'PUT',headers:{'content-type':'application/json',authorization:'Bearer '+authToken},body:JSON.stringify(customSups)}).catch(()=>{});
}
async function syncCustomSups(){
  if(!USE_API||!authToken) return;
  try{
    const r=await fetch(`${API_URL}?date=__csups__`,{headers:{authorization:'Bearer '+authToken}});
    if(r.ok){const d=await r.json();if(Array.isArray(d)&&d.length>0){customSups=d;try{localStorage.setItem('ht:csups',JSON.stringify(d));}catch{}}}
  }catch{}
}

function showSups(){_importPreview=[];renderSupsList();showScreen('sups');}

function renderSupsList(){
  const whenLbl={always:'Sempre · todos os dias',treino:'Só dias de treino',descanso:'Só dias de descanso'};
  const rows=customSups.length>0
    ?customSups.map(s=>`
      <div style="background:#0d1117;border:1px solid #21262d;border-radius:10px;padding:12px 13px;margin-bottom:7px;display:flex;align-items:flex-start;gap:12px">
        <div style="font-size:22px;flex-shrink:0;margin-top:1px">${s.icon||'💊'}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:700;color:#e6edf3;margin-bottom:2px">${s.label}</div>
          ${s.sub?`<div style="font-size:11px;color:#6e7681;margin-bottom:3px">${s.sub}</div>`:''}
          <div style="font-size:10px;color:#4d5863">${whenLbl[s.showOn]||'Sempre'}</div>
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0">
          <button onclick="editSup('${s.id}')" style="background:#21262d;color:#8b949e;padding:6px 10px;border-radius:7px;font-size:12px">✏️</button>
          <button onclick="deleteSup('${s.id}')" style="background:#21262d;color:#f87171;padding:6px 10px;border-radius:7px;font-size:12px">🗑️</button>
        </div>
      </div>`).join('')
    :`<div style="text-align:center;color:#6e7681;padding:28px 0;font-size:13px;line-height:1.7">Nenhum suplemento cadastrado.<br>Adicione manualmente ou importe de PDF/foto.</div>`;

  const apiKey=localStorage.getItem('ht:claude-key')||'';
  const keySection=apiKey
    ?`<div style="font-size:11px;color:#34d399;margin-bottom:10px">✓ Chave API configurada · <button onclick="clearClaudeKey()" style="background:none;color:#6e7681;font-size:11px;text-decoration:underline;padding:0">remover</button></div>`
    :`<div style="font-size:11px;color:#6e7681;margin-bottom:5px">Chave API Anthropic <span style="color:#4d5863">(salva só neste dispositivo)</span></div>
      <input type="password" id="claude-key-input" placeholder="sk-ant-..." autocomplete="off" style="width:100%;background:#0d1117;border:1px solid #21262d;border-radius:8px;padding:9px 12px;color:#e6edf3;font-size:13px;outline:none;margin-bottom:10px">
      <div style="font-size:10px;color:#4d5863;margin-bottom:10px">Obtenha em console.anthropic.com · Necessária apenas para importação automática</div>`;

  const prevHtml=_importPreview.length?renderImportPreviewHtml():'';

  document.getElementById('sups-body').innerHTML=`
    <div class="card fade-in">
      <div class="sec-hdr"><div class="sec-lbl"><span>📎</span> IMPORTAR DE PDF OU FOTO</div></div>
      <div style="font-size:11px;color:#6e7681;margin-bottom:10px">Envie uma receita, prescrição ou foto da sua suplementação. A IA extrai os itens automaticamente.</div>
      ${keySection}
      <label style="display:block;background:#0d1117;border:2px dashed #30363d;border-radius:10px;padding:18px;text-align:center;cursor:pointer;color:#6e7681;font-size:13px;transition:border-color .2s" onmouseover="this.style.borderColor='#3b82f6'" onmouseout="this.style.borderColor='#30363d'">
        📄 Clique para selecionar PDF ou imagem
        <input type="file" id="sup-file-input" accept=".pdf,image/*" style="display:none" onchange="handleSupFile(this)">
      </label>
      <div id="import-status" style="margin-top:8px;font-size:12px;min-height:16px"></div>
      <div id="import-preview">${prevHtml}</div>
    </div>
    <div class="card">
      <div class="sec-hdr"><div class="sec-lbl"><span>💊</span> MINHA LISTA</div><span style="font-size:11px;color:#6e7681">${customSups.length} item${customSups.length!==1?'s':''}</span></div>
      ${rows}
    </div>`;
}

function editSup(id){
  _supEditId=id;
  const s=id?customSups.find(x=>x.id===id):null;
  const showOn=s?.showOn||'always';
  const inp='width:100%;background:#0d1117;border:1px solid #21262d;border-radius:10px;padding:11px 13px;color:#e6edf3;font-size:15px;outline:none';
  const whenDefs=[
    {v:'always', l:'💊 Sempre',   c:'#1f6feb'},
    {v:'treino',  l:'⚡ Treino',  c:'#16a34a'},
    {v:'descanso',l:'😴 Descanso',c:'#7c3aed'},
  ];
  const whenBtns=whenDefs.map(w=>{
    const sel=showOn===w.v;
    return`<button onclick="supSelectWhen('${w.v}')" id="sw-${w.v}" style="flex:1;padding:9px 4px;border-radius:8px;font-size:12px;font-weight:700;background:${sel?w.c:'#0d1117'};color:${sel?'#fff':'#6e7681'};border:1px solid ${sel?w.c:'#21262d'}">${w.l}</button>`;
  }).join('');
  document.getElementById('sups-body').innerHTML=`
    <div class="card fade-in">
      <div class="sec-hdr"><div class="sec-lbl"><span>${id?'✏️':'➕'}</span> ${id?'EDITAR':'NOVO'} SUPLEMENTO</div></div>
      <div style="display:flex;gap:10px;align-items:flex-end;margin-bottom:14px">
        <div>
          <div style="font-size:11px;color:#6e7681;margin-bottom:5px">Ícone</div>
          <input type="text" id="se-icon" value="${s?.icon||''}" placeholder="💊" maxlength="4" style="width:58px;background:#0d1117;border:1px solid #21262d;border-radius:10px;padding:10px;color:#e6edf3;font-size:22px;outline:none;text-align:center">
        </div>
        <div style="flex:1">
          <div style="font-size:11px;color:#6e7681;margin-bottom:5px">Nome e dose</div>
          <input type="text" id="se-label" value="${s?.label||''}" placeholder="ex: Creatina 5g" style="${inp}">
        </div>
      </div>
      <div style="font-size:11px;color:#6e7681;margin-bottom:5px">Horário / instrução</div>
      <input type="text" id="se-sub" value="${s?.sub||''}" placeholder="ex: Com café da manhã · diário" style="${inp};margin-bottom:14px">
      <div style="font-size:11px;color:#6e7681;margin-bottom:7px">Mostrar no checklist</div>
      <input type="hidden" id="se-when" value="${showOn}">
      <div style="display:flex;gap:6px;margin-bottom:20px">${whenBtns}</div>
      <button onclick="saveSupForm()" style="width:100%;padding:13px;background:#1f6feb;border-radius:10px;color:#fff;font-size:14px;font-weight:700;margin-bottom:8px">Salvar</button>
      ${id?`<button onclick="deleteSup('${id}')" style="width:100%;padding:11px;background:#21262d;border:1px solid #30363d;border-radius:10px;color:#f87171;font-size:13px;font-weight:600;margin-bottom:8px">Excluir suplemento</button>`:''}

async function handleSupFile(input){
  const file=input.files[0];if(!file) return;

  statusEl.innerHTML='<span style="color:#fbbf24">⏳ Analisando com IA — aguarde...</span>';
  try{

async function analyzeSupFile(file,apiKey){
  const base64=await new Promise((res,rej)=>{
    const r=new FileReader();r.onload=e=>res(e.target.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);
  });
  const isPdf=file.type==='application/pdf';
  const headers={'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
  if(isPdf) headers['anthropic-beta']='pdfs-2024-09-25';
  const block=isPdf
    ?{type:'document',source:{type:'base64',media_type:'application/pdf',data:base64}}
    :{type:'image',source:{type:'base64',media_type:file.type,data:base64}};
  const resp=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',headers,
    body:JSON.stringify({
      model:'claude-haiku-4-5-20251001',max_tokens:2048,
      messages:[{role:'user',content:[
        block,
        {type:'text',text:'Extraia todos os suplementos, vitaminas e medicamentos deste documento. Retorne APENAS um array JSON: [{"label":"nome e dose","sub":"horário e instrução de uso","icon":"emoji","showOn":"always"}]. Use showOn="treino" se for pré/pós-treino, "descanso" para dias de descanso, "always" para os demais. Somente o JSON, sem explicações.'}
      ]}]
    })
  });
  if(!resp.ok){const e=await resp.json();throw new Error(e.error?.message||'Erro na API Anthropic (verifique a chave)');}
  const data=await resp.json();
  const text=data.content?.[0]?.text||'';
  const m=text.match(/\[[\s\S]*\]/);
  if(!m) throw new Error('Nenhum suplemento identificado no arquivo');
  try{return JSON.parse(m[0]);}catch{throw new Error('Resposta da IA em formato inválido');}
}

function goalsCalcUpdate(){
  const peso=parseFloat(document.getElementById('g-peso-atual')?.value)||0;
  const meta=parseFloat(document.getElementById('g-peso-meta')?.value)||0;
  const alt=parseFloat(document.getElementById('g-altura')?.value)||0;
  const idade=parseInt(document.getElementById('g-idade')?.value)||0;
  const sexo=goals.sexo||'f';
  const treinos=goals.treinosSemana||5;

  // Peso info
  const pesoInfoEl=document.getElementById('g-peso-info');
  if(pesoInfoEl&&peso>0&&meta>0){
    const diff=+(meta-peso).toFixed(1);
    if(Math.abs(diff)<=1) pesoInfoEl.innerHTML=`<span style="color:#34d399">✓ Manutenção — peso próximo da meta</span>`;
    else if(diff<0) pesoInfoEl.innerHTML=`<span style="color:#38bdf8">↓ Objetivo: perder ${Math.abs(diff)} kg</span>`;
    else pesoInfoEl.innerHTML=`<span style="color:#fb923c">↑ Objetivo: ganhar ${diff} kg</span>`;
  } else if(pesoInfoEl) pesoInfoEl.innerHTML='';

  // ── Água: 35 ml/kg (recomendação EFSA/IOM) ─────────────────────────────
  const aguaFormulaEl=document.getElementById('g-agua-formula');
  const aguaBtnsEl=document.getElementById('g-agua-btns');
  const aguaBadgeEl=document.getElementById('g-agua-badge');
  let aguaSug=goals.aguaCopos;
  if(peso>0){
    const ml=Math.round(peso*35);
    const copos=Math.max(6,Math.min(12,Math.round(ml/250)));
    const liters=(ml/1000).toFixed(1).replace('.',',');
    aguaSug=copos;
    if(aguaFormulaEl) aguaFormulaEl.innerHTML=`🧮 <b>${peso} kg</b> × 35 ml = <b>${ml} ml</b> (<b>${liters} L</b>) ÷ 250 ml/copo = <span style="color:#38bdf8;font-weight:700">${copos} copos · ${liters} L/dia</span><br><span style="color:#4d5863;font-size:10px">Base: 30–40 ml/kg — EFSA & Institute of Medicine</span>`;
    if(aguaBadgeEl) aguaBadgeEl.textContent='calculado automaticamente';
  } else {
    if(aguaFormulaEl) aguaFormulaEl.innerHTML='Preencha o peso atual para calcular automaticamente';
    if(aguaBadgeEl) aguaBadgeEl.textContent='';
  }
  if(aguaBtnsEl){
    const coposList=[6,7,8,9,10,11,12];
    const cur=goals.aguaCopos;
    aguaBtnsEl.innerHTML=coposList.map(n=>{
      const sel=cur===n;const isSug=n===aguaSug&&peso>0;
      return`<button onclick="goalsSelectAgua(${n})" id="ga-${n}" style="padding:8px 2px;border-radius:8px;font-size:12px;font-weight:700;background:${sel?'#1d4ed8':'#0d1117'};color:${sel?'#fff':'#6e7681'};border:1px solid ${sel?'#3b82f6':isSug?'#38bdf860':'#21262d'}">${n}${isSug?'<sup style="color:#38bdf8;font-size:8px">✦</sup>':''}</button>`;
    }).join('');
  }

  // ── Calorias: Mifflin-St Jeor + fator atividade + ajuste de meta ────────
  const calFormulaEl=document.getElementById('g-cal-formula');
  const calInpEl=document.getElementById('g-calorias');
  const calBadgeEl=document.getElementById('g-cal-badge');
  if(peso>0&&alt>0&&idade>0){
    const bmr=sexo==='m'
      ?(10*peso+6.25*alt-5*idade+5)
      :(10*peso+6.25*alt-5*idade-161);
    const actMap=[[1,1.2,'sedentário'],[3,1.375,'leve'],[5,1.55,'moderado'],[7,1.725,'intenso']];
    const [,fac,lbl]=actMap.find(([d])=>treinos<=d)||actMap[actMap.length-1];
    const tdee=Math.round(bmr*fac);
    let adj=0,adjHtml='';
    if(meta>0&&Math.abs(meta-peso)>1){
      if(meta<peso){adj=-400;adjHtml=` <span style="color:#38bdf8">− 400 kcal <span style="color:#4d5863">(déficit para perda)</span></span>`;}
      else{adj=300;adjHtml=` <span style="color:#fb923c">+ 300 kcal <span style="color:#4d5863">(superávit para ganho)</span></span>`;}
    }
    const cal=tdee+adj;
    if(calFormulaEl) calFormulaEl.innerHTML=`🧮 BMR <b>${Math.round(bmr)}</b> kcal × <b>${fac}</b> <span style="color:#8b949e">(treino ${lbl})</span> = <b>${tdee}</b> kcal${adjHtml}<br>→ <span style="color:#fb923c;font-weight:700">${cal} kcal/dia</span><br><span style="color:#4d5863;font-size:10px">Fórmula Mifflin-St Jeor (2005) — padrão ISSN/ACSM</span>`;
    if(calInpEl) calInpEl.value=cal;
    if(calBadgeEl) calBadgeEl.textContent='calculado automaticamente';
  } else {
    if(calFormulaEl) calFormulaEl.innerHTML='Preencha perfil, peso e altura para calcular automaticamente';
    if(calBadgeEl) calBadgeEl.textContent='';
  }
}

const COGNITO_CLIENT_ID='__COGNITO_CLIENT_ID__';
const COGNITO_URL='https://cognito-idp.sa-east-1.amazonaws.com/';

let authToken=localStorage.getItem('ht:token')||null;
let authRefresh=localStorage.getItem('ht:refresh')||null;
let pendingEmail='';
let authMode='login';

function cognito(target,body){
  return fetch(COGNITO_URL,{method:'POST',headers:{'Content-Type':'application/x-amz-json-1.1','X-Amz-Target':'AWSCognitoIdentityProviderService.'+target},body:JSON.stringify(body)}).then(r=>r.json());
}
function authTab(mode){
  authMode=mode;
  const isLogin=mode==='login';
  document.getElementById('tab-login').style.cssText=`flex:1;padding:9px;border-radius:8px;font-size:13px;font-weight:700;background:${isLogin?'#21262d':'transparent'};color:${isLogin?'#e6edf3':'#6e7681'}`;

async function authSubmit(){
  const email=document.getElementById('auth-email').value.trim();
  const password=document.getElementById('auth-password').value;
  const errEl=document.getElementById('auth-error');
  const btn=document.getElementById('auth-btn');
  if(!email||!password){errEl.textContent='Preencha e-mail e senha.';return;}
  btn.disabled=true;btn.textContent='...';errEl.textContent='';
  if(authMode==='login'){
    const res=await cognito('InitiateAuth',{AuthFlow:'USER_PASSWORD_AUTH',ClientId:COGNITO_CLIENT_ID,AuthParameters:{USERNAME:email,PASSWORD:password}});
    if(res.AuthenticationResult){
      authToken=res.AuthenticationResult.AccessToken;
      authRefresh=res.AuthenticationResult.RefreshToken;
      localStorage.setItem('ht:token',authToken);
      localStorage.setItem('ht:refresh',authRefresh);
      showScreen('home');render(true);
    }else{
      const t=res.__type||'';
      if(t.includes('NotAuthorized')) errEl.textContent='E-mail ou senha incorretos.';
      else if(t.includes('UserNotConfirmed')) errEl.textContent='Confirme o e-mail antes de entrar.';
      else errEl.textContent='Erro ao entrar. Tente novamente.';
    }
  }else{
    const res=await cognito('SignUp',{ClientId:COGNITO_CLIENT_ID,Username:email,Password:password,UserAttributes:[{Name:'email',Value:email}]});
    if(res.UserSub){
      pendingEmail=email;
      document.getElementById('auth-form').style.display='none';
      document.getElementById('auth-tabs').style.display='none';
      document.getElementById('auth-confirm').style.display='block';
    }else{
      const t=res.__type||'';
      if(t.includes('UsernameExists')) errEl.textContent='E-mail já cadastrado.';
      else if(t.includes('InvalidPassword')) errEl.textContent='Senha fraca. Use pelo menos 8 caracteres.';
      else errEl.textContent='Erro ao criar conta. Tente novamente.';
    }
  }
  btn.disabled=false;btn.textContent=authMode==='login'?'Entrar':'Criar conta';
}
async function confirmCode(){
  const code=document.getElementById('auth-code').value.trim();
  const errEl=document.getElementById('auth-confirm-error');
  if(!code){errEl.textContent='Digite o código.';return;}
  const res=await cognito('ConfirmSignUp',{ClientId:COGNITO_CLIENT_ID,Username:pendingEmail,ConfirmationCode:code});
  if(res.__type){errEl.textContent='Código inválido ou expirado.';return;}
  const pw=document.getElementById('auth-password').value;
  const login=await cognito('InitiateAuth',{AuthFlow:'USER_PASSWORD_AUTH',ClientId:COGNITO_CLIENT_ID,AuthParameters:{USERNAME:pendingEmail,PASSWORD:pw}});
  if(login.AuthenticationResult){
    authToken=login.AuthenticationResult.AccessToken;
    authRefresh=login.AuthenticationResult.RefreshToken;
    localStorage.setItem('ht:token',authToken);
    localStorage.setItem('ht:refresh',authRefresh);
    showScreen('home');render(true);
  }else{
    document.getElementById('auth-form').style.display='block';
    document.getElementById('auth-tabs').style.display='flex';
    document.getElementById('auth-confirm').style.display='none';
    authTab('login');
    document.getElementById('auth-error').textContent='Conta confirmada! Faça login.';
  }
}
async function tryRefresh(){
  if(!authRefresh) return false;
  const res=await cognito('InitiateAuth',{AuthFlow:'REFRESH_TOKEN_AUTH',ClientId:COGNITO_CLIENT_ID,AuthParameters:{REFRESH_TOKEN:authRefresh}});
  if(res.AuthenticationResult){
    authToken=res.AuthenticationResult.AccessToken;
    localStorage.setItem('ht:token',authToken);
    return true;
  }
  return false;
}
function signOut(){
  authToken=null;authRefresh=null;
  localStorage.removeItem('ht:token');localStorage.removeItem('ht:refresh');
  showScreen('auth');
}

// ─── API ─────────────────────────────────────────────────────────────────────
const API_URL='__API_URL__';
const USE_API=API_URL.startsWith('https://');

function loadDay(date){
  try{const s=localStorage.getItem('ht:'+date);return s?JSON.parse(s):makeEmpty(date);}
  catch{return makeEmpty(date);}
}
async function fetchRemote(date){
  if(!authToken) return null;
  try{
    const r=await fetch(`${API_URL}?date=${date}`,{headers:{authorization:'Bearer '+authToken}});
    if(r.status===401){const ok=await tryRefresh();if(ok)return fetchRemote(date);signOut();return null;}
    if(r.ok){const d=await r.json();return d||null;}
  }catch{}
  return null;
}
function saveDay(date,d){
  try{localStorage.setItem('ht:'+date,JSON.stringify(d));}catch{}
  if(!USE_API||!authToken) return;
  fetch(`${API_URL}?date=${date}`,{method:'PUT',headers:{'content-type':'application/json',authorization:'Bearer '+authToken},body:JSON.stringify(d)}).catch(()=>{});
}

function calcScore(d){
  const sups=getSups(d.tr,d.isPerna);
  const mD=MEALS.filter(m=>d.meals[m.id]).length;
  const wD=d.water>=goals.aguaCopos?1:0;
  const slD=SLEEPS.find(s=>s.id===d.sleep)?.ok?1:0;
  const coD=d.sleepOk?1:0;
  const cD=d.cardio>=goals.cardioMin?1:0;
  const spD=sups.filter(s=>d.sups[s.id]).length;
  const isGym=d.tr==='musc_bike'||d.tr==='musculacao';
  const tD=isGym?(d.sups['treino_ok']?1:0):0;
  const tT=isGym?1:0;
  const total=MEALS.length+1+2+1+sups.length+tT;
  const done=mD+wD+slD+coD+cD+spD+tD;
  return{meals:{d:mD,t:MEALS.length},water:{d:wD,t:1},sleep:{d:slD+coD,t:2},
         cardio:{d:cD,t:1},sups:{d:spD,t:sups.length},treino:{d:tD,t:tT},
         pct:total>0?Math.round(done/total*100):0,done,total};
}

// ─── CLOUD SYNC ──────────────────────────────────────────────────────────────
async function syncGoals(){
  if(!USE_API||!authToken) return;
  try{
    const r=await fetch(`${API_URL}?date=__goals__`,{headers:{authorization:'Bearer '+authToken}});
    if(r.ok){const d=await r.json();if(d&&typeof d==='object'&&!Array.isArray(d)){goals={...DEFAULT_GOALS,...d};try{localStorage.setItem('ht:goals',JSON.stringify(goals));}catch{}}}
  }catch{}
  try{
    const r=await fetch(`${API_URL}?date=__csups__`,{headers:{authorization:'Bearer '+authToken}});
    if(r.ok){const d=await r.json();if(Array.isArray(d)&&d.length>0){customSups=d;try{localStorage.setItem('ht:csups',JSON.stringify(d));}catch{}}}
  }catch{}
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
async function render(syncG=false){
  dayData=loadDay(currentDate);
  renderUI();
  if(USE_API){
    if(syncG) await syncGoals();
    const remote=await fetchRemote(currentDate);
    if(remote){
      if(JSON.stringify(remote)!==JSON.stringify(dayData)){
        dayData=remote;
        try{localStorage.setItem('ht:'+currentDate,JSON.stringify(dayData));}catch{}
        renderUI();
      }
    }else if(JSON.stringify(dayData)!==JSON.stringify(makeEmpty(currentDate))){
      saveDay(currentDate,dayData);
    }
  }
}

// ─── HISTORY ─────────────────────────────────────────────────────────────────
function showHistory(){
  const days=60;
  const hist=[];
  for(let i=0;i<days;i++){
    const d=addDays(today(),-i);
    const dd=loadDay(d);
    hist.push({date:d,pct:calcScore(dd).pct});
  }
  const avg=Math.round(hist.reduce((a,d)=>a+d.pct,0)/hist.length);
  const great=hist.filter(d=>d.pct>=80).length;
  let streak=0; for(const d of hist){if(d.pct>=80)streak++;else break;}

  const stats=[{l:'Média 60d',v:avg+'%',c:'#818cf8'},{l:'Dias ótimos',v:great,c:'#34d399'},{l:'Sequência',v:streak+'d',c:'#fbbf24'}];
  const statsHtml=stats.map(s=>`<div class="card" style="padding:14px 10px;text-align:center;margin-bottom:0"><div style="font-size:22px;font-weight:800;color:${s.c}">${s.v}</div><div style="font-size:10px;color:#6e7681;font-weight:600;margin-top:3px">${s.l}</div></div>`).join('');

  const hist60=[...hist].reverse();
  const firstDow=getDow(hist60[0].date);
  const offsetCells=Array(firstDow).fill('<div></div>').join('');
  const calCells=hist60.map(({date,pct})=>{
    const bg=pct===0?'#1c2128':pct>=80?'#166534':pct>=55?'#78350f':'#7f1d1d';
    const c=pct===0?'#30363d':pct>=80?'#86efac':pct>=55?'#fcd34d':'#fca5a5';
    const {date:d}=dispDate(date);
    return`<div title="${d} — ${pct}%" style="aspect-ratio:1;border-radius:6px;background:${bg};display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:${c}">${pct>0?pct:''}</div>`;
  }).join('');

  const listRows=hist.map(({date,pct})=>{
    const{day,date:d}=dispDate(date);
    const c=pct>=80?'#34d399':pct>=55?'#fbbf24':pct>0?'#f87171':'#30363d';
    return`<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 10px;background:#0d1117;border-radius:10px;border:1px solid #21262d;margin-bottom:6px">
      <div><span style="font-size:12px;font-weight:700;color:#e6edf3">${day} </span><span style="font-size:12px;color:#6e7681">${d}</span></div>
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:60px;height:4px;background:#21262d;border-radius:99px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${c};border-radius:99px"></div></div>
        <span style="font-size:12px;font-weight:700;color:${c};font-family:'DM Mono',monospace;width:32px;text-align:right">${pct}%</span>
      </div>
    </div>`;
  }).join('');

  document.getElementById('history-body').innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px">${statsHtml}</div>
    <div class="card">
      <div class="sec-hdr"><div class="sec-lbl"><span>📅</span> ÚLTIMOS 60 DIAS</div></div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">
        ${DAYS.map(d=>`<div style="font-size:9px;color:#6e7681;font-weight:700;text-align:center;margin-bottom:4px">${d}</div>`).join('')}
        ${offsetCells}${calCells}
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;justify-content:center;flex-wrap:wrap">
        ${[{c:'#166534',tc:'#86efac',l:'≥80%'},{c:'#78350f',tc:'#fcd34d',l:'55–79%'},{c:'#7f1d1d',tc:'#fca5a5',l:'<55%'},{c:'#1c2128',tc:'#30363d',l:'Sem dado'}].map(x=>`<div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:10px;border-radius:3px;background:${x.c}"></div><span style="font-size:10px;color:${x.tc}">${x.l}</span></div>`).join('')}
      </div>
    </div>
    <div class="card"><div class="sec-hdr"><div class="sec-lbl"><span>📋</span> DETALHES</div></div><div style="max-height:360px;overflow-y:auto">${listRows}</div></div>`;

  showScreen('history');
}

// ─── ACTIONS ─────────────────────────────────────────────────────────────────
function save(){saveDay(currentDate,dayData);}
function changeDay(n){currentDate=addDays(currentDate,n);render();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('screen-'+id).classList.add('active');}
function toggleMeal(id){dayData.meals[id]=!dayData.meals[id];save();renderUI();}
function toggleSup(id){dayData.sups[id]=!dayData.sups[id];save();renderUI();}
function setTr(id){dayData.tr=id;if(id==='musc_bike'&&getDow(currentDate)===4)dayData.isPerna=true;save();renderUI();}
function toggle(k){dayData[k]=!dayData[k];save();renderUI();}
function setJantar(v){dayData.jantarV=v;save();renderUI();}
function setCardio(m){dayData.cardio=dayData.cardio===m?0:m;save();renderUI();}
function setWater(i){dayData.water=i<dayData.water?i:i+1;save();renderUI();}
function addWater(n){dayData.water=Math.max(0,Math.min(12,dayData.water+n));save();renderUI();}
function setSleep(id){dayData.sleep=id;save();renderUI();}
function setSleepOk(v){dayData.sleepOk=v;save();renderUI();}
function setNotes(v){dayData.notes=v;save();}
function dispDate(s){const[y,m,d]=s.split('-');const dt=new Date(+y,+m-1,+d);return{day:DAYS[dt.getDay()],date:d+' '+MONTHS[+m-1]};}

// ─── INIT ─────────────────────────────────────────────────────────────────────
if(authToken){showScreen('home');render(true);}else{showScreen('auth');}
</script>
</body>
</html>
