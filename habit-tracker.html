<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1C1917">
<title>Rotina Diária</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F5F2;--card:#FFFFFF;--deep:#1C1917;
  --accent:#6C63FF;--accent-light:#EDE9FF;--gold:#C9A84C;
  --txt:#1C1917;--muted:#78716C;--dim:#A8A29E;--border:#E7E5E4;
  --r-sm:6px;--r-md:12px;--r-lg:20px;--r-xl:32px;
  --shadow:0 1px 3px rgba(28,25,23,.06),0 4px 12px rgba(28,25,23,.04);
  --sidebar:240px;--mhdr:52px;--bnav:64px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;-webkit-tap-highlight-color:transparent;font-size:14px;}
button{cursor:pointer;border:none;font-family:inherit;transition:all .13s ease;}
button:active{transform:scale(.96);opacity:.88;}
textarea,input,select{font-family:inherit;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* Animations */
.fade-in{animation:fadeIn .22s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes streakPulse{0%,100%{box-shadow:0 0 0 0 rgba(201,168,76,.4)}70%{box-shadow:0 0 0 6px rgba(201,168,76,0)}}
@keyframes confetti-fall{0%{opacity:1;transform:translateY(0) rotate(0deg)}100%{opacity:0;transform:translateY(100vh) rotate(720deg)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.progress-fill{transition:width .6s cubic-bezier(.34,1.56,.64,1);}
.goal-bs-backdrop{position:fixed;inset:0;background:rgba(28,25,23,.5);z-index:200;display:none;align-items:flex-end;}
.goal-bs-backdrop.open{display:flex;}
.goal-bs{width:100%;background:var(--card);border-radius:24px 24px 0 0;padding:16px 20px 32px;max-height:80vh;overflow-y:auto;animation:slideUp .22s ease;}
.goal-bs-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px;}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

/* Layout */
.app-layout{display:flex;min-height:100vh;}
.sidebar{
  width:var(--sidebar);flex-shrink:0;background:var(--deep);
  position:fixed;top:0;left:0;bottom:0;
  display:none;flex-direction:column;z-index:100;overflow-y:auto;
}
.main-content{flex:1;min-width:0;display:flex;flex-direction:column;}
.screens-wrap{flex:1;padding-bottom:calc(var(--bnav) + 8px);}

@media(min-width:768px){
  .sidebar{display:flex;}
  .main-content{margin-left:var(--sidebar);}
  .screens-wrap{padding-bottom:40px;}
  .bnav{display:none!important;}
  .mobile-header{display:none!important;}
}

/* Sidebar */
.sb-logo{padding:24px 20px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08);}
.sb-logo-icon{width:30px;height:30px;background:var(--accent);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.sb-logo-text{font-family:'Fraunces',serif;font-weight:300;font-size:15px;color:#fff;letter-spacing:-.01em;}
.sb-nav{flex:1;padding:10px 0;}
.sb-item{
  display:flex;align-items:center;gap:12px;padding:10px 20px;width:100%;background:none;
  color:rgba(255,255,255,.5);font-size:14px;font-weight:400;border-radius:0;cursor:pointer;
  border:none;font-family:'DM Sans',sans-serif;transition:all .15s;text-align:left;
}
.sb-item:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.8);}
.sb-item.active{background:rgba(108,99,255,.18);color:var(--accent);}
.sb-item-icon{font-size:17px;flex-shrink:0;width:20px;text-align:center;}
.sb-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;}
.sb-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:700;border:2px solid rgba(108,99,255,.4);flex-shrink:0;}

/* Streak badge */
.streak-badge{
  display:inline-flex;align-items:center;gap:4px;padding:4px 10px;
  border-radius:var(--r-xl);background:rgba(201,168,76,.12);
  border:1px solid rgba(201,168,76,.3);
  font-family:'DM Mono',monospace;font-weight:500;font-size:13px;color:var(--gold);
}
.streak-badge.streak-hot{animation:streakPulse 2s ease-in-out infinite;}

/* Mobile header */
.mobile-header{
  height:var(--mhdr);background:var(--deep);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;position:sticky;top:0;z-index:50;flex-shrink:0;
}
.mh-logo{font-family:'Fraunces',serif;font-weight:300;font-size:14px;color:#fff;display:flex;align-items:center;gap:7px;}
.mh-dot{width:26px;height:26px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;}
.mh-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:700;border:2px solid rgba(108,99,255,.4);}

/* Bottom nav */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(255,255,255,.93);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--border);height:var(--bnav);}
.bnav-inner{display:flex;height:100%;}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 2px;gap:2px;background:none;color:var(--muted);font-size:10px;font-weight:500;border-radius:0;min-height:44px;}
.bnav-btn.active{color:var(--accent);}
.bnav-icon{font-size:20px;line-height:1.2;}

/* Screen header */
.header{background:var(--card);border-bottom:1px solid var(--border);padding:12px 16px;position:sticky;top:var(--mhdr);z-index:40;}
.header-inner{display:flex;align-items:center;justify-content:space-between;}
@media(min-width:768px){.header{top:0;padding:16px 40px;}.header-inner{max-width:720px;}}

/* Nav btn */
.nav-btn{background:var(--bg);color:var(--muted);padding:7px 13px;border-radius:var(--r-sm);font-size:14px;border:1px solid var(--border);}

/* Body */
.body{padding:16px 14px 16px;}
@media(min-width:768px){.body{padding:28px 40px;max-width:760px;}}

/* Card */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:15px 14px;margin-bottom:10px;}
@media(min-width:768px){.card{transition:box-shadow .15s,transform .15s;}.card:hover{box-shadow:var(--shadow);transform:translateY(-1px);}}

/* Sections */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.sec-lbl{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}

/* Check rows */
.check-row{width:100%;display:flex;align-items:flex-start;gap:12px;padding:11px 12px;border-radius:var(--r-sm);text-align:left;background:var(--bg);border:1px solid var(--border);margin-bottom:7px;}
.check-row.done{background:#F0FDF4;border-color:#BBF7D0;}
.check-circle{width:22px;height:22px;border-radius:50%;flex-shrink:0;margin-top:1px;background:transparent;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;transition:all .2s ease;font-size:12px;font-weight:800;color:#fff;}
.check-circle.done{background:#4ADE80;border-color:#4ADE80;}

/* Score bars */
.score-bar-wrap{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.score-bar-bg{flex:1;height:6px;background:var(--border);border-radius:99px;overflow:hidden;}
.score-bar-fill{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.34,1.56,.64,1);}

/* Meal cards */
.meal-card{width:100%;text-align:left;border-radius:var(--r-sm);padding:12px 13px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:flex-start;gap:12px;margin-bottom:7px;}
.meal-card.done{background:#F0FDF4;border-color:#BBF7D0;}

/* Badge */
.badge{display:inline-block;background:var(--accent-light);border-radius:4px;padding:2px 7px;font-size:10px;color:var(--accent);font-weight:500;margin-top:5px;}

/* Water */
.water-bar{flex:1;height:32px;border-radius:var(--r-sm);transition:background .2s;background:var(--bg);border:1px solid var(--border);}
.water-bar.active{background:#60A5FA;border-color:#3B82F6;}

/* Chips */
.toggle-chip{flex:1;padding:7px 8px;border-radius:var(--r-sm);font-size:11px;font-weight:500;background:var(--bg);color:var(--muted);border:1px solid var(--border);}
.toggle-chip.active{background:rgba(249,115,22,.08);color:#EA580C;border-color:rgba(249,115,22,.3);}
.toggle-chip.active.fds{background:rgba(74,222,128,.1);color:#16A34A;border-color:rgba(74,222,128,.4);}

/* Pending dot */
.pending-dot{width:5px;height:5px;border-radius:50%;background:#F87171;margin-top:7px;flex-shrink:0;}

/* Screen */
.screen{display:none;}.screen.active{display:block;}

/* Toast */
.toast{position:fixed;top:68px;left:50%;transform:translateX(-50%) translateY(-16px);background:var(--accent);color:#fff;padding:11px 20px;border-radius:var(--r-lg);font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(108,99,255,.35);z-index:999;opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
/* Gym reorder */
.gym-drag-handle{color:#D4D0CE;font-size:15px;cursor:grab;padding:0 4px 0 0;-webkit-user-select:none;user-select:none;display:none;line-height:1;align-self:center;flex-shrink:0}
@media(hover:hover){.gym-plan-card:hover .gym-drag-handle{display:block}}
.gym-reorder-mode .gym-drag-handle{display:block!important}
.gym-card-lifting{opacity:.45!important;transform:scale(1.01)!important;box-shadow:0 10px 28px rgba(0,0,0,.13)!important}
.gym-drop-above{border-top:2.5px solid var(--accent)!important;padding-top:6px!important}
/* Gym bi-set */
.gym-biset-wrap{border:1.5px solid #818cf8;border-radius:13px;padding:6px 6px 2px;margin-bottom:8px;position:relative}
.gym-biset-badge{position:absolute;top:-9px;left:10px;background:#818cf8;color:#fff;font-size:9px;font-weight:700;padding:1px 7px;border-radius:4px;letter-spacing:.5px}
.gym-group-btn{width:100%;padding:5px 0;background:none;border:none;color:#A8A29E;font-size:10.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;margin:2px 0}
.gym-group-btn:hover,.gym-group-btn:active{color:var(--accent);background:none;transform:none;opacity:1}
/* Gym edit sheet */
.gym-edit-bd{position:fixed;inset:0;z-index:300;background:rgba(28,25,23,.5);display:flex;align-items:flex-end;justify-content:center}
.gym-edit-sheet{width:100%;max-width:480px;background:#fff;border-radius:20px 20px 0 0;padding:20px 16px 32px;max-height:88vh;overflow-y:auto;animation:slideUp .22s ease}
.gym-chip{display:inline-flex;align-items:center;gap:3px;background:#EDE9FF;color:#6C63FF;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600;margin:2px 3px 2px 0}
.gym-chip button{background:none;color:#6C63FF;font-size:10px;padding:0;line-height:1;transform:none!important;opacity:1!important;cursor:pointer;border:none}
.gym-chip-add{display:inline-flex;align-items:center;gap:3px;background:#F0EFED;color:#78716C;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;border:none;margin:2px 0;transform:none!important;font-family:inherit}
.gym-muscle-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.gym-muscle-opt{padding:8px 4px;background:#FAFAF9;border:1.5px solid #E7E5E4;border-radius:8px;font-size:11px;color:#1C1917;cursor:pointer;text-align:center;font-family:inherit}
.gym-muscle-opt.sel{background:#EDE9FF;border-color:#6C63FF;color:#6C63FF;font-weight:600}
</style>
</head>
<body>
<div class="app-layout">

<!-- SIDEBAR (desktop) -->
<aside class="sidebar" id="sidebar">
  <div class="sb-logo">
    <div class="sb-logo-icon">📋</div>
    <span class="sb-logo-text">Rotina Diária</span>
  </div>
  <nav class="sb-nav">
    <button type="button" class="sb-item active" id="snav-hoje" onclick="showBnav('hoje')"><span class="sb-item-icon">📊</span>Hoje</button>
    <button type="button" class="sb-item" id="snav-nutricao" onclick="showBnav('nutricao')"><span class="sb-item-icon">🍽️</span>Nutrição</button>
    <button type="button" class="sb-item" id="snav-gym" onclick="showBnav('gym')"><span class="sb-item-icon">🏋️</span>Treino</button>
    <button type="button" class="sb-item" id="snav-semana" onclick="showBnav('semana')"><span class="sb-item-icon">📅</span>Semana</button>
    <button type="button" class="sb-item" id="snav-mais" onclick="showBnav('mais')"><span class="sb-item-icon">☰</span>Mais</button>
  </nav>
  <div class="sb-footer">
    <div id="sb-streak"></div>
    <div style="flex:1"></div>
    <div class="sb-avatar">B</div>
  </div>
</aside>

<!-- MAIN -->
<div class="main-content">

<!-- MOBILE HEADER -->
<header class="mobile-header">
  <div class="mh-logo"><div class="mh-dot">📋</div>RD</div>
  <div id="mh-streak"></div>
  <div class="mh-avatar">B</div>
</header>

<div class="screens-wrap">
<div id="app">
  <!-- AUTH SCREEN -->
  <div id="screen-auth" class="screen active">
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)">
      <div style="width:100%;max-width:360px">
        <div style="text-align:center;margin-bottom:32px">
          <div style="font-size:36px;margin-bottom:10px">📋</div>
          <div style="font-family:'Fraunces',serif;font-size:24px;font-weight:400;color:var(--txt)">Rotina Diária</div>
          <div style="font-size:13px;color:var(--muted);margin-top:5px">Seus hábitos, em qualquer dispositivo</div>
        </div>
        <div id="auth-tabs" style="display:flex;background:var(--border);border-radius:10px;padding:3px;margin-bottom:20px;">
          <button onclick="authTab('login')" id="tab-login" style="flex:1;padding:9px;border-radius:8px;font-size:13px;font-weight:500;background:var(--card);color:var(--txt);border:none">Entrar</button>
          <button onclick="authTab('register')" id="tab-register" style="flex:1;padding:9px;border-radius:8px;font-size:13px;font-weight:500;background:transparent;color:var(--muted);border:none">Criar conta</button>
        </div>
        <div id="auth-form">
          <input id="auth-email" type="email" placeholder="E-mail" autocomplete="email" style="width:100%;background:#FAFAF9;border:1px solid var(--border);border-radius:10px;padding:13px 14px;color:var(--txt);font-size:14px;margin-bottom:10px;outline:none">
          <input id="auth-password" type="password" placeholder="Senha (mínimo 8 caracteres)" autocomplete="current-password" style="width:100%;background:#FAFAF9;border:1px solid var(--border);border-radius:10px;padding:13px 14px;color:var(--txt);font-size:14px;margin-bottom:6px;outline:none">
          <div id="auth-error" style="font-size:12px;color:#DC2626;min-height:18px;margin-bottom:8px;text-align:center"></div>
          <button onclick="authSubmit()" id="auth-btn" style="width:100%;padding:14px;background:var(--accent);border-radius:10px;color:#fff;font-size:15px;font-weight:500">Entrar</button>
        </div>
        <div id="auth-confirm" style="display:none">
          <div style="font-size:13px;color:var(--muted);text-align:center;margin-bottom:16px;line-height:1.5">Enviamos um código para o seu e-mail.<br>Digite abaixo para confirmar a conta.</div>
          <input id="auth-code" type="text" inputmode="numeric" placeholder="000000" style="width:100%;background:#FAFAF9;border:1px solid var(--border);border-radius:10px;padding:13px 14px;color:var(--txt);font-size:22px;margin-bottom:6px;outline:none;text-align:center;letter-spacing:8px">
          <div id="auth-confirm-error" style="font-size:12px;color:#DC2626;min-height:18px;margin-bottom:8px;text-align:center"></div>
          <button onclick="confirmCode()" style="width:100%;padding:14px;background:#16A34A;border-radius:10px;color:#fff;font-size:15px;font-weight:500">Confirmar e-mail</button>
        </div>
      </div>
    </div>
  </div>

  <!-- HOME SCREEN -->
  <div id="screen-home" class="screen">
    <div class="header">
      <div class="header-inner">
        <button class="nav-btn" onclick="changeDay(-1)">←</button>
        <div style="text-align:center">
          <div id="hdr-day" style="font-size:10px;color:var(--muted);font-weight:500;letter-spacing:.12em;text-transform:uppercase"></div>
          <div id="hdr-date" style="font-family:'Fraunces',serif;font-size:18px;font-weight:400;color:var(--txt)"></div>
          <div id="hdr-status" style="font-size:10px;height:14px;color:#16A34A;font-weight:500">● HOJE</div>
          <div id="hdr-pct" style="font-size:11px;font-weight:500;margin-top:2px;height:16px;font-family:'DM Mono',monospace"></div>
        </div>
        <button class="nav-btn" id="btn-next" onclick="changeDay(1)">→</button>
      </div>
      <div id="home-section-label" style="text-align:center;font-size:10px;font-weight:500;letter-spacing:.1em;color:var(--dim);padding-top:4px;padding-bottom:2px"></div>
    </div>
    <div class="body" id="main-body"></div>
  </div>

  <!-- GOALS SCREEN -->
  <div id="screen-goals" class="screen">
    <div class="header">
      <div class="header-inner">
        <button class="nav-btn" onclick="showMais()">←</button>
        <div style="font-family:'Fraunces',serif;font-size:18px;font-weight:400;color:var(--txt)">Minhas Metas</div>
        <div style="width:44px"></div>
      </div>
    </div>
    <div class="body" id="goals-body"></div>
  </div>

  <!-- SUPS SCREEN -->
  <div id="screen-sups" class="screen">
    <div class="header">
      <div class="header-inner">
        <button class="nav-btn" onclick="showMais()">←</button>
        <div style="font-family:'Fraunces',serif;font-size:18px;font-weight:400;color:var(--txt)">Gerenciar Suplementos</div>
        <button onclick="editSup(null)" style="background:var(--accent);color:#fff;padding:7px 13px;border-radius:var(--r-sm);font-size:13px;font-weight:500">+ Novo</button>
      </div>
    </div>
    <div class="body" id="sups-body"></div>
  </div>

  <!-- HISTORY SCREEN -->
  <div id="screen-history" class="screen">
    <div class="header">
      <div class="header-inner">
        <button class="nav-btn" onclick="showMais()">←</button>
        <div style="font-family:'Fraunces',serif;font-size:18px;font-weight:400;color:var(--txt)">Histórico</div>
        <div style="width:44px"></div>
      </div>
    </div>
    <div class="body" id="history-body"></div>
  </div>

  <!-- BODY COMP SCREEN -->
  <div id="screen-body" class="screen">
    <div class="header">
      <div class="header-inner">
        <button class="nav-btn" onclick="showMais()">←</button>
        <div style="font-family:'Fraunces',serif;font-size:18px;font-weight:400;color:var(--txt)">Composição Corporal</div>
        <div style="width:44px"></div>
      </div>
    </div>
    <div class="body" id="body-comp-body"></div>
  </div>

  <!-- GYM SCREEN -->
  <div id="screen-gym" class="screen">
    <div class="header">
      <div class="header-inner">
        <button class="nav-btn" onclick="showBnav('hoje')">←</button>
        <div style="text-align:center">
          <div id="gym-hdr-info" style="font-size:10px;color:var(--muted);font-weight:500;letter-spacing:.1em;text-transform:uppercase"></div>
          <div id="gym-hdr-title" style="font-family:'Fraunces',serif;font-size:18px;font-weight:400;color:var(--txt)">Log de Treino</div>
        </div>
        <button onclick="gymTogglePlan()" id="gym-plan-btn" style="background:var(--bg);color:var(--muted);padding:6px 11px;border-radius:var(--r-sm);font-size:12px;font-weight:500;border:1px solid var(--border)">📋 Plano</button>
      </div>
    </div>
    <div id="gym-subtabs" style="display:flex;border-top:1px solid var(--border);background:var(--card)">
      <button id="gym-tab-hoje" onclick="gymSetView('hoje')" style="flex:1;padding:9px;font-size:12px;font-weight:500;background:none;color:var(--accent);border-bottom:2px solid var(--accent);border-radius:0">Hoje</button>

function saveSupForm(){

function deleteSup(id){

// ── Importação via IA ─────────────────────────────────────────────────────────
async function analyzeViaLambda(file,context){
  const base64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});
  const resp=await fetch(`${API_URL}?action=analyze`,{
    method:'POST',
    headers:{'content-type':'application/json',authorization:'Bearer '+authToken},
    body:JSON.stringify({file:base64,mimeType:file.type,context})
  });
  const data=await resp.json();
  if(!resp.ok) throw new Error(data.error||'Erro ao analisar arquivo');
  return data.items;
}

async function handleSupFile(input){
  const file=input.files[0];if(!file) return;
  const statusEl=document.getElementById('import-status');
  statusEl.innerHTML='<span style="color:#D97706">⏳ Analisando com IA — aguarde...</span>';
  try{
    const sups=await analyzeViaLambda(file,'supplements');
    _importPreview=sups.map((s,i)=>({...{showOn:'always'},...s,id:'cs_'+Date.now()+i,_checked:true}));
    document.getElementById('import-preview').innerHTML=renderImportPreviewHtml();
    statusEl.innerHTML=`<span style="color:#16A34A">✓ ${sups.length} item(s) encontrado(s) — selecione os que deseja importar</span>`;
  }catch(e){
    statusEl.innerHTML=`<span style="color:#f87171">❌ ${e.message}</span>`;
  }
}

function renderImportPreviewHtml(){
  if(!_importPreview.length) return '';
  const rows=_importPreview.map((s,i)=>`
    <label style="display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:#FAFAF9;border:1px solid #E7E5E4;border-radius:9px;margin-bottom:6px;cursor:pointer">
      <input type="checkbox" id="imp-${i}" ${s._checked?'checked':''} style="margin-top:3px;width:15px;height:15px;accent-color:#6C63FF;flex-shrink:0">
      <div style="flex:1">

      +'<div style="width:28px;text-align:center;flex-shrink:0">'
        +'<div style="font-size:9px;font-weight:600;color:'+(isToday?'var(--accent)':'var(--dim)')+';letter-spacing:.06em">'+label+'</div>'
        +'<div style="font-size:13px;font-weight:700;color:'+(isToday?'var(--txt)':'var(--muted)')+'">'+parseInt(dNum,10)+'</div>'
      +'</div>'
      +'<div style="flex:1;min-width:0">'
        +'<div style="font-size:12px;font-weight:600;color:'+trColor+'">'+trName+mark+'</div>'
        +(groups.length?'<div style="font-size:10px;color:var(--dim);margin-top:2px">'+groups.join(' · ')+'</div>':'')
      +'</div>'
      +(dur>0?'<div style="font-size:11px;color:var(--dim);font-family:\'DM Mono\',monospace;align-self:center">'+dur+'min</div>':'')
      +'</div>';
  }).join('');

  const balance=ALL.map(g=>{
    const p=pct(g),sets=muscleSets[g]||0;
    const lbl=p===0?'Não treinou':p<30?(sets+' séries — leve'):p<65?(sets+' séries — moderado'):(sets+' séries — intenso');
    const color=p===0?'var(--dim)':p<30?'#8B7FE8':p<65?'#6C63FF':'#F97316';
    return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">'
      +'<div style="flex:1;font-size:12px;font-weight:500;color:var(--txt)">'+g+'</div>'
      +'<div style="font-size:11px;color:'+color+'">'+lbl+'</div>'
      +'</div>';
  }).join('');

  const untrained=ALL.filter(g=>!muscleSets[g]);
  const remaining=weekDays.filter(w=>w.date>todayStr).length;
  let sugHtml='';
  if(untrained.length===0){
    sugHtml='<div id="week-sug-card" class="card" style="background:#F0FDF4;border-color:rgba(22,163,74,.2)">'
      +'<div style="display:flex;align-items:center;gap:10px">'
      +'<div style="font-size:22px">💪</div>'
      +'<div><div style="font-size:13px;font-weight:700;color:#16A34A">Semana equilibrada!</div>'
      +'<div style="font-size:11px;color:var(--muted);margin-top:2px">Todos os grupos musculares foram treinados.</div></div>'
      +'</div></div>';
  } else if(remaining>0){
    sugHtml='<div id="week-sug-card" class="card">'
      +'<div class="sec-hdr"><div class="sec-lbl">Sugestão</div></div>'
      +'<div style="font-size:12px;color:var(--muted);padding:8px 0">Carregando sugestão...</div>'
      +'</div>';
  }

  body.innerHTML='<div class="fade-in">'
    +'<div class="card">'
    +'<div class="sec-hdr" style="margin-bottom:10px"><div class="sec-lbl">Mapa Muscular · '+weekLabel+'</div></div>'
    +makeSVG()
    +legendHtml
    +'</div>'
    +'<div class="card">'
    +'<div class="sec-hdr"><div class="sec-lbl">Esta Semana</div></div>'
    +timeline
    +'</div>'
    +'<div class="card">'
    +'<div class="sec-hdr"><div class="sec-lbl">Equilíbrio Muscular</div></div>'
    +balance
    +(cardioMin>0?'<div style="display:flex;align-items:center;gap:10px;padding:8px 0"><div style="flex:1;font-size:12px;font-weight:500;color:var(--txt)">Cardio</div><div style="font-size:11px;color:#16A34A">'+cardioMin+' min</div></div>':'')
    +'</div>'
    +sugHtml
    +'</div>';
  if(untrained.length>0&&remaining>0){
    const _tok=localStorage.getItem('ht:token')||'';
    fetch(API_URL+'?action=week_suggestion',{
      method:'POST',
      headers:{'Authorization':'Bearer '+_tok,'Content-Type':'application/json'},
      body:JSON.stringify({weekSummary:muscleSets,untrainedGroups:untrained,remainingDays:remaining})
    }).then(r=>r.json()).then(data=>{
      const el=document.getElementById('week-sug-card');
      if(!el) return;
      const sugs=(data.suggestions||[]).filter(Boolean);
      if(sugs.length){
        el.innerHTML='<div class="sec-hdr"><div class="sec-lbl">Sugestão</div></div>'
          +'<div style="font-size:13px;color:var(--txt);line-height:1.7;padding:6px 0">'+sugs.join('<br><br>')+'</div>';
      } else { el.remove(); }
    }).catch(()=>{
      const el=document.getElementById('week-sug-card');
      if(!el) return;
      const pri=untrained.find(g=>g==='Perna'||g==='Costas'||g==='Core')||untrained[0];
      el.innerHTML='<div class="sec-hdr"><div class="sec-lbl">Sugestão</div></div>'
        +'<div style="font-size:13px;color:var(--txt);line-height:1.6;padding:6px 0"><b>'+pri+'</b> ainda não foi treinado — '+remaining+' dia'+(remaining>1?'s':'')+' restante'+(remaining>1?'s':'')+' para encaixar.</div>'
        +(untrained.length>1?'<div style="font-size:11px;color:var(--muted);padding-top:4px">Também sem treino: '+untrained.filter(g=>g!==pri).join(', ')+'.</div>':'');
    });
  }
}

function renderGym(){
  const date=currentDate;
  const dd=loadDay(date);
  const tr=dd.tr;
  const trObj=getWorkoutById(tr)||userWorkouts[0]||DESCANSO;
  const gymBody=document.getElementById('gym-body');
  if(!gymBody) return;

  if(_gymViewPlan){renderGymPlan(gymBody);return;}

  const selectorHtml='<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;-webkit-overflow-scrolling:touch">'+
    getAllDayOptions().map(t=>{
      const sel=tr===t.id;
      return`<button onclick="gymSetDay('${t.id}')" style="white-space:nowrap;padding:7px 12px;border-radius:8px;font-size:11px;font-weight:700;background:${sel?t.color+'20':'#FAFAF9'};color:${sel?t.color:'#78716C'};border:1px solid ${sel?t.color+'60':'#E7E5E4'};flex-shrink:0">${t.icon} ${t.name}</button>`;
    }).join('')+'</div>';

  if(tr==='descanso'){
    gymBody.innerHTML=selectorHtml+`<div class="card fade-in" style="text-align:center;padding:32px 20px"><div style="font-size:40px;margin-bottom:12px">🛌</div><div style="font-size:15px;font-weight:700;color:#1C1917;margin-bottom:6px">Dia de Descanso Ativo</div><div style="font-size:12px;color:#78716C">Sem musculação hoje. Recuperação é parte do treino.</div></div>`;
    return;
  }

  let session=loadGymSession(date,tr);
  if(!session){
    const plan=gymPlan[tr]||[];
    session=plan.map(ex=>{
      const nSets=ex.defaultSets||1;
      const repsVal=String(ex.defaultReps||'');
      const se={id:ex.id,name:ex.name,group:ex.group,obs:ex.obs||'',
             sets:Array.from({length:nSets}).map(()=>({reps:repsVal,kg:'',done:false}))};
      if(ex.groupId){se.groupId=ex.groupId;se.groupType=ex.groupType;se.groupPosition=ex.groupPosition;}
      if(ex.targetMuscles)se.targetMuscles=ex.targetMuscles;
      if(ex.targetMuscle)se.targetMuscle=ex.targetMuscle;
      if(ex.secondaryMuscles)se.secondaryMuscles=ex.secondaryMuscles;
      if(ex.gifUrl)se.gifUrl=ex.gifUrl;
      return se;
    });
    if(session.length>0) saveGymSession(date,tr,session);
  }

  const prev=getLastGymSession(tr,date);
  const prevMap={};
  if(prev) prev.session.forEach(ex=>{prevMap[ex.id]=ex;});

  const doneCount=session.reduce((a,ex)=>a+ex.sets.filter(s=>s.done).length,0);
  const totalSets=session.reduce((a,ex)=>a+ex.sets.length,0);

  const isCardio=trObj.type==='aerobico';
  let html=selectorHtml;
  if(prev){
    const pl=dispDate(prev.date);
    html+=`<div style="background:#FAFAF9;border:1px solid #E7E5E4;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:11px;color:#78716C">📊 Comparando com: <b style="color:#78716C">${pl.day} ${pl.date}</b></div>`;
  }
  html+=`<div style="display:flex;align-items:center;margin-bottom:10px">
    <div style="flex:1"><div style="font-size:15px;font-weight:800;color:${trObj.color}">${trObj.icon} ${trObj.name}</div></div>
    ${doneCount>0?`<div style="font-size:12px;color:#16A34A;font-family:'DM Mono',monospace;font-weight:700">${doneCount}/${totalSets} ${isCardio?'atividades':'séries'} ✓</div>`:''}
  </div>
  `;

  // Build render blocks (respecting bi-set / tri-set groupId)
  const _seenGrps={};const _blocks=[];
  session.forEach((ex,ei)=>{
    if(!ex.groupId){_blocks.push({type:'single',ei,ex});}
    else if(!_seenGrps[ex.groupId]){const b={type:'group',groupId:ex.groupId,groupType:ex.groupType||'biset',items:[{ei,ex}]};_seenGrps[ex.groupId]=b;_blocks.push(b);}
    else{_seenGrps[ex.groupId].items.push({ei,ex});}
  });

  // Helper: build one exercise card HTML
  function _gymCard(ei,ex){
    const prevEx=prevMap[ex.id];
    const prevSummary=prevEx?prevEx.sets.filter(s=>s.done&&(s.reps||s.kg)).map(s=>isCardio?[s.reps?s.reps+'min':null,s.kg?s.kg+'km':null].filter(Boolean).join(' '):`${s.reps}×${s.kg||'?'}kg`).join(' · '):'';
    const doneSets=ex.sets.filter(s=>s.done).length;
    const allDone=doneSets===ex.sets.length&&doneSets>0;
    const setRows=ex.sets.map((set,si)=>{
      const prevSet=prevEx?.sets?.[si];
      const bdr=`border:1.5px solid ${set.done?'#16a34a':'#E7E5E4'}`;
      const inp=`background:#FAFAF9;${bdr};border-radius:8px;padding:8px 4px;color:#1C1917;font-size:15px;font-weight:700;text-align:center;outline:none`;
      const doneBtn=`<button onclick="gymDone(${ei},${si})" style="margin-left:auto;min-width:32px;height:32px;border-radius:50%;background:${set.done?'#16a34a':'#E7E5E4'};color:${set.done?'#fff':'#78716C'};font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">${set.done?'✓':''}</button>`;
      const delBtn=ex.sets.length>1?`<button onclick="gymDelSet(${ei},${si})" style="min-width:22px;height:22px;border-radius:50%;background:#fff;color:#78716C;font-size:10px;flex-shrink:0">✕</button>`:'';
      if(isCardio){return`<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px"><div style="font-size:10px;color:#A8A29E;font-family:'DM Mono',monospace;width:22px;text-align:center;flex-shrink:0">${si+1}</div><input type="number" inputmode="decimal" placeholder="${prevSet?.reps||'min'}" value="${set.reps||''}" onchange="gymSetVal(${ei},${si},'reps',this.value)" style="width:62px;${inp}"><span style="color:#A8A29E;font-size:11px">min</span><input type="number" inputmode="decimal" placeholder="${prevSet?.kg||'km'}" value="${set.kg||''}" onchange="gymSetVal(${ei},${si},'kg',this.value)" style="width:62px;${inp}"><span style="color:#A8A29E;font-size:11px">km</span>${doneBtn}${delBtn}</div>`;}
      return`<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px"><div style="font-size:10px;color:#A8A29E;font-family:'DM Mono',monospace;width:22px;text-align:center;flex-shrink:0">${si+1}</div><input type="text" inputmode="decimal" placeholder="${prevSet?.reps||'reps'}" value="${set.reps||''}" onchange="gymSetVal(${ei},${si},'reps',this.value)" style="width:54px;${inp}"><span style="color:#A8A29E;font-size:13px;font-weight:700">×</span><input type="number" inputmode="decimal" placeholder="${prevSet?.kg||'kg'}" value="${set.kg||''}" onchange="gymSetVal(${ei},${si},'kg',this.value)" style="width:62px;${inp}"><span style="color:#A8A29E;font-size:11px">kg</span>${doneBtn}${delBtn}</div>`;
    }).join('');
    const gifThumb=ex.gifUrl?`<img src="${ex.gifUrl}" onclick="gymShowGif(${ei})" style="width:48px;height:48px;border-radius:8px;object-fit:cover;flex-shrink:0;cursor:pointer" loading="lazy">`:'';
    const tMuscles=ex.targetMuscles||(ex.targetMuscle?[ex.targetMuscle]:[]);
    const muscleBadges=tMuscles.map(m=>`<span style="display:inline-block;background:#EDE9FF;color:#6C63FF;border-radius:4px;padding:1px 6px;font-size:9px;font-weight:600;margin:2px 2px 0 0">${m}</span>`).join('');
    const editBtn=`<button onclick="gymOpenEdit(${ei})" style="background:#fff;color:#A8A29E;padding:4px 8px;border-radius:6px;font-size:11px;flex-shrink:0;line-height:1">✏️</button>`;
    const delBtn2=`<button onclick="gymDelEx(${ei})" style="background:#fff;color:#78716C;padding:4px 8px;border-radius:6px;font-size:11px;flex-shrink:0">✕</button>`;
    return`<div class="card gym-card-wrap" data-ei="${ei}" style="margin-bottom:8px;${allDone?'border-color:#BBF7D0;':''}">
      <div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:8px">
        ${gifThumb}
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:700;color:#1C1917" ontouchstart="gymEditLongPressStart(event,${ei})" ontouchend="gymEditLongPressCancel()" ontouchmove="gymEditLongPressCancel()" oncontextmenu="event.preventDefault();gymOpenEdit(${ei})">${ex.name}</div>
          ${ex.group?`<div style="font-size:10px;color:#78716C;margin-top:1px">${ex.group}</div>`:''}${muscleBadges}
        </div>
        ${editBtn}${delBtn2}
      </div>
      ${prevSummary?`<div style="font-size:10px;color:#A8A29E;font-family:'DM Mono',monospace;margin-bottom:8px;padding:5px 8px;background:#fff;border-radius:6px">Ant: ${prevSummary}</div>`:''}
      ${setRows}
      <button onclick="gymAddSet(${ei})" style="width:100%;padding:6px;background:#fff;border:1px dashed #D4D0CE;border-radius:8px;color:#78716C;font-size:11px;margin-top:2px">+ ${isCardio?'intervalo':'série'}</button>
    </div>`;
  }

  // Log: render blocks — grouping visual only, no creation buttons
  _blocks.forEach((block)=>{
    if(block.type==='group'){
      const tc=trObj.color||'#818cf8';
      html+=`<div class="gym-biset-wrap" style="border-color:${tc}"><span class="gym-biset-badge" style="background:${tc}">${block.groupType==='triset'?'TRI-SET':'BI-SET'}</span>`;
      block.items.forEach(({ei,ex})=>{html+=_gymCard(ei,ex);});
      html+=`</div>`;
    }else{
      html+=_gymCard(block.ei,block.ex);
    }
  });

  if(_gymAddOpen){
    const inp2='background:#FAFAF9;border:1px solid #E7E5E4;border-radius:10px;padding:10px 8px;color:#1C1917;font-size:15px;font-weight:700;outline:none;text-align:center;width:100%';

    // Verificar se há exercícios no plano para herdar configuração
    const planExs=gymPlan[tr]||[];
    const hasPlan=planExs.length>0;

    // Campos séries/reps só aparecem se isCardio OU se não há plano configurado
    // Em ambos os casos o usuário é informado do que acontecerá
    const addFormFields=isCardio
      ?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
          <div><div style="font-size:10px;color:#78716C;margin-bottom:4px;text-align:center">Intervalos</div><input type="number" id="gym-new-sets" placeholder="1" value="1" style="${inp2}"></div>
          <div><div style="font-size:10px;color:#78716C;margin-bottom:4px;text-align:center">Duração padrão (min)</div><input type="text" id="gym-new-reps" placeholder="30" value="" style="${inp2}"></div>
        </div>`
      :hasPlan
        // Há plano: mostrar aviso de que vai herdar (campos ocultos com defaults)
        ?`<div style="background:#EDE9FF;border:1px solid #C4BFFF;border-radius:10px;padding:10px 13px;margin-bottom:12px;font-size:12px;color:#534AB7;line-height:1.5">
            💡 Séries e reps serão herdadas do Plano automaticamente.<br>
            <span style="color:#A8A29E;font-size:11px">Se o exercício for novo, serão usados 3×12 como padrão.</span>
          </div>
          <input type="hidden" id="gym-new-sets" value="3">
          <input type="hidden" id="gym-new-reps" value="12">`
        // Sem plano: mostrar campos normalmente
        :`<div style="background:#FFF7ED;border:1px solid #FED7AA;border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:11px;color:#92400E">
            Sem plano configurado — defina séries e reps abaixo
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
            <div><div style="font-size:10px;color:#78716C;margin-bottom:4px;text-align:center">Séries</div><input type="number" id="gym-new-sets" placeholder="3" value="3" style="${inp2}"></div>
            <div><div style="font-size:10px;color:#78716C;margin-bottom:4px;text-align:center">Reps</div><input type="text" id="gym-new-reps" placeholder="12" value="12" style="${inp2}"></div>
          </div>`;

    html+=`<div class="card fade-in"><div class="sec-hdr"><div class="sec-lbl"><span>➕</span> ${isCardio?'ADICIONAR ATIVIDADE':'ADICIONAR EXERCÍCIO'}</div></div>
      <input type="text" id="gym-new-name" oninput="gymTriggerIdentify(this.value)" placeholder="${isCardio?'Ex: Corrida, Bike, Elíptico...':'Nome do exercício'}" style="width:100%;background:#FAFAF9;border:1px solid #E7E5E4;border-radius:10px;padding:11px 13px;color:#1C1917;font-size:14px;outline:none;margin-bottom:8px">
      <div id="gym-id-status" style="margin-bottom:4px"></div>
      ${addFormFields}
      <div style="display:flex;gap:8px">
        <button onclick="gymConfirmAdd()" style="flex:1;padding:12px;background:#6C63FF;border-radius:10px;color:#fff;font-size:14px;font-weight:700">Adicionar</button>
        <button onclick="gymCancelAdd()" style="padding:12px 16px;background:#F0EFED;border-radius:10px;color:#78716C;font-size:14px">Cancelar</button>
      </div>
    </div>`;
  } else if(session.length===0){
    html=`<div class="card fade-in" style="text-align:center;padding:28px 16px">
      <div style="font-size:36px;margin-bottom:10px">${isCardio?'🏃':'🏋️'}</div>
      <div style="font-size:14px;font-weight:700;color:#1C1917;margin-bottom:6px">Nenhuma atividade ainda</div>
      <div style="font-size:12px;color:#78716C;margin-bottom:16px">Registre o que foi feito hoje. Para montar o treino permanente, use o <b>Plano</b>.</div>
      <button onclick="gymOpenAdd()" style="padding:12px 24px;background:#6C63FF;border-radius:10px;color:#fff;font-size:14px;font-weight:700">+ ${isCardio?'Primeira atividade':'Primeiro exercício'}</button>
    </div>`;
  } else {
    html+=`<button onclick="gymOpenAdd()" style="width:100%;padding:12px;background:#fff;border:1.5px dashed #D4D0CE;border-radius:12px;color:#78716C;font-size:13px;font-weight:600;margin-bottom:4px">+ ${isCardio?'Adicionar atividade':'Adicionar exercício'}</button>`;
  }
  gymBody.innerHTML=html;
}

function gymSetVal(ei,si,field,val){
  const tr=loadDay(currentDate).tr;
  const s=loadGymSession(currentDate,tr);if(!s?.[ei]?.sets?.[si]) return;
  s[ei].sets[si][field]=val;saveGymSession(currentDate,tr,s);
}
function gymDone(ei,si){
  const tr=loadDay(currentDate).tr;
  const s=loadGymSession(currentDate,tr)||[];if(!s?.[ei]?.sets?.[si]) return;
  s[ei].sets[si].done=!s[ei].sets[si].done;saveGymSession(currentDate,tr,s);
  if(getWorkoutById(tr)?.type==='aerobico'){
    dayData.gymDurMin=s.reduce((a,ex)=>a+ex.sets.filter(st=>st.done).reduce((b,st)=>b+(parseFloat(st.reps)||0),0),0);
    save();
  }
  renderGym();
}
function gymAddSet(ei){
  const tr=loadDay(currentDate).tr;
  const s=loadGymSession(currentDate,tr)||[];if(!s[ei]) return;
  const last=s[ei].sets[s[ei].sets.length-1];
  s[ei].sets.push({reps:last?.reps||'',kg:last?.kg||'',done:false});
  saveGymSession(currentDate,tr,s);renderGym();
}
function gymDelSet(ei,si){
  const tr=loadDay(currentDate).tr;
  const s=loadGymSession(currentDate,tr)||[];
  if(!s[ei]||s[ei].sets.length<=1) return;
  s[ei].sets.splice(si,1);saveGymSession(currentDate,tr,s);renderGym();
}
function gymDelEx(ei){
  const tr=loadDay(currentDate).tr;
  const s=loadGymSession(currentDate,tr)||[];
  s.splice(ei,1);saveGymSession(currentDate,tr,s);renderGym();
}

function gymEditLongPressStart(ev,ei){
  clearTimeout(_gymEditLongPressTimer);
  _gymEditLongPressTimer=setTimeout(()=>{gymOpenEdit(ei);if(navigator.vibrate)navigator.vibrate(40);},500);
}
function gymEditLongPressCancel(){clearTimeout(_gymEditLongPressTimer);}

function gymOpenEdit(ei){
  const tr=loadDay(currentDate).tr;
  const s=loadGymSession(currentDate,tr)||[];
  const ex=s[ei];if(!ex)return;
  _gymEditIdx=ei;_gymEditEx=ex;_gymEditIsPlan=false;
  _gymEditMusTgt=[...(ex.targetMuscles||(ex.targetMuscle?[ex.targetMuscle]:[])) ];
  _gymEditMusSec=[...(ex.secondaryMuscles||[])];
  _gymMusclePickField=null;
  _gymRenderEditSheet();
}
function gymPlanOpenEdit(idx){
  const plan=gymPlan[_gymPlanTr];if(!plan?.[idx])return;
  const ex=plan[idx];
  _gymEditIdx=idx;_gymEditEx=ex;_gymEditIsPlan=true;_gymPlanEditIdx=idx;
  _gymEditMusTgt=[...(ex.targetMuscles||(ex.targetMuscle?[ex.targetMuscle]:[])) ];
  _gymEditMusSec=[...(ex.secondaryMuscles||[])];
  _gymMusclePickField=null;
  _gymRenderEditSheet();
}
function gymCloseEdit(){
  const bd=document.getElementById('gym-edit-bd');if(bd)bd.remove();
  _gymEditIdx=null;_gymEditEx=null;_gymMusclePickField=null;
}
function _gymRenderEditSheet(){
  const ex=_gymEditEx;if(!ex)return;
  const old=document.getElementById('gym-edit-bd');if(old)old.remove();
  const bd=document.createElement('div');
  bd.id='gym-edit-bd';bd.className='gym-edit-bd';
  bd.onclick=e=>{if(e.target===bd)gymCloseEdit();};
  const groups=GYM_GROUPS.map(g=>`<option value="${g}"${g===ex.group?' selected':''}>${g}</option>`).join('');
  const inp='width:100%;background:#FAFAF9;border:1px solid #E7E5E4;border-radius:10px;padding:11px 13px;color:#1C1917;font-size:14px;outline:none';
  const titleLabel=_gymEditIsPlan?'🗂️ Editar no Plano':'✏️ Editar (só esta sessão)';
  const scopeNote=_gymEditIsPlan?'':`<div style="background:#FFF7ED;border:1px solid #FED7AA;border-radius:8px;padding:8px 10px;font-size:11px;color:#92400E;margin-bottom:14px">Editando só esta sessão. Para mudar permanentemente, edite no Plano.</div>`;
  const planFields=_gymEditIsPlan?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
    <div><div style="font-size:11px;color:#78716C;margin-bottom:4px;font-weight:600">SÉRIES PADRÃO</div><input id="gym-edit-sets" type="number" min="1" value="${ex.defaultSets||3}" style="${inp}"></div>
    <div><div style="font-size:11px;color:#78716C;margin-bottom:4px;font-weight:600">REPS PADRÃO</div><input id="gym-edit-reps" type="text" value="${ex.defaultReps||''}" placeholder="12" style="${inp}"></div>
  </div>`:'';
  const saveBtn=_gymEditIsPlan
    ?`<button onclick="gymPlanSaveEdit()" style="flex:1;padding:13px;background:#6C63FF;border-radius:10px;color:#fff;font-size:14px;font-weight:700">Salvar no Plano</button>`
    :`<button onclick="gymSaveEdit()" style="flex:1;padding:13px;background:#6C63FF;border-radius:10px;color:#fff;font-size:14px;font-weight:700">Salvar</button>`;
  bd.innerHTML=`<div class="gym-edit-sheet">
    <div style="width:40px;height:4px;background:#E7E5E4;border-radius:2px;margin:0 auto 18px"></div>
    <div style="font-size:15px;font-weight:700;color:#1C1917;margin-bottom:16px">${titleLabel}</div>
    ${scopeNote}
    <div style="font-size:11px;color:#78716C;margin-bottom:4px;font-weight:600">NOME</div>
    <input id="gym-edit-name" type="text" value="${ex.name.replace(/"/g,'&quot;')}" style="${inp};margin-bottom:14px">
    <div style="font-size:11px;color:#78716C;margin-bottom:4px;font-weight:600">GRUPO MUSCULAR</div>
    <select id="gym-edit-group" style="${inp};margin-bottom:14px">${groups}</select>
    ${planFields}
    <div style="font-size:11px;color:#78716C;margin-bottom:4px;font-weight:600">OBSERVAÇÃO</div>
    <input id="gym-edit-obs" type="text" value="${(ex.obs||'').replace(/"/g,'&quot;')}" placeholder="Ex: pegada fechada, corrente..." style="${inp};margin-bottom:20px">
    <div style="display:flex;gap:8px">
      ${saveBtn}
      <button onclick="gymCloseEdit()" style="padding:13px 18px;background:#F0EFED;border-radius:10px;color:#78716C;font-size:14px">Cancelar</button>
    </div>
  </div>`;
  document.body.appendChild(bd);
}
function gymEditRemMuscle(field,idx){
  if(field==='tgt')_gymEditMusTgt.splice(idx,1);else _gymEditMusSec.splice(idx,1);
  _gymRenderEditSheet();
}
function gymShowMusclePicker(field){
  _gymMusclePickField=_gymMusclePickField===field?null:field;
  _gymRenderEditSheet();
}
function gymPickMuscle(muscle){
  const arr=_gymMusclePickField==='tgt'?_gymEditMusTgt:_gymEditMusSec;
  if(_gymMusclePickField==='tgt'&&arr.length>=3)return;
  const idx=arr.indexOf(muscle);
  if(idx>=0)arr.splice(idx,1);else arr.push(muscle);
  _gymRenderEditSheet();
}
function gymSaveEdit(){
  const name=(document.getElementById('gym-edit-name')?.value||'').trim();
  if(!name)return;
  const group=document.getElementById('gym-edit-group')?.value||'Outro';
  const obs=(document.getElementById('gym-edit-obs')?.value||'').trim();
  const tr=loadDay(currentDate).tr;const s=loadGymSession(currentDate,tr)||[];
  const ex=s[_gymEditIdx];if(!ex){gymCloseEdit();return;}
  const hadChange=ex.name!==name||JSON.stringify(ex.targetMuscles||[])!==JSON.stringify(_gymEditMusTgt);
  ex.name=name;ex.group=group;ex.obs=obs;
  ex.targetMuscles=[..._gymEditMusTgt];
  ex.targetMuscle=_gymEditMusTgt[0]||ex.targetMuscle||'';
  ex.secondaryMuscles=[..._gymEditMusSec];
  ex.userOverride=true;
  saveGymSession(currentDate,tr,s);
  gymCloseEdit();renderGym();
  if(hadChange)_gymAskUpdatePlan(ex.id,name,group);
}
function gymPlanSaveEdit(){
  const name=(document.getElementById('gym-edit-name')?.value||'').trim();
  if(!name)return;
  const group=document.getElementById('gym-edit-group')?.value||'Outro';
  const obs=(document.getElementById('gym-edit-obs')?.value||'').trim();
  const sets=parseInt(document.getElementById('gym-edit-sets')?.value)||3;
  const reps=(document.getElementById('gym-edit-reps')?.value||'').trim();
  const plan=gymPlan[_gymPlanTr];if(!plan?.[_gymPlanEditIdx]){gymCloseEdit();return;}
  const ex=plan[_gymPlanEditIdx];
  ex.name=name;ex.group=group;ex.obs=obs;ex.defaultSets=sets;ex.defaultReps=reps;
  ex.targetMuscles=[..._gymEditMusTgt];
  ex.targetMuscle=_gymEditMusTgt[0]||ex.targetMuscle||'';
  ex.secondaryMuscles=[..._gymEditMusSec];
  ex.userOverride=true;
  saveGymPlan();gymCloseEdit();renderGym();showToast('Exercício atualizado no plano!');
}
function _gymAskUpdatePlan(exId,name,group){
  const el=document.createElement('div');
  el.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1C1917;color:#fff;padding:12px 16px;border-radius:12px;z-index:500;display:flex;align-items:center;gap:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100vw - 32px)';
  el.innerHTML=`<span style="flex:1">Atualizar no plano também?</span><button onclick="gymDoUpdatePlan('${exId}','${name.replace(/'/g,"\\'").replace(/"/g,'\\"')}','${group}');this.closest('div[style]').remove()" style="background:#fff;color:#1C1917;padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600;flex-shrink:0">Sim</button><button onclick="this.closest('div[style]').remove()" style="background:rgba(255,255,255,.15);color:#fff;padding:5px 10px;border-radius:6px;font-size:12px;flex-shrink:0">Não</button>`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),6000);
}
function gymDoUpdatePlan(exId,name,group){
  Object.values(gymPlan).forEach(arr=>{if(Array.isArray(arr))arr.forEach(p=>{if(p.id===exId){p.name=name;p.group=group;}});});
  saveGymPlan();showToast('Plano atualizado!');
}

function setGymDur(v){dayData.gymDurMin=Math.max(0,+v||0);save();renderUI();}
function gymOpenAdd(){_gymAddOpen=true;renderGym();setTimeout(()=>document.getElementById('gym-new-name')?.focus(),50);}
function gymCancelAdd(){_gymAddOpen=false;_gymIdInfo=null;_gymAddIdState='idle';renderGym();}
function gymConfirmAdd(){
  const name=(document.getElementById('gym-new-name')?.value||'').trim();
  if(!name){const el=document.getElementById('gym-new-name');if(el)el.style.borderColor='#f87171';return;}
  const tr=loadDay(currentDate).tr;
  const isCardioAdd=getWorkoutById(tr)?.type==='aerobico';
  const group=(function(){
    if(isCardioAdd) return 'Cardio';
    if(_gymIdInfo&&_gymIdInfo.selectedGroup) return _gymIdInfo.selectedGroup;
    if(_gymIdInfo&&_gymIdInfo.found&&_gymIdInfo.group) return _gymIdInfo.group;
    return 'Outro';
  })();
  // ── Herdar séries/reps do Plano se o exercício já existir lá ──
  const planEx=(gymPlan[tr]||[]).find(p=>p.name.toLowerCase()===name.toLowerCase());
  const nSets=planEx
    ?( parseInt(planEx.defaultSets)||3 )
    :( parseInt(document.getElementById('gym-new-sets')?.value)||3 );
  const repsVal=planEx
    ?( String(planEx.defaultReps||'12') )
    :( (document.getElementById('gym-new-reps')?.value||'12').trim() );
  const id='ex_'+Date.now();
  const extra=(_gymIdInfo&&_gymIdInfo.found)?{gifUrl:_gymIdInfo.gifUrl,targetMuscle:_gymIdInfo.targetMuscle,targetMuscles:_gymIdInfo.targetMuscle?[_gymIdInfo.targetMuscle]:[],secondaryMuscles:_gymIdInfo.secondaryMuscles,instructions:_gymIdInfo.instructions}:{};
  const newEx=Object.assign({id,name,group,sets:Array.from({length:nSets}).map(()=>({reps:repsVal,kg:'',done:false}))},extra);
  const s=loadGymSession(currentDate,tr)||[];s.push(newEx);saveGymSession(currentDate,tr,s);
  _gymAddOpen=false;_gymIdInfo=null;_gymAddIdState='idle';renderGym();
  const wkName=getWorkoutById(tr)?.name||tr;
  if(planEx){
    showToast('✓ '+name+' adicionado ('+nSets+'×'+repsVal+' do plano)');
  } else {
    _gymAskSaveToPlan(id,name,group,nSets,repsVal,tr,wkName);
  }
}
function _gymAskSaveToPlan(id,name,group,nSets,repsVal,tr,wkName){
  _gymPendingPlanAdd={id,name,group,nSets,repsVal,tr};
  const old=document.getElementById('gym-ask-plan');if(old)old.remove();
  const el=document.createElement('div');
  el.id='gym-ask-plan';
  el.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1C1917;color:#fff;padding:12px 16px;border-radius:12px;z-index:500;display:flex;align-items:center;gap:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100vw - 32px)';
  el.innerHTML=`<span style="flex:1">Salvar em <b>${wkName}</b> também?</span><button onclick="gymDoAddToPlan();document.getElementById('gym-ask-plan')?.remove()" style="background:#fff;color:#1C1917;padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600;flex-shrink:0">Sim</button><button onclick="_gymPendingPlanAdd=null;document.getElementById('gym-ask-plan')?.remove()" style="background:rgba(255,255,255,.15);color:#fff;padding:5px 10px;border-radius:6px;font-size:12px;flex-shrink:0">Não</button>`;
  document.body.appendChild(el);
  setTimeout(()=>{el.remove();_gymPendingPlanAdd=null;},8000);
}
function gymDoAddToPlan(){
  if(!_gymPendingPlanAdd)return;
  const{id,name,group,nSets,repsVal,tr}=_gymPendingPlanAdd;
  if(!gymPlan[tr])gymPlan[tr]=[];
  gymPlan[tr].push({id,name,group,defaultSets:nSets,defaultReps:repsVal,obs:''});
  saveGymPlan();showToast('Adicionado ao plano!');
  _gymPendingPlanAdd=null;
}

let _gymWkCreate=false;
function renderGymPlan(gymBody){
  const inp2='background:#fff;border:1px solid #E7E5E4;border-radius:8px;padding:9px 12px;color:#1C1917;font-size:13px;outline:none';

  // Build a rich exercise card for the Plan view

    const tMuscles=ex.targetMuscles||(ex.targetMuscle?[ex.targetMuscle]:[]);
    const muscleBadges=tMuscles.slice(0,2).map(m=>`<span style="display:inline-block;background:#EDE9FF;color:#6C63FF;border-radius:4px;padding:1px 6px;font-size:9px;font-weight:600;margin-right:3px">${m}</span>`).join('');

    return`<div class="card gym-plan-card${_gymReorderMode?' gym-reorder-mode':''}" data-pi="${idx}" ${touchEvts} draggable="true" ondragstart="gymDragStart(${idx},event)" ondragover="gymDragOver(event,${idx})" ondrop="gymDrop(${idx})" ondragend="gymDragEnd()" style="margin-bottom:6px;padding:9px 11px">
      <div style="display:flex;align-items:center;gap:7px">
        ${handle}${arrows}
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:700;color:#1C1917">${ex.name}</div>
          <div style="font-size:11px;color:#78716C;margin-top:1px">${ex.group||''}${ex.defaultSets?' · <b>'+ex.defaultSets+'×'+(ex.defaultReps||'?')+'</b>':''}${ex.obs?' · <i>'+ex.obs+'</i>':''}</div>
          ${muscleBadges?`<div style="margin-top:3px">${muscleBadges}</div>`:''}
        </div>

      </div>
    </div>`;
  }

  const workoutCards=userWorkouts.map(w=>{
    const isExp=_gymPlanTr===w.id;
    const plan=gymPlan[w.id]||[];
    const days=w.weekDays.length?w.weekDays.map(d=>DAYS[d]).join(' · '):'Sem dia fixo';

    if(isExp){
      const previewHtml=_gymPlanPreview.length?renderGymPlanPreviewHtml():'';

      // Build grouped exercise list with drag, bi-set buttons
      let exListHtml='';
      if(plan.length>0){
        const seenGrps={};const blocks=[];

          if(!ex.groupId){blocks.push({type:'single',i,ex});}
          else if(!seenGrps[ex.groupId]){const b={type:'group',groupId:ex.groupId,groupType:ex.groupType||'biset',items:[{i,ex}]};seenGrps[ex.groupId]=b;blocks.push(b);}
          else{seenGrps[ex.groupId].items.push({i,ex});}

          exListHtml+=`<div style="background:#6C63FF;color:#fff;border-radius:10px;padding:10px 14px;margin-bottom:10px;display:flex;align-items:center;gap:8px;font-size:13px"><span style="flex:1">Use ↑↓ para reordenar</span><button onclick="gymExitReorder()" style="background:rgba(255,255,255,.2);color:#fff;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600">✓ Pronto</button></div>`;

          if(block.type==='group'){

            block.items.forEach(({i,ex})=>{exListHtml+=_planCard(w,plan,i,ex);});
            exListHtml+=`<button class="gym-group-btn" onclick="gymUngroup('${block.groupId}')" style="justify-content:flex-end;padding-right:4px;font-size:10px;margin:0 0 4px">Desagrupar ✕</button></div>`;
          }else{
            exListHtml+=_planCard(w,plan,block.i,block.ex);
          }
          if(!_gymReorderMode&&bi<blocks.length-1){
            const lastEx=block.type==='group'?block.items[block.items.length-1].ex:block.ex;

            const nextBlock=blocks[bi+1];
            const nextEx=nextBlock.type==='group'?nextBlock.items[0].ex:nextBlock.ex;

          <div id="gym-import-preview">${previewHtml}</div>

async function gymReidentifyAll(){
  if(!USE_API||!authToken){showToast('Faça login para usar esta função.');return;}
  const entries=[];
  Object.entries(gymPlan).forEach(function([wId,exList]){
    (exList||[]).forEach(function(ex,idx){entries.push({wId,idx,name:ex.name});});
  });
  if(!entries.length){showToast('Nenhum exercício no plano.');return;}
  showToast('Identificando '+entries.length+' exercício(s)...');
  let updated=0,failed=0;
  for(const item of entries){
    try{
      const r=await fetch(API_URL+'?action=identify_exercise&name='+encodeURIComponent(item.name),{headers:{authorization:'Bearer '+authToken}});
      if(!r.ok){failed++;continue;}
      const d=await r.json();
      if(d.found&&d.group){
        gymPlan[item.wId][item.idx].group=d.group;
        gymPlan[item.wId][item.idx].targetMuscle=d.targetMuscle||'';
        gymPlan[item.wId][item.idx].targetMuscles=d.targetMuscle?[d.targetMuscle]:[];
        gymPlan[item.wId][item.idx].secondaryMuscles=d.secondaryMuscles||[];
        updated++;
      } else {failed++;}
    } catch(e){failed++;}
  }
  saveGymPlan();renderGym();
  showToast('✓ '+updated+' atualizados'+(failed?' · '+failed+' não identificados':''));
}

// ─── PLAN: DRAG & DROP (desktop) ────────────────────────────────────────────
function gymDragStart(ei,ev){
  _gymDragSrc=ei;
  ev.dataTransfer.effectAllowed='move';
  ev.dataTransfer.setData('text/plain',String(ei));
  setTimeout(()=>{const el=document.querySelector('.gym-plan-card[data-pi="'+ei+'"]');if(el)el.classList.add('gym-card-lifting');},0);
}
function gymDragOver(ev,ei){
  ev.preventDefault();ev.dataTransfer.dropEffect='move';
  if(_gymDragOverIdx!==ei){
    _gymDragOverIdx=ei;
    document.querySelectorAll('.gym-drop-above').forEach(el=>el.classList.remove('gym-drop-above'));
    const el=document.querySelector('.gym-plan-card[data-pi="'+ei+'"]');
    if(el&&ei!==_gymDragSrc)el.classList.add('gym-drop-above');
  }
}
function gymDrop(ei){
  if(_gymDragSrc===null||_gymDragSrc===ei){gymDragEnd();return;}
  const plan=gymPlan[_gymPlanTr];if(!plan){gymDragEnd();return;}
  const[moved]=plan.splice(_gymDragSrc,1);
  plan.splice(ei,0,moved);
  plan.forEach((ex,i)=>{ex.order=i;});
  saveGymPlan();gymDragEnd();renderGym();
}
function gymDragEnd(){
  _gymDragSrc=null;_gymDragOverIdx=null;
  document.querySelectorAll('.gym-card-lifting,.gym-drop-above').forEach(el=>el.classList.remove('gym-card-lifting','gym-drop-above'));
}

// ── PLAN: REORDER (mobile long press → ↑↓ buttons) ───────────────────────────
function gymLongPressStart(ev,ei){
  clearTimeout(_gymLongPressTimer);
  _gymLongPressTimer=setTimeout(()=>{
    _gymReorderMode=true;renderGym();
    if(navigator.vibrate)navigator.vibrate(40);
  },500);
}
function gymLongPressCancel(){clearTimeout(_gymLongPressTimer);}
function gymExitReorder(){_gymReorderMode=false;renderGym();}
function gymMoveUp(ei){
  if(ei<=0)return;
  const plan=gymPlan[_gymPlanTr];if(!plan)return;
  [plan[ei-1],plan[ei]]=[plan[ei],plan[ei-1]];
  plan.forEach((ex,i)=>{ex.order=i;});
  saveGymPlan();renderGym();
}
function gymMoveDown(ei){
  const plan=gymPlan[_gymPlanTr];if(!plan)return;
  if(ei>=plan.length-1)return;
  [plan[ei],plan[ei+1]]=[plan[ei+1],plan[ei]];
  plan.forEach((ex,i)=>{ex.order=i;});
  saveGymPlan();renderGym();
}

// ── PLAN: BI-SET / TRI-SET ────────────────────────────────────────────────────
function gymGroupPair(ei1,ei2,existingGroupId){
  const plan=gymPlan[_gymPlanTr];if(!plan)return;
  if(existingGroupId){
    const pos=plan.filter(ex=>ex.groupId===existingGroupId).length;
    plan[ei2].groupId=existingGroupId;plan[ei2].groupType='triset';plan[ei2].groupPosition=pos;
    plan.forEach(ex=>{if(ex.groupId===existingGroupId)ex.groupType='triset';});
  }else{
    const gid='grp_'+Date.now();
    plan[ei1].groupId=gid;plan[ei1].groupType='biset';plan[ei1].groupPosition=0;
    plan[ei2].groupId=gid;plan[ei2].groupType='biset';plan[ei2].groupPosition=1;
  }
  saveGymPlan();renderGym();
}
function gymUngroup(groupId){
  const plan=gymPlan[_gymPlanTr];if(!plan)return;
  plan.forEach(ex=>{if(ex.groupId===groupId){delete ex.groupId;delete ex.groupType;delete ex.groupPosition;}});
  saveGymPlan();renderGym();
}

function renderBodyChart(sorted,metric){
  const data=sorted.map(e=>({date:e.date,v:metric==='fat'?e.fat:metric==='lean'?e.lean:e.weight})).filter(e=>e.v!=null&&!isNaN(e.v));
  if(data.length<2) return '<div style="text-align:center;color:#78716C;padding:24px;font-size:12px">Adicione mais registros para ver o gráfico</div>';
  const W=320,H=150,padT=12,padB=28,padL=40,padR=10,cW=W-padL-padR,cH=H-padT-padB;
  const vals=data.map(d=>d.v);
  const minV=Math.min(...vals),maxV=Math.max(...vals),range=maxV-minV||0.5,padded=range*0.15;
  const yMin=minV-padded,yMax=maxV+padded,yRange=yMax-yMin;
  const xS=i=>padL+(data.length>1?(i/(data.length-1))*cW:cW/2);
  const yS=v=>padT+cH-((v-yMin)/yRange)*cH;
  const color=metric==='fat'?'#fb923c':metric==='lean'?'#34d399':'#38bdf8';
  const unit=metric==='fat'?'%':'kg';
  const gId='g_'+metric;
  const pathD=data.map((d,i)=>(i===0?'M':'L')+xS(i).toFixed(1)+','+yS(d.v).toFixed(1)).join(' ');
  const areaD=pathD+' L'+xS(data.length-1).toFixed(1)+','+(padT+cH).toFixed(1)+' L'+padL+','+(padT+cH).toFixed(1)+' Z';
  const dots=data.map((d,i)=>`<circle cx="${xS(i).toFixed(1)}" cy="${yS(d.v).toFixed(1)}" r="${i===data.length-1?4:2.5}" fill="${color}" stroke="#fff" stroke-width="${i===data.length-1?2:1}"/>`).join('');
  const lastX=xS(data.length-1),lastY=yS(data[data.length-1].v);
  const lastAnchor=data.length>1&&lastX>W*0.7?'end':'start';
  const lastLabelX=lastAnchor==='end'?lastX-6:lastX+6;
  const lastLabel=`<text x="${lastLabelX.toFixed(1)}" y="${(lastY-8).toFixed(1)}" text-anchor="${lastAnchor}" font-size="9" font-weight="700" fill="${color}">${data[data.length-1].v.toFixed(1)}${unit}</text>`;
  const nY=4;
  const yTicks=Array.from({length:nY}).map((_,i)=>{
    const v=yMin+(yRange/(nY-1))*i,y=yS(v);
    return`<text x="${(padL-4).toFixed(1)}" y="${y.toFixed(1)}" text-anchor="end" font-size="8" fill="#A8A29E" dominant-baseline="middle">${v.toFixed(1)}</text><line x1="${padL}" y1="${y.toFixed(1)}" x2="${(padL+cW).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#E7E5E4" stroke-width="0.5" stroke-dasharray="3,3"/>`;
  }).join('');
  const maxLbls=Math.min(5,data.length);
  const lblIdx=data.length<=maxLbls?data.map((_,i)=>i):Array.from({length:maxLbls}).map((_,i)=>Math.round(i*(data.length-1)/(maxLbls-1)));
  const xLabels=lblIdx.map(i=>{const p=data[i].date.split('-');return`<text x="${xS(i).toFixed(1)}" y="${(H-6).toFixed(1)}" text-anchor="middle" font-size="8" fill="#A8A29E">${p[2]}/${p[1]}</text>`;}).join('');
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <defs><linearGradient id="${gId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.3"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${yTicks}<path d="${areaD}" fill="url(#${gId})"/><path d="${pathD}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${lastLabel}${xLabels}
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${(padT+cH).toFixed(1)}" stroke="#E7E5E4" stroke-width="1"/>
    <line x1="${padL}" y1="${(padT+cH).toFixed(1)}" x2="${(padL+cW).toFixed(1)}" y2="${(padT+cH).toFixed(1)}" stroke="#E7E5E4" stroke-width="1"/>
  </svg>`;
}

function renderBodyComp(){
  const sorted=[...bodyEntries].sort((a,b)=>a.date.localeCompare(b.date));
  const latest=sorted[sorted.length-1];
  const prev=sorted.length>=2?sorted[sorted.length-2]:null;
  const earliest=sorted[0];

  function statCard(label,value,unit,delta,color){
    let dColor='#78716C';
    if(delta!=null){
      if(unit==='%') dColor=delta>0?'#fb923c':delta<0?'#34d399':'#78716C';
      else dColor=delta>0?'#fb923c':delta<0?'#34d399':'#78716C';
    }
    const dHtml=delta!=null?`<div style="font-size:10px;color:${dColor};margin-top:2px">${delta>0?'+':''}${delta.toFixed(1)}${unit}</div>`:'';
    return`<div style="background:#FAFAF9;border:1px solid #E7E5E4;border-radius:12px;padding:12px 6px;text-align:center">
      <div style="font-size:9px;color:#78716C;font-weight:700;letter-spacing:.07em;margin-bottom:4px">${label}</div>
      <div style="font-size:19px;font-weight:800;color:${color}">${value!=null?value.toFixed(1):'—'}<span style="font-size:10px;color:#78716C;font-weight:400">${unit}</span></div>
      ${dHtml}
    </div>`;
  }

  const wDelta=latest&&prev&&prev.weight!=null?+(latest.weight-prev.weight).toFixed(2):null;
  const fDelta=latest&&prev&&prev.fat!=null&&latest.fat!=null?+(latest.fat-prev.fat).toFixed(2):null;
  const lDelta=latest&&prev&&prev.lean!=null&&latest.lean!=null?+(latest.lean-prev.lean).toFixed(2):null;

  const statsHtml=latest?`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:10px">
    ${statCard('PESO',latest.weight,'kg',wDelta,'#38bdf8')}
    ${statCard('GORDURA',latest.fat,'%',fDelta,'#fb923c')}
    ${statCard('MASSA MAGRA',latest.lean,'kg',lDelta,'#34d399')}
  </div>`:'<div style="text-align:center;color:#78716C;padding:20px;font-size:13px">Nenhum registro ainda. Adicione o primeiro abaixo.</div>';

  let totalHtml='';
  if(sorted.length>=2&&earliest.weight!=null&&latest.weight!=null){
    const totalW=latest.weight-earliest.weight;
    const nDays=Math.round((new Date(latest.date)-new Date(earliest.date))/86400000);
    totalHtml=`<div style="background:#FAFAF9;border:1px solid #E7E5E4;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:12px">
      <span style="color:#78716C;font-weight:600">Variação total: </span><span style="color:${totalW<0?'#34d399':'#fb923c'};font-weight:700">${totalW>0?'+':''}${totalW.toFixed(1)} kg</span>
      <span style="color:#A8A29E"> em ${nDays} dias · ${sorted.length} registros</span>
    </div>`;
  }

  const metrics=[{id:'weight',l:'⚖️ Peso',c:'#38bdf8'},{id:'fat',l:'🔥 Gordura',c:'#fb923c'},{id:'lean',l:'💪 Massa Magra',c:'#34d399'}];
  const tabBtns=metrics.map(m=>{const sel=_bodyMetric===m.id;return`<button onclick="setBodyMetric('${m.id}')" style="flex:1;padding:8px 4px;border-radius:8px;font-size:11px;font-weight:700;background:${sel?m.c+'20':'transparent'};color:${sel?m.c:'#78716C'};border:1px solid ${sel?m.c+'60':'#E7E5E4'}">${m.l}</button>`;}).join('');

  const todayStr=today();
  const todayEntry=bodyEntries.find(e=>e.date===todayStr);
  const hasToday=!!todayEntry;
  const inp='width:100%;background:#FAFAF9;border:1px solid #E7E5E4;border-radius:10px;padding:11px 13px;color:#1C1917;font-size:15px;outline:none';
  const leanPreview=todayEntry?.lean!=null?todayEntry.lean.toFixed(1)+' kg':'—';

  const histRows=[...bodyEntries].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30).map(e=>{
    const{day,date:d}=dispDate(e.date);
    return`<div style="display:flex;align-items:center;gap:8px;padding:9px 10px;background:#FAFAF9;border:1px solid #E7E5E4;border-radius:10px;margin-bottom:6px">
      <div style="flex:1;min-width:0">
        <span style="font-size:12px;font-weight:700;color:#1C1917">${day} ${d}</span>
        <div style="display:flex;gap:10px;margin-top:3px">
          ${e.weight!=null?`<span style="font-size:11px;color:#38bdf8;font-family:'DM Mono',monospace">${e.weight.toFixed(1)} kg</span>`:''}
          ${e.fat!=null?`<span style="font-size:11px;color:#fb923c;font-family:'DM Mono',monospace">${e.fat.toFixed(1)}%</span>`:''}
          ${e.lean!=null?`<span style="font-size:11px;color:#16A34A;font-family:'DM Mono',monospace">${e.lean.toFixed(1)} kg</span>`:''}

    </div>`;

    ${statsHtml}
    ${totalHtml}
    <div class="card">

      <div style="display:flex;gap:5px;margin-bottom:12px">${tabBtns}</div>

function bcUpdateLean(){

function saveBodyEntry(){
  const w=parseFloat(document.getElementById('bc-weight')?.value);
  if(!w||w<=0){if(document.getElementById('bc-weight'))document.getElementById('bc-weight').style.borderColor='#f87171';return;}
  const f=parseFloat(document.getElementById('bc-fat')?.value)||null;
  const lean=w>0&&f!=null&&f>0?+(w*(1-f/100)).toFixed(2):null;
  const date=today();
  const entry={date,weight:+w.toFixed(2),fat:f!=null?+f.toFixed(2):null,lean};
  const idx=bodyEntries.findIndex(e=>e.date===date);
  if(idx>=0) bodyEntries[idx]=entry; else bodyEntries.push(entry);
  saveBodyEntries();
  goals={...goals,pesoAtual:String(w)};
  try{localStorage.setItem('ht:goals',JSON.stringify(goals));}catch{}
  renderBodyComp();
}

function deleteBodyEntry(date){
  if(!confirm('Excluir registro de '+date+'?')) return;
  bodyEntries=bodyEntries.filter(e=>e.date!==date);
  saveBodyEntries();
  renderBodyComp();
}

function goalsCalcUpdate(){
  const peso=parseFloat(document.getElementById('g-peso-atual')?.value)||0;
  const meta=parseFloat(document.getElementById('g-peso-meta')?.value)||0;
  const alt=parseFloat(document.getElementById('g-altura')?.value)||0;
  const idade=parseInt(document.getElementById('g-idade')?.value)||0;
  const sexo=goals.sexo||'f';
  const treinos=goals.treinosSemana||5;

  // Peso info
  const pesoInfoEl=document.getElementById('g-peso-info');
  if(pesoInfoEl&&peso>0&&meta>0){
    const diff=+(meta-peso).toFixed(1);
    if(Math.abs(diff)<=1) pesoInfoEl.innerHTML=`<span style="color:#16A34A">✓ Manutenção — peso próximo da meta</span>`;
    else if(diff<0) pesoInfoEl.innerHTML=`<span style="color:#38bdf8">↓ Objetivo: perder ${Math.abs(diff)} kg</span>`;
    else pesoInfoEl.innerHTML=`<span style="color:#fb923c">↑ Objetivo: ganhar ${diff} kg</span>`;
  } else if(pesoInfoEl) pesoInfoEl.innerHTML='';

  // ── Água: 35 ml/kg (recomendação EFSA/IOM) ─────────────────────────────
  const aguaFormulaEl=document.getElementById('g-agua-formula');
  const aguaBtnsEl=document.getElementById('g-agua-btns');
  const aguaBadgeEl=document.getElementById('g-agua-badge');
  let aguaSug=goals.aguaCopos;
  if(peso>0){
    const ml=Math.round(peso*35);
    const copos=Math.max(6,Math.min(12,Math.round(ml/250)));
    const liters=(ml/1000).toFixed(1).replace('.',',');
    aguaSug=copos;
    if(aguaFormulaEl) aguaFormulaEl.innerHTML=`🧮 <b>${peso} kg</b> × 35 ml = <b>${ml} ml</b> (<b>${liters} L</b>) ÷ 250 ml/copo = <span style="color:#38bdf8;font-weight:700">${copos} copos · ${liters} L/dia</span><br><span style="color:#A8A29E;font-size:10px">Base: 30–40 ml/kg — EFSA & Institute of Medicine</span>`;
    if(aguaBadgeEl) aguaBadgeEl.textContent='calculado automaticamente';
  } else {
    if(aguaFormulaEl) aguaFormulaEl.innerHTML='Preencha o peso atual para calcular automaticamente';
    if(aguaBadgeEl) aguaBadgeEl.textContent='';
  }
  if(aguaBtnsEl){
    const coposList=[6,7,8,9,10,11,12];
    const cur=goals.aguaCopos;
    aguaBtnsEl.innerHTML=coposList.map(n=>{
      const sel=cur===n;const isSug=n===aguaSug&&peso>0;
      return`<button onclick="goalsSelectAgua(${n})" id="ga-${n}" style="padding:8px 2px;border-radius:8px;font-size:12px;font-weight:700;background:${sel?'#5A52E8':'#FAFAF9'};color:${sel?'#fff':'#78716C'};border:1px solid ${sel?'#6C63FF':isSug?'#38bdf860':'#E7E5E4'}">${n}${isSug?'<sup style="color:#38bdf8;font-size:8px">✦</sup>':''}</button>`;
    }).join('');
  }

  // ── Calorias: Mifflin-St Jeor + fator atividade + ajuste de meta ────────
  const calFormulaEl=document.getElementById('g-cal-formula');
  const calInpEl=document.getElementById('g-calorias');
  const calBadgeEl=document.getElementById('g-cal-badge');
  if(peso>0&&alt>0&&idade>0){
    const bmr=sexo==='m'
      ?(10*peso+6.25*alt-5*idade+5)
      :(10*peso+6.25*alt-5*idade-161);
    const actMap=[[1,1.2,'sedentário'],[3,1.375,'leve'],[5,1.55,'moderado'],[7,1.725,'intenso']];
    const [,fac,lbl]=actMap.find(([d])=>treinos<=d)||actMap[actMap.length-1];
    const tdee=Math.round(bmr*fac);
    let adj=0,adjHtml='';
    if(meta>0&&Math.abs(meta-peso)>1){
      if(meta<peso){adj=-400;adjHtml=` <span style="color:#38bdf8">− 400 kcal <span style="color:#A8A29E">(déficit para perda)</span></span>`;}
      else{adj=300;adjHtml=` <span style="color:#fb923c">+ 300 kcal <span style="color:#A8A29E">(superávit para ganho)</span></span>`;}
    }
    const cal=tdee+adj;
    if(calFormulaEl) calFormulaEl.innerHTML=`🧮 BMR <b>${Math.round(bmr)}</b> kcal × <b>${fac}</b> <span style="color:#78716C">(treino ${lbl})</span> = <b>${tdee}</b> kcal${adjHtml}<br>→ <span style="color:#fb923c;font-weight:700">${cal} kcal/dia</span><br><span style="color:#A8A29E;font-size:10px">Fórmula Mifflin-St Jeor (2005) — padrão ISSN/ACSM</span>`;
    if(calInpEl) calInpEl.value=cal;
    if(calBadgeEl) calBadgeEl.textContent='calculado automaticamente';
  } else {
    if(calFormulaEl) calFormulaEl.innerHTML='Preencha perfil, peso e altura para calcular automaticamente';
    if(calBadgeEl) calBadgeEl.textContent='';
  }

  // ── Proteína meta (ISSN 2017) ─────────────────────────────────────────────
  const objEl=document.getElementById('g-obj-prot-preview');
  if(objEl&&peso>0){
    const obj=goals.objetivo||'manutencao';
    const factorMap={cutting:2.2,manutencao:1.6,bulking:1.8};
    const factor=factorMap[obj]||1.6;
    const protMeta=Math.round(peso*factor);
    const objLabel={cutting:'cutting (déficit)',manutencao:'manutenção',bulking:'bulking (superávit)'}[obj]||obj;
    objEl.innerHTML=`🥩 Meta de proteína: <b style="color:#1C1917">${protMeta}g/dia</b> <span style="color:#A8A29E">(${factor}g/kg × ${peso}kg — ${objLabel} · ISSN 2017)</span>`;
    goals={...goals,protMeta};
  } else if(objEl){
    objEl.innerHTML='Preencha o peso atual para calcular a meta de proteína';
  }
}

// ─── STATE ───────────────────────────────────────────────────────────────────
let currentDate=today();
let dayData={};

function today(){return new Date().toISOString().split('T')[0];}
function getDow(s){const[y,m,d]=s.split('-');return new Date(+y,+m-1,+d).getDay();}
function addDays(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().split('T')[0];}
function dispDate(s){const[y,m,d]=s.split('-');const dt=new Date(+y,+m-1,+d);return{day:DAYS[dt.getDay()],date:d+' '+MONTHS[+m-1]};}
function getGoalPeriod(goal){
  const now=currentDate;
  if(goal.frequency==='daily')return{start:now,end:now};
  if(goal.frequency==='weekly'){const dow=getDow(now);const mon=addDays(now,-(dow===0?6:dow-1));return{start:mon,end:addDays(mon,6)};}
  if(goal.frequency==='monthly'){const[y,m]=now.split('-');const dim=new Date(+y,+m,0).getDate();return{start:`${y}-${m}-01`,end:`${y}-${m}-${String(dim).padStart(2,'0')}`};}
  if(goal.frequency==='yearly'){const y=now.split('-')[0];return{start:`${y}-01-01`,end:`${y}-12-31`};}
  if(goal.frequency==='once')return{start:'2000-01-01',end:goal.deadline||now};
  return{start:now,end:now};
}
function getGoalProgress(goal){
  const period=getGoalPeriod(goal);
  let total=goalLogs.filter(l=>l.goalId===goal.id&&l.date>=period.start&&l.date<=period.end).reduce((s,l)=>s+(l.value||0),0);
  if(goal.linkedWorkout){
    let d=period.start;while(d<=period.end&&d<=currentDate){const dd=d===currentDate?dayData:loadDay(d);if(getWorkoutById(dd.tr)?.type===goal.linkedWorkout){if(goal.linkedMetric==='sessions'){const sess=loadGymSession(d,dd.tr);if(sess&&sess.some(ex=>ex.sets&&ex.sets.some(s=>s.done)))total+=1;}else total+=(dd.gymDurMin||0);}d=addDays(d,1);}
  }
  const pct=goal.targetValue>0?Math.min(100,Math.round(total/goal.targetValue*100)):0;
  const remaining=Math.max(0,goal.targetValue-total);
  const endMs=new Date(period.end+'T12:00:00').getTime();
  const startMs=new Date(period.start+'T12:00:00').getTime();
  const nowMs=new Date(currentDate+'T12:00:00').getTime();
  const totalMs=endMs-startMs||1;
  const daysLeft=Math.max(0,Math.round((endMs-nowMs)/86400000));
  const pctTimeLeft=Math.round((endMs-nowMs)/totalMs*100);
  const isAtRisk=pct<70&&pctTimeLeft<20;
  return{total,pct,remaining,isAtRisk,daysLeft,pctTimeLeft,period};
}
function addGoalLog(goalId,value,note=''){
