<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<title>Rotina Diária</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sora',system-ui,sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh;-webkit-tap-highlight-color:transparent;}
button{cursor:pointer;border:none;font-family:inherit;transition:all .13s ease;}
button:active{transform:scale(.96);opacity:.85;}
textarea,input{font-family:inherit;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:2px;}
.fade-in{animation:fadeIn .22s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
#app{max-width:460px;margin:0 auto;}
.header{background:#161b22;border-bottom:1px solid #21262d;padding:12px 16px;position:sticky;top:0;z-index:50;}
.header-inner{display:flex;align-items:center;justify-content:space-between;}
.nav-btn{background:#21262d;color:#8b949e;padding:7px 13px;border-radius:8px;font-size:14px;}
.body{padding:12px 13px 80px;}
.card{background:#161b22;border:1px solid #21262d;border-radius:16px;padding:15px 13px;margin-bottom:10px;}
@media(min-width:768px){
  #app{max-width:none;margin:0 0 0 80px;}
  .bnav{top:0;right:auto;width:80px;border-top:none;border-right:1px solid #21262d;}
  .bnav-inner{flex-direction:column;max-width:none;width:100%;height:100%;padding:20px 0;justify-content:flex-start;align-items:stretch;}
  .bnav-btn{flex:0;padding:16px 8px;border-top:2px solid transparent;border-left:3px solid transparent;}
  .bnav-btn.active{border-top-color:transparent;border-left-color:#3b82f6;}
  .body{padding-bottom:24px;max-width:900px;}
  .header-inner{max-width:900px;}
}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.sec-lbl{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:700;color:#8b949e;letter-spacing:.1em;text-transform:uppercase;}
.check-row{width:100%;display:flex;align-items:flex-start;gap:12px;padding:11px 12px;border-radius:10px;text-align:left;background:#0d1117;border:1px solid #21262d;margin-bottom:7px;}
.check-row.done{background:#0d2818;border-color:#16a34a;}
.check-circle{width:22px;height:22px;border-radius:50%;flex-shrink:0;margin-top:1px;background:transparent;border:2px solid #30363d;display:flex;align-items:center;justify-content:center;transition:all .2s ease;font-size:12px;font-weight:800;color:#fff;}
.check-circle.done{background:#16a34a;border-color:#16a34a;}
.score-bar-wrap{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.score-bar-bg{flex:1;height:5px;background:#21262d;border-radius:99px;overflow:hidden;}
.score-bar-fill{height:100%;border-radius:99px;transition:width .45s ease;}
.meal-card{width:100%;text-align:left;border-radius:12px;padding:12px 13px;background:#0d1117;border:1px solid #21262d;display:flex;align-items:flex-start;gap:12px;margin-bottom:7px;}
.meal-card.done{background:#0d2818;border-color:#16a34a;}
.badge{display:inline-block;background:#21262d;border-radius:4px;padding:2px 7px;font-size:10px;color:#8b949e;font-weight:600;margin-top:5px;}
.water-bar{flex:1;height:32px;border-radius:6px;transition:background .2s;background:#0d1117;border:1px solid #21262d;}
.water-bar.active{background:#1d4ed8;border-color:#3b82f6;}
.toggle-chip{flex:1;padding:7px 8px;border-radius:8px;font-size:11px;font-weight:600;background:#0d1117;color:#6e7681;border:1px solid #21262d;}
.toggle-chip.active{background:rgba(249,115,22,.12);color:#f97316;border-color:rgba(249,115,22,.35);}
.toggle-chip.active.fds{background:rgba(52,211,153,.12);color:#34d399;border-color:rgba(52,211,153,.35);}
.day-type-btn{padding:10px 8px;border-radius:10px;font-size:11px;font-weight:700;line-height:1.3;background:#0d1117;color:#6e7681;border:1px solid #21262d;}
.pending-dot{width:5px;height:5px;border-radius:50%;background:#f87171;margin-top:7px;flex-shrink:0;}
.screen{display:none;}.screen.active{display:block;}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:#161b22;border-top:1px solid #21262d;}
.bnav-inner{display:flex;max-width:460px;margin:0 auto;}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 2px 12px;gap:2px;background:none;color:#6e7681;font-size:9px;font-weight:700;letter-spacing:.04em;border-top:2px solid transparent;border-radius:0;}
.bnav-btn.active{color:#e6edf3;border-top-color:#3b82f6;}
.bnav-icon{font-size:20px;line-height:1.2;}
</style>
</head>
<body>
<div id="app">
  <!-- AUTH SCREEN -->
  <div id="screen-auth" class="screen active">
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">
      <div style="width:100%;max-width:360px">
        <div style="text-align:center;margin-bottom:32px">
          <div style="font-size:36px;margin-bottom:10px">📋</div>
          <div style="font-size:22px;font-weight:800;color:#e6edf3">Rotina Diária</div>
          <div style="font-size:13px;color:#6e7681;margin-top:5px">Seus hábitos, em qualquer dispositivo</div>
        </div>
        <div id="auth-tabs" style="display:flex;background:#161b22;border-radius:10px;padding:3px;margin-bottom:20px;border:1px solid #21262d">
          <button onclick="authTab('login')" id="tab-login" style="flex:1;padding:9px;border-radius:8px;font-size:13px;font-weight:700;background:#21262d;color:#e6edf3">Entrar</button>
          <button onclick="authTab('register')" id="tab-register" style="flex:1;padding:9px;border-radius:8px;font-size:13px;font-weight:700;background:transparent;color:#6e7681">Criar conta</button>
        </div>
        <div id="auth-form">
          <input id="auth-email" type="email" placeholder="E-mail" autocomplete="email" style="width:100%;background:#161b22;border:1px solid #21262d;border-radius:10px;padding:13px 14px;color:#e6edf3;font-size:14px;margin-bottom:10px;outline:none">
          <input id="auth-password" type="password" placeholder="Senha (mínimo 8 caracteres)" autocomplete="current-password" style="width:100%;background:#161b22;border:1px solid #21262d;border-radius:10px;padding:13px 14px;color:#e6edf3;font-size:14px;margin-bottom:6px;outline:none">
          <div id="auth-error" style="font-size:12px;color:#f87171;min-height:18px;margin-bottom:8px;text-align:center"></div>
          <button onclick="authSubmit()" id="auth-btn" style="width:100%;padding:14px;background:#1f6feb;border-radius:10px;color:#fff;font-size:15px;font-weight:700">Entrar</button>
        </div>
        <div id="auth-confirm" style="display:none">
          <div style="font-size:13px;color:#8b949e;text-align:center;margin-bottom:16px;line-height:1.5">Enviamos um código para o seu e-mail.<br>Digite abaixo para confirmar a conta.</div>
          <input id="auth-code" type="text" inputmode="numeric" placeholder="000000" style="width:100%;background:#161b22;border:1px solid #21262d;border-radius:10px;padding:13px 14px;color:#e6edf3;font-size:22px;margin-bottom:6px;outline:none;text-align:center;letter-spacing:8px">
          <div id="auth-confirm-error" style="font-size:12px;color:#f87171;min-height:18px;margin-bottom:8px;text-align:center"></div>
          <button onclick="confirmCode()" style="width:100%;padding:14px;background:#16a34a;border-radius:10px;color:#fff;font-size:15px;font-weight:700">Confirmar e-mail</button>
        </div>
      </div>
    </div>
  </div>

  <!-- HOME SCREEN -->
  <div id="screen-home" class="screen">
    <div class="header">
      <div class="header-inner">
        <button class="nav-btn" onclick="changeDay(-1)">←</button>
        <div style="text-align:center">
          <div id="hdr-day" style="font-size:10px;color:#6e7681;font-weight:700;letter-spacing:.14em;text-transform:uppercase"></div>
          <div id="hdr-date" style="font-size:18px;font-weight:800;color:#e6edf3"></div>
          <div id="hdr-status" style="font-size:10px;height:14px;color:#34d399;font-weight:600">● HOJE</div>
          <div id="hdr-pct" style="font-size:11px;font-weight:700;margin-top:2px;height:16px"></div>
        </div>
        <button class="nav-btn" id="btn-next" onclick="changeDay(1)">→</button>
      </div>
      <div id="home-section-label" style="text-align:center;font-size:10px;font-weight:700;letter-spacing:.1em;color:#4d5863;padding-top:6px;padding-bottom:2px"></div>
    </div>
    <div class="body" id="main-body"></div>
  </div>

  <!-- GOALS SCREEN -->
  <div id="screen-goals" class="screen">
    <div class="header">
      <div class="header-inner">
        <button class="nav-btn" onclick="showMais()">←</button>
        <div style="font-size:16px;font-weight:800;color:#e6edf3">Minhas Metas</div>
        <div style="width:44px"></div>
      </div>
    </div>
    <div class="body" id="goals-body"></div>
  </div>

  <!-- SUPS SCREEN -->
  <div id="screen-sups" class="screen">
    <div class="header">
      <div class="header-inner">
        <button class="nav-btn" onclick="showMais()">←</button>
        <div style="font-size:16px;font-weight:800;color:#e6edf3">Gerenciar Suplementos</div>
        <button onclick="editSup(null)" style="background:#1f6feb;color:#fff;padding:7px 13px;border-radius:8px;font-size:14px;font-weight:700">+ Novo</button>
      </div>
    </div>
    <div class="body" id="sups-body"></div>
  </div>

  <!-- HISTORY SCREEN -->
  <div id="screen-history" class="screen">
    <div class="header">
      <div class="header-inner">
        <button class="nav-btn" onclick="showMais()">←</button>
        <div style="font-size:16px;font-weight:800;color:#e6edf3">Histórico</div>
        <div style="width:44px"></div>
      </div>
    </div>
    <div class="body" id="history-body"></div>
  </div>

  <!-- BODY COMP SCREEN -->
  <div id="screen-body" class="screen">
    <div class="header">
      <div class="header-inner">
        <button class="nav-btn" onclick="showMais()">←</button>
        <div style="font-size:16px;font-weight:800;color:#e6edf3">Composição Corporal</div>
        <div style="width:44px"></div>
      </div>
    </div>
    <div class="body" id="body-comp-body"></div>
  </div>

  <!-- GYM SCREEN -->
  <div id="screen-gym" class="screen">
    <div class="header">
      <div class="header-inner">
        <button class="nav-btn" onclick="showBnav('hoje')">←</button>
        <div style="text-align:center">
          <div id="gym-hdr-info" style="font-size:10px;color:#6e7681;font-weight:700;letter-spacing:.12em;text-transform:uppercase"></div>
          <div id="gym-hdr-title" style="font-size:16px;font-weight:800;color:#e6edf3">Log de Treino</div>
        </div>
        <button onclick="gymTogglePlan()" id="gym-plan-btn" style="background:#21262d;color:#8b949e;padding:6px 11px;border-radius:8px;font-size:12px;font-weight:700">📋 Plano</button>
      </div>
    </div>
    <div class="body" id="gym-body"></div>
  </div>

  <!-- MAIS SCREEN -->
  <div id="screen-mais" class="screen">
    <div class="header">
      <div class="header-inner">
        <div style="width:44px"></div>
        <div style="font-size:16px;font-weight:800;color:#e6edf3">Menu</div>
        <div style="width:44px"></div>
      </div>
    </div>
    <div class="body" id="mais-body"></div>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bnav">
  <div class="bnav-inner">
    <button class="bnav-btn active" id="bnav-hoje" onclick="showBnav('hoje')"><span class="bnav-icon">📊</span>Hoje</button>
    <button class="bnav-btn" id="bnav-nutricao" onclick="showBnav('nutricao')"><span class="bnav-icon">🍽️</span>Nutrição</button>
    <button class="bnav-btn" id="bnav-suplday" onclick="showBnav('suplday')"><span class="bnav-icon">💊</span>Supl.</button>
    <button class="bnav-btn" id="bnav-gym" onclick="showBnav('gym')"><span class="bnav-icon">🏋️</span>Treino</button>
    <button class="bnav-btn" id="bnav-mais" onclick="showBnav('mais')"><span class="bnav-icon">☰</span>Mais</button>
  </div>
</nav>

<script>
// ─── DATA ────────────────────────────────────────────────────────────────────
const DAYS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MONTHS=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const DESCANSO={id:'descanso',name:'Descanso',type:'descanso',icon:'🛌',color:'#6e7681',weekDays:[]};
const WK_COLORS={musculacao:'#818cf8',aerobico:'#38bdf8',descanso:'#6e7681'};
const WK_ICONS ={musculacao:'🏋️',aerobico:'🏃',descanso:'🛌'};
const GYM_GROUPS=['Peito','Costas','Ombro','Bíceps','Tríceps','Perna','Core','Glúteo','Cardio','Outro'];
function loadUserWorkouts(){
  try{const s=JSON.parse(localStorage.getItem('ht:workouts')||'null');if(s&&Array.isArray(s)&&s.length)return s;}catch{}
  return[
    {id:'wk_musc',name:'Musculação',type:'musculacao',icon:'🏋️',color:'#818cf8',weekDays:[1,2,4,5]},
    {id:'wk_aero',name:'Aeróbico',  type:'aerobico',  icon:'🏃', color:'#38bdf8',weekDays:[3,6]},
  ];
}
let userWorkouts=loadUserWorkouts();
function saveUserWorkouts(){
  try{localStorage.setItem('ht:workouts',JSON.stringify(userWorkouts));}catch{}
  if(!USE_API||!authToken) return;
  fetch(`${API_URL}?date=__workouts__`,{method:'PUT',headers:{'content-type':'application/json',authorization:'Bearer '+authToken},body:JSON.stringify(userWorkouts)}).catch(()=>{});
}
async function syncUserWorkouts(){
  if(!USE_API||!authToken) return;
  try{
    const r=await fetch(`${API_URL}?date=__workouts__`,{headers:{authorization:'Bearer '+authToken}});
    if(r.ok){const d=await r.json();if(Array.isArray(d)&&d.length>0){userWorkouts=d;try{localStorage.setItem('ht:workouts',JSON.stringify(d));}catch{}}}
  }catch{}
}
function getWorkoutById(id){return id==='descanso'?DESCANSO:(userWorkouts.find(w=>w.id===id)||null);}
function isGymType(tr){return userWorkouts.find(w=>w.id===tr)?.type==='musculacao';}
function getAllDayOptions(){return[...userWorkouts,DESCANSO];}
const MEALS=[
  {id:'cafe',  label:'Café da manhã',icon:'☀️',time:'08:00'},
  {id:'almoco',label:'Almoço',       icon:'🥗',time:'12:00'},
  {id:'lanche',label:'Lanche',       icon:'🥛',time:'16:00'},
  {id:'jantar',label:'Jantar',       icon:'🌙',time:'19:00'},
  {id:'ceia',  label:'Ceia',         icon:'🍓',time:'21:00'},
];
function getMealDetail(id,d){
  if(id==='cafe') return d.isFds
    ?{macro:'~350 kcal · ~28g prot',hint:'Pão francês + 2 ovos + Requeijão light + Whey 14g',badge:'Final de semana'}
    :{macro:'~380 kcal · ~35g prot',hint:'Whey 28g + Banana 100g + Creatina + Leite em pó desnatado',badge:'Semana'};
  if(id==='almoco') return d.almocoCarb
    ?{macro:'~520 kcal · ~38g prot',hint:'Salada à vontade + Frango 100g + Macarrão 110g + Legumes 150g',badge:'Com carboidrato'}
    :{macro:'~380 kcal · ~36g prot',hint:'Salada à vontade + Frango 100g + Legumes assados 150g + Azeite 8g',badge:'Low carb'};
  if(id==='lanche') return{macro:'~250 kcal · ~20g prot',hint:'Barrinha de proteína 60g  —  ou  —  3 ovos + Pão grãos + Creme de ricota',badge:'Doce ou salgada'};
  if(id==='jantar'){
    if(d.jantarV==='hamburguer') return{macro:'~480 kcal · ~35g prot',hint:'Pão francês + Hambúrguer patinho 100g + Maionese light + Queijo',badge:'🍔 Hambúrguer'};
    if(d.jantarV==='rap10')      return{macro:'~330 kcal · ~30g prot',hint:'Rap10 fibras + Frango desfiado 80g + Requeijão light 30g',badge:'🌯 Rap10'};
    return{macro:'~380 kcal · ~34g prot',hint:'Salada + Frango 100g + Batata inglesa 120g + Ketchup',badge:'🍽️ Refeição'};
  }
  return{macro:'~200 kcal · ~22g prot',hint:'Iogurte grego + cacau em pó + morangos + Whey misturado',badge:'21:00'};
}
const DEFAULT_SUPS=[
  {id:'pump',  label:'PUMP — pré-treino',     sub:'Cafeína + Ioimbina + Capsaicina + Astaxantina',icon:'⚡',showOn:'treino'},
  {id:'oxi',   label:'Oximetalona 4mg',        sub:'1 comprimido antes do treino de perna',         icon:'💪',showOn:'treino'},
  {id:'f2',    label:'Fórmula 2',              sub:'Berberina + Inositol + Cromo + Topiramato — antes do jantar',icon:'🟣',showOn:'always'},
  {id:'dhea',  label:'DHEA 25mg',              sub:'1 comprimido à noite',                          icon:'🟡',showOn:'always'},
  {id:'omega', label:'Ômega-3',                sub:'Dose diária',                                   icon:'🐟',showOn:'always'},
  {id:'zm',    label:'Zinco + Magnésio',        sub:'Growth — dose diária',                         icon:'⚪',showOn:'always'},
  {id:'col',   label:'Colágeno',               sub:'Dose diária',                                   icon:'🟤',showOn:'always'},
];
function getSups(tr){
  return customSups.filter(s=>
    s.showOn==='always'||
    (s.showOn==='treino'&&tr!=='descanso')||
    (s.showOn==='descanso'&&tr==='descanso')
  );
}
const SLEEPS=[{id:'s1',l:'< 6h',ok:false},{id:'s2',l:'6–7h',ok:false},{id:'s3',l:'7–8h',ok:true},{id:'s4',l:'8h+',ok:true}];

// ─── CUSTOM SUPPLEMENTS ──────────────────────────────────────────────────────
let customSups=loadCustomSups();
let _supEditId=null;
let _importPreview=[];

function loadCustomSups(){
  try{
    const raw=localStorage.getItem('ht:csups');
    if(raw!==null){const s=JSON.parse(raw);if(Array.isArray(s))return s;}
  }catch{}
  return DEFAULT_SUPS.map(s=>({...s}));
}
function saveCustomSups(){
  try{localStorage.setItem('ht:csups',JSON.stringify(customSups));}catch{}
  if(!USE_API||!authToken) return;
  fetch(`${API_URL}?date=__csups__`,{method:'PUT',headers:{'content-type':'application/json',authorization:'Bearer '+authToken},body:JSON.stringify(customSups)}).catch(()=>{});
}
async function syncCustomSups(){
  if(!USE_API||!authToken) return;
  try{
    const r=await fetch(`${API_URL}?date=__csups__`,{headers:{authorization:'Bearer '+authToken}});
    if(r.ok){const d=await r.json();if(Array.isArray(d)&&d.length>0){customSups=d;try{localStorage.setItem('ht:csups',JSON.stringify(d));}catch{}}}
  }catch{}
}

function showSups(){_importPreview=[];renderSupsList();showScreen('sups');setBnavActive('mais');}

function renderSupsList(){
  const whenLbl={always:'Sempre · todos os dias',treino:'Só dias de treino',descanso:'Só dias de descanso'};
  const rows=customSups.length>0
    ?customSups.map(s=>`
      <div style="background:#0d1117;border:1px solid #21262d;border-radius:10px;padding:12px 13px;margin-bottom:7px;display:flex;align-items:flex-start;gap:12px">
        <div style="font-size:22px;flex-shrink:0;margin-top:1px">${s.icon||'💊'}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:700;color:#e6edf3;margin-bottom:2px">${s.label}</div>
          ${s.sub?`<div style="font-size:11px;color:#6e7681;margin-bottom:3px">${s.sub}</div>`:''}
          <div style="font-size:10px;color:#4d5863">${whenLbl[s.showOn]||'Sempre'}</div>
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0">
          <button onclick="editSup('${s.id}')" style="background:#21262d;color:#8b949e;padding:6px 10px;border-radius:7px;font-size:12px">✏️</button>
          <button onclick="deleteSup('${s.id}')" style="background:#21262d;color:#f87171;padding:6px 10px;border-radius:7px;font-size:12px">🗑️</button>
        </div>
      </div>`).join('')
    :`<div style="text-align:center;color:#6e7681;padding:28px 0;font-size:13px;line-height:1.7">Nenhum suplemento cadastrado.<br>Adicione manualmente ou importe de PDF/foto.</div>`;

  const prevHtml=_importPreview.length?renderImportPreviewHtml():'';

  document.getElementById('sups-body').innerHTML=`
    <div class="card fade-in">
      <div class="sec-hdr"><div class="sec-lbl"><span>📎</span> IMPORTAR DE PDF OU FOTO</div></div>
      <div style="font-size:11px;color:#6e7681;margin-bottom:10px">Envie uma receita, prescrição ou foto da sua suplementação. A IA extrai os itens automaticamente.</div>
      <input type="file" id="sup-file-input" accept=".pdf,image/*" style="position:absolute;opacity:0;pointer-events:none;width:1px;height:1px" onchange="handleSupFile(this)">
      <button type="button" onclick="document.getElementById('sup-file-input').click()" style="display:block;width:100%;background:#0d1117;border:2px dashed #30363d;border-radius:10px;padding:18px;text-align:center;color:#6e7681;font-size:13px" onmouseover="this.style.borderColor='#3b82f6'" onmouseout="this.style.borderColor='#30363d'">
        📄 Selecionar PDF ou imagem
      </button>

// ── Importação via IA ─────────────────────────────────────────────────────────
async function analyzeViaLambda(file,context){
  const base64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});
  const resp=await fetch(`${API_URL}?action=analyze`,{
    method:'POST',
    headers:{'content-type':'application/json',authorization:'Bearer '+authToken},
    body:JSON.stringify({file:base64,mimeType:file.type,context})
  });
  const data=await resp.json();
  if(!resp.ok) throw new Error(data.error||'Erro ao analisar arquivo');
  return data.items;
}

async function handleSupFile(input){
  const file=input.files[0];if(!file) return;
  const statusEl=document.getElementById('import-status');
  statusEl.innerHTML='<span style="color:#fbbf24">⏳ Analisando com IA — aguarde...</span>';
  try{
    const sups=await analyzeViaLambda(file,'supplements');
    _importPreview=sups.map((s,i)=>({...{showOn:'always'},...s,id:'cs_'+Date.now()+i,_checked:true}));
    document.getElementById('import-preview').innerHTML=renderImportPreviewHtml();
    statusEl.innerHTML=`<span style="color:#34d399">✓ ${sups.length} item(s) encontrado(s) — selecione os que deseja importar</span>`;
  }catch(e){
    statusEl.innerHTML=`<span style="color:#f87171">❌ ${e.message}</span>`;
  }
}

function renderImportPreviewHtml(){
  if(!_importPreview.length) return '';
  const rows=_importPreview.map((s,i)=>`
    <label style="display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:#0d1117;border:1px solid #21262d;border-radius:9px;margin-bottom:6px;cursor:pointer">
      <input type="checkbox" id="imp-${i}" ${s._checked?'checked':''} style="margin-top:3px;width:15px;height:15px;accent-color:#1f6feb;flex-shrink:0">
      <div style="flex:1">
        <div style="font-size:13px;font-weight:700;color:#e6edf3">${s.icon||'💊'} ${s.label}</div>
        ${s.sub?`<div style="font-size:11px;color:#6e7681;margin-top:2px">${s.sub}</div>`:''}
        <div style="font-size:10px;color:#4d5863;margin-top:2px">${{always:'Sempre',treino:'Treino',descanso:'Descanso'}[s.showOn]||'Sempre'}</div>
      </div>
    </label>`).join('');
  return`<div style="margin-top:10px">${rows}<button onclick="importSelectedSups()" style="width:100%;padding:12px;background:#16a34a;border-radius:10px;color:#fff;font-size:14px;font-weight:700;margin-top:4px">Importar selecionados</button></div>`;
}

function importSelectedSups(){
  let count=0;
  _importPreview.forEach((s,i)=>{
    if(document.getElementById('imp-'+i)?.checked){
      const{_checked,...sup}=s;customSups.push(sup);count++;
    }
  });
  if(count){saveCustomSups();renderUI();}
  _importPreview=[];
  renderSupsList();
  if(count) document.getElementById('import-status').innerHTML=`<span style="color:#34d399">✓ ${count} suplemento(s) adicionado(s) à sua lista!</span>`;
}

let gymPlan=loadGymPlan();

function loadGymPlan(){try{return JSON.parse(localStorage.getItem('ht:gymplan')||'{}');}catch{return{};}}
function saveGymPlan(){
  try{localStorage.setItem('ht:gymplan',JSON.stringify(gymPlan));}catch{}
  if(!USE_API||!authToken) return;
  fetch(`${API_URL}?date=__gymplan__`,{method:'PUT',headers:{'content-type':'application/json',authorization:'Bearer '+authToken},body:JSON.stringify(gymPlan)}).catch(()=>{});
}
async function syncGymPlan(){
  if(!USE_API||!authToken) return;
  try{
    const r=await fetch(`${API_URL}?date=__gymplan__`,{headers:{authorization:'Bearer '+authToken}});
    if(r.ok){const d=await r.json();if(d&&typeof d==='object'&&!Array.isArray(d)){gymPlan=d;try{localStorage.setItem('ht:gymplan',JSON.stringify(d));}catch{}}}
  }catch{}
}
function loadGymSession(date,tr){try{return JSON.parse(localStorage.getItem('ht:gym:'+date+':'+(tr||''))||'null');}catch{return null;}}
function saveGymSession(date,tr,data){try{localStorage.setItem('ht:gym:'+date+':'+(tr||''),JSON.stringify(data));}catch{}}
function getLastGymSession(tr,beforeDate){
  for(let i=1;i<=90;i++){
    const d=addDays(beforeDate,-i);
    const dd=loadDay(d);
    if(dd.tr===tr){const s=loadGymSession(d,tr);if(s&&s.length>0) return{date:d,session:s};}
  }
  return null;
}

  const trObj=getWorkoutById(tr)||userWorkouts[0]||DESCANSO;

  if(_gymViewPlan){renderGymPlan(gymBody);return;}

function gymDone(ei,si){
  const tr=loadDay(currentDate).tr;
  const s=loadGymSession(currentDate,tr)||[];if(!s?.[ei]?.sets?.[si]) return;
  s[ei].sets[si].done=!s[ei].sets[si].done;saveGymSession(currentDate,tr,s);renderGym();
}
function gymAddSet(ei){
  const tr=loadDay(currentDate).tr;
  const s=loadGymSession(currentDate,tr)||[];if(!s[ei]) return;
  const last=s[ei].sets[s[ei].sets.length-1];
  s[ei].sets.push({reps:last?.reps||'',kg:last?.kg||'',done:false});
  saveGymSession(currentDate,tr,s);renderGym();
}
function gymDelSet(ei,si){
  const tr=loadDay(currentDate).tr;
  const s=loadGymSession(currentDate,tr)||[];
  if(!s[ei]||s[ei].sets.length<=1) return;
  s[ei].sets.splice(si,1);saveGymSession(currentDate,tr,s);renderGym();
}
function gymDelEx(ei){
  const tr=loadDay(currentDate).tr;
  const s=loadGymSession(currentDate,tr)||[];
  s.splice(ei,1);saveGymSession(currentDate,tr,s);renderGym();
}

  const name=(document.getElementById('gym-new-name')?.value||'').trim();

  const group=document.getElementById('gym-new-group')?.value||'Outro';

  const repsVal=(document.getElementById('gym-new-reps')?.value||'').trim();
  const id='ex_'+Date.now();

function importGymPlanSelected(){

  _gymPlanPreview.forEach((ex,i)=>{
    if(document.getElementById('gimp-'+i)?.checked){

      gymPlan[tr].push({id:item.id,name:item.name,group:item.group||'Outro',defaultSets:item.sets||3,defaultReps:String(item.reps||''),obs:item.obs||''});
      count++;

  if(count) saveGymPlan();

function renderBodyChart(sorted,metric){
  const data=sorted.map(e=>({date:e.date,v:metric==='fat'?e.fat:metric==='lean'?e.lean:e.weight})).filter(e=>e.v!=null&&!isNaN(e.v));
  if(data.length<2) return '<div style="text-align:center;color:#6e7681;padding:24px;font-size:12px">Adicione mais registros para ver o gráfico</div>';
  const W=320,H=150,padT=12,padB=28,padL=40,padR=10,cW=W-padL-padR,cH=H-padT-padB;
  const vals=data.map(d=>d.v);
  const minV=Math.min(...vals),maxV=Math.max(...vals),range=maxV-minV||0.5,padded=range*0.15;
  const yMin=minV-padded,yMax=maxV+padded,yRange=yMax-yMin;
  const xS=i=>padL+(data.length>1?(i/(data.length-1))*cW:cW/2);
  const yS=v=>padT+cH-((v-yMin)/yRange)*cH;
  const color=metric==='fat'?'#fb923c':metric==='lean'?'#34d399':'#38bdf8';
  const unit=metric==='fat'?'%':'kg';
  const gId='g_'+metric;
  const pathD=data.map((d,i)=>(i===0?'M':'L')+xS(i).toFixed(1)+','+yS(d.v).toFixed(1)).join(' ');
  const areaD=pathD+' L'+xS(data.length-1).toFixed(1)+','+(padT+cH).toFixed(1)+' L'+padL+','+(padT+cH).toFixed(1)+' Z';
  const dots=data.map((d,i)=>`<circle cx="${xS(i).toFixed(1)}" cy="${yS(d.v).toFixed(1)}" r="${i===data.length-1?4:2.5}" fill="${color}" stroke="#161b22" stroke-width="${i===data.length-1?2:1}"/>`).join('');
  const lastX=xS(data.length-1),lastY=yS(data[data.length-1].v);
  const lastAnchor=data.length>1&&lastX>W*0.7?'end':'start';
  const lastLabelX=lastAnchor==='end'?lastX-6:lastX+6;
  const lastLabel=`<text x="${lastLabelX.toFixed(1)}" y="${(lastY-8).toFixed(1)}" text-anchor="${lastAnchor}" font-size="9" font-weight="700" fill="${color}">${data[data.length-1].v.toFixed(1)}${unit}</text>`;
  const nY=4;
  const yTicks=Array.from({length:nY}).map((_,i)=>{
    const v=yMin+(yRange/(nY-1))*i,y=yS(v);
    return`<text x="${(padL-4).toFixed(1)}" y="${y.toFixed(1)}" text-anchor="end" font-size="8" fill="#4d5863" dominant-baseline="middle">${v.toFixed(1)}</text><line x1="${padL}" y1="${y.toFixed(1)}" x2="${(padL+cW).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#21262d" stroke-width="0.5" stroke-dasharray="3,3"/>`;
  }).join('');
  const maxLbls=Math.min(5,data.length);
  const lblIdx=data.length<=maxLbls?data.map((_,i)=>i):Array.from({length:maxLbls}).map((_,i)=>Math.round(i*(data.length-1)/(maxLbls-1)));
  const xLabels=lblIdx.map(i=>{const p=data[i].date.split('-');return`<text x="${xS(i).toFixed(1)}" y="${(H-6).toFixed(1)}" text-anchor="middle" font-size="8" fill="#4d5863">${p[2]}/${p[1]}</text>`;}).join('');
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <defs><linearGradient id="${gId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.3"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${yTicks}<path d="${areaD}" fill="url(#${gId})"/><path d="${pathD}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${lastLabel}${xLabels}
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${(padT+cH).toFixed(1)}" stroke="#30363d" stroke-width="1"/>
    <line x1="${padL}" y1="${(padT+cH).toFixed(1)}" x2="${(padL+cW).toFixed(1)}" y2="${(padT+cH).toFixed(1)}" stroke="#30363d" stroke-width="1"/>
  </svg>`;
}

function renderBodyComp(){
  const sorted=[...bodyEntries].sort((a,b)=>a.date.localeCompare(b.date));
  const latest=sorted[sorted.length-1];
  const prev=sorted.length>=2?sorted[sorted.length-2]:null;
  const earliest=sorted[0];

  function statCard(label,value,unit,delta,color){
    let dColor='#6e7681';
    if(delta!=null){
      if(unit==='%') dColor=delta>0?'#fb923c':delta<0?'#34d399':'#6e7681';
      else dColor=delta>0?'#fb923c':delta<0?'#34d399':'#6e7681';
    }
    const dHtml=delta!=null?`<div style="font-size:10px;color:${dColor};margin-top:2px">${delta>0?'+':''}${delta.toFixed(1)}${unit}</div>`:'';
    return`<div style="background:#0d1117;border:1px solid #21262d;border-radius:12px;padding:12px 6px;text-align:center">
      <div style="font-size:9px;color:#6e7681;font-weight:700;letter-spacing:.07em;margin-bottom:4px">${label}</div>
      <div style="font-size:19px;font-weight:800;color:${color}">${value!=null?value.toFixed(1):'—'}<span style="font-size:10px;color:#6e7681;font-weight:400">${unit}</span></div>
      ${dHtml}
    </div>`;
  }

  const wDelta=latest&&prev&&prev.weight!=null?+(latest.weight-prev.weight).toFixed(2):null;
  const fDelta=latest&&prev&&prev.fat!=null&&latest.fat!=null?+(latest.fat-prev.fat).toFixed(2):null;
  const lDelta=latest&&prev&&prev.lean!=null&&latest.lean!=null?+(latest.lean-prev.lean).toFixed(2):null;

  const statsHtml=latest?`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:10px">
    ${statCard('PESO',latest.weight,'kg',wDelta,'#38bdf8')}
    ${statCard('GORDURA',latest.fat,'%',fDelta,'#fb923c')}
    ${statCard('MASSA MAGRA',latest.lean,'kg',lDelta,'#34d399')}

function bcUpdateLean(){

function saveBodyEntry(){
  const w=parseFloat(document.getElementById('bc-weight')?.value);
  if(!w||w<=0){if(document.getElementById('bc-weight'))document.getElementById('bc-weight').style.borderColor='#f87171';return;}
  const f=parseFloat(document.getElementById('bc-fat')?.value)||null;
  const lean=w>0&&f!=null&&f>0?+(w*(1-f/100)).toFixed(2):null;
  const date=today();
  const entry={date,weight:+w.toFixed(2),fat:f!=null?+f.toFixed(2):null,lean};
  const idx=bodyEntries.findIndex(e=>e.date===date);
  if(idx>=0) bodyEntries[idx]=entry; else bodyEntries.push(entry);
  saveBodyEntries();
  goals={...goals,pesoAtual:String(w)};
  try{localStorage.setItem('ht:goals',JSON.stringify(goals));}catch{}
  renderBodyComp();
}

function deleteBodyEntry(date){
  if(!confirm('Excluir registro de '+date+'?')) return;
  bodyEntries=bodyEntries.filter(e=>e.date!==date);
  saveBodyEntries();
  renderBodyComp();
}

function goalsCalcUpdate(){
  const peso=parseFloat(document.getElementById('g-peso-atual')?.value)||0;
  const meta=parseFloat(document.getElementById('g-peso-meta')?.value)||0;
  const alt=parseFloat(document.getElementById('g-altura')?.value)||0;
  const idade=parseInt(document.getElementById('g-idade')?.value)||0;
  const sexo=goals.sexo||'f';
  const treinos=goals.treinosSemana||5;

  // Peso info
  const pesoInfoEl=document.getElementById('g-peso-info');
  if(pesoInfoEl&&peso>0&&meta>0){
    const diff=+(meta-peso).toFixed(1);
    if(Math.abs(diff)<=1) pesoInfoEl.innerHTML=`<span style="color:#34d399">✓ Manutenção — peso próximo da meta</span>`;
    else if(diff<0) pesoInfoEl.innerHTML=`<span style="color:#38bdf8">↓ Objetivo: perder ${Math.abs(diff)} kg</span>`;
    else pesoInfoEl.innerHTML=`<span style="color:#fb923c">↑ Objetivo: ganhar ${diff} kg</span>`;
  } else if(pesoInfoEl) pesoInfoEl.innerHTML='';

  // ── Água: 35 ml/kg (recomendação EFSA/IOM) ─────────────────────────────
  const aguaFormulaEl=document.getElementById('g-agua-formula');
  const aguaBtnsEl=document.getElementById('g-agua-btns');
  const aguaBadgeEl=document.getElementById('g-agua-badge');
  let aguaSug=goals.aguaCopos;
  if(peso>0){
    const ml=Math.round(peso*35);
    const copos=Math.max(6,Math.min(12,Math.round(ml/250)));
    const liters=(ml/1000).toFixed(1).replace('.',',');
    aguaSug=copos;
    if(aguaFormulaEl) aguaFormulaEl.innerHTML=`🧮 <b>${peso} kg</b> × 35 ml = <b>${ml} ml</b> (<b>${liters} L</b>) ÷ 250 ml/copo = <span style="color:#38bdf8;font-weight:700">${copos} copos · ${liters} L/dia</span><br><span style="color:#4d5863;font-size:10px">Base: 30–40 ml/kg — EFSA & Institute of Medicine</span>`;
    if(aguaBadgeEl) aguaBadgeEl.textContent='calculado automaticamente';
  } else {
    if(aguaFormulaEl) aguaFormulaEl.innerHTML='Preencha o peso atual para calcular automaticamente';
    if(aguaBadgeEl) aguaBadgeEl.textContent='';
  }
  if(aguaBtnsEl){
    const coposList=[6,7,8,9,10,11,12];
    const cur=goals.aguaCopos;
    aguaBtnsEl.innerHTML=coposList.map(n=>{
      const sel=cur===n;const isSug=n===aguaSug&&peso>0;
      return`<button onclick="goalsSelectAgua(${n})" id="ga-${n}" style="padding:8px 2px;border-radius:8px;font-size:12px;font-weight:700;background:${sel?'#1d4ed8':'#0d1117'};color:${sel?'#fff':'#6e7681'};border:1px solid ${sel?'#3b82f6':isSug?'#38bdf860':'#21262d'}">${n}${isSug?'<sup style="color:#38bdf8;font-size:8px">✦</sup>':''}</button>`;
    }).join('');
  }

  // ── Calorias: Mifflin-St Jeor + fator atividade + ajuste de meta ────────
  const calFormulaEl=document.getElementById('g-cal-formula');
  const calInpEl=document.getElementById('g-calorias');
  const calBadgeEl=document.getElementById('g-cal-badge');
  if(peso>0&&alt>0&&idade>0){
    const bmr=sexo==='m'
      ?(10*peso+6.25*alt-5*idade+5)
      :(10*peso+6.25*alt-5*idade-161);
    const actMap=[[1,1.2,'sedentário'],[3,1.375,'leve'],[5,1.55,'moderado'],[7,1.725,'intenso']];
    const [,fac,lbl]=actMap.find(([d])=>treinos<=d)||actMap[actMap.length-1];
    const tdee=Math.round(bmr*fac);
    let adj=0,adjHtml='';
    if(meta>0&&Math.abs(meta-peso)>1){
      if(meta<peso){adj=-400;adjHtml=` <span style="color:#38bdf8">− 400 kcal <span style="color:#4d5863">(déficit para perda)</span></span>`;}
      else{adj=300;adjHtml=` <span style="color:#fb923c">+ 300 kcal <span style="color:#4d5863">(superávit para ganho)</span></span>`;}
    }
    const cal=tdee+adj;
    if(calFormulaEl) calFormulaEl.innerHTML=`🧮 BMR <b>${Math.round(bmr)}</b> kcal × <b>${fac}</b> <span style="color:#8b949e">(treino ${lbl})</span> = <b>${tdee}</b> kcal${adjHtml}<br>→ <span style="color:#fb923c;font-weight:700">${cal} kcal/dia</span><br><span style="color:#4d5863;font-size:10px">Fórmula Mifflin-St Jeor (2005) — padrão ISSN/ACSM</span>`;
    if(calInpEl) calInpEl.value=cal;
    if(calBadgeEl) calBadgeEl.textContent='calculado automaticamente';
  } else {
    if(calFormulaEl) calFormulaEl.innerHTML='Preencha perfil, peso e altura para calcular automaticamente';
    if(calBadgeEl) calBadgeEl.textContent='';
  }
}

let currentDate=today();
let dayData={};

function today(){return new Date().toISOString().split('T')[0];}
function getDow(s){const[y,m,d]=s.split('-');return new Date(+y,+m-1,+d).getDay();}
function addDays(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().split('T')[0];}
function dispDate(s){const[y,m,d]=s.split('-');const dt=new Date(+y,+m-1,+d);return{day:DAYS[dt.getDay()],date:d+' '+MONTHS[+m-1]};}
function getCustomGoalProgress(goal){
  const id=goal.id,freq=goal.frequency,target=goal.target,linked=goal.linkedWorkout||'';
  function dayVal(d){
    const dd=d===currentDate?dayData:loadDay(d);
    if(linked) return dd.tr===linked?(dd.gymDurMin||0):0;
    return(dd.customLogs||{})[id]||0;
  }
  let logged=0;
  if(freq==='diaria'){
    logged=dayVal(currentDate);
  }else if(freq==='semanal'){
    const dow=getDow(currentDate);const mon=addDays(currentDate,-(dow===0?6:dow-1));
    for(let i=0;i<7;i++) logged+=dayVal(addDays(mon,i));
  }else if(freq==='mensal'){
    const[y,m]=currentDate.split('-');const dim=new Date(+y,+m,0).getDate();
    for(let i=1;i<=dim;i++) logged+=dayVal(`${y}-${m}-${String(i).padStart(2,'0')}`);
  }
  return{logged,pct:target>0?Math.min(100,Math.round(logged/target*100)):0};
}

function makeEmpty(date){
  const dow=getDow(date);
  const isFds=dow===0||dow===6;
  const suggested=userWorkouts.find(w=>w.weekDays.includes(dow));
  return{tr:suggested?.id||'descanso',isPerna:false,isFds,almocoCarb:false,jantarV:'refeicao',
         meals:{},sups:{},water:0,sleep:null,sleepOk:null,notes:'',customLogs:{},gymDurMin:0};
}

    const res=await cognito('InitiateAuth',{AuthFlow:'USER_PASSWORD_AUTH',ClientId:COGNITO_CLIENT_ID,AuthParameters:{USERNAME:email,PASSWORD:password}});
    if(res.AuthenticationResult){
      authToken=res.AuthenticationResult.AccessToken;
      authRefresh=res.AuthenticationResult.RefreshToken;
      localStorage.setItem('ht:token',authToken);
      localStorage.setItem('ht:refresh',authRefresh);
      showScreen('home');setBnavActive('hoje');render(true);
    }else{
      const t=res.__type||'';
      if(t.includes('NotAuthorized')) errEl.textContent='E-mail ou senha incorretos.';
      else if(t.includes('UserNotConfirmed')) errEl.textContent='Confirme o e-mail antes de entrar.';
      else errEl.textContent='Erro ao entrar. Tente novamente.';
    }
  }else{
    const res=await cognito('SignUp',{ClientId:COGNITO_CLIENT_ID,Username:email,Password:password,UserAttributes:[{Name:'email',Value:email}]});
    if(res.UserSub){
      pendingEmail=email;
      document.getElementById('auth-form').style.display='none';
      document.getElementById('auth-tabs').style.display='none';
      document.getElementById('auth-confirm').style.display='block';
    }else{
      const t=res.__type||'';
      if(t.includes('UsernameExists')) errEl.textContent='E-mail já cadastrado.';
      else if(t.includes('InvalidPassword')) errEl.textContent='Senha fraca. Use pelo menos 8 caracteres.';
      else errEl.textContent='Erro ao criar conta. Tente novamente.';
    }
  }
  btn.disabled=false;btn.textContent=authMode==='login'?'Entrar':'Criar conta';
}
async function confirmCode(){
  const code=document.getElementById('auth-code').value.trim();
  const errEl=document.getElementById('auth-confirm-error');
  if(!code){errEl.textContent='Digite o código.';return;}
  const res=await cognito('ConfirmSignUp',{ClientId:COGNITO_CLIENT_ID,Username:pendingEmail,ConfirmationCode:code});
  if(res.__type){errEl.textContent='Código inválido ou expirado.';return;}
  const pw=document.getElementById('auth-password').value;
  const login=await cognito('InitiateAuth',{AuthFlow:'USER_PASSWORD_AUTH',ClientId:COGNITO_CLIENT_ID,AuthParameters:{USERNAME:pendingEmail,PASSWORD:pw}});
  if(login.AuthenticationResult){
    authToken=login.AuthenticationResult.AccessToken;
    authRefresh=login.AuthenticationResult.RefreshToken;
    localStorage.setItem('ht:token',authToken);
    localStorage.setItem('ht:refresh',authRefresh);
    showScreen('home');render(true);
  }else{
    document.getElementById('auth-form').style.display='block';
    document.getElementById('auth-tabs').style.display='flex';
    document.getElementById('auth-confirm').style.display='none';
    authTab('login');
    document.getElementById('auth-error').textContent='Conta confirmada! Faça login.';
  }
}
async function tryRefresh(){
  if(!authRefresh) return false;
  const res=await cognito('InitiateAuth',{AuthFlow:'REFRESH_TOKEN_AUTH',ClientId:COGNITO_CLIENT_ID,AuthParameters:{REFRESH_TOKEN:authRefresh}});
  if(res.AuthenticationResult){
    authToken=res.AuthenticationResult.AccessToken;
    localStorage.setItem('ht:token',authToken);
    return true;
  }
  return false;
}
function signOut(){
  authToken=null;authRefresh=null;
  localStorage.removeItem('ht:token');localStorage.removeItem('ht:refresh');
  showScreen('auth');
}

// ─── API ─────────────────────────────────────────────────────────────────────
const API_URL='__API_URL__';
const USE_API=API_URL.startsWith('https://');

function loadDay(date){
  try{const s=localStorage.getItem('ht:'+date);return s?JSON.parse(s):makeEmpty(date);}
  catch{return makeEmpty(date);}
}
async function fetchRemote(date){
  if(!authToken) return null;
  try{
    const r=await fetch(`${API_URL}?date=${date}`,{headers:{authorization:'Bearer '+authToken}});
    if(r.status===401){const ok=await tryRefresh();if(ok)return fetchRemote(date);signOut();return null;}
    if(r.ok){const d=await r.json();return d||null;}
  }catch{}
  return null;
}
function saveDay(date,d){
  try{localStorage.setItem('ht:'+date,JSON.stringify(d));}catch{}
  if(!USE_API||!authToken) return;
  fetch(`${API_URL}?date=${date}`,{method:'PUT',headers:{'content-type':'application/json',authorization:'Bearer '+authToken},body:JSON.stringify(d)}).catch(()=>{});
}

function calcScore(d, date){
  const sups=getSups(d.tr);
  const mD=MEALS.filter(m=>d.meals[m.id]).length;
  const wD=d.water>=goals.aguaCopos?1:0;
  const slD=SLEEPS.find(s=>s.id===d.sleep)?.ok?1:0;
  const coD=d.sleepOk?1:0;
  const spD=sups.filter(s=>d.sups[s.id]).length;
  const isGym=isGymType(d.tr);
  let tD=0;
  if(isGym&&date){const sess=loadGymSession(date,d.tr);tD=sess&&sess.some(ex=>ex.sets.some(s=>s.done))?1:0;}
  const tT=isGym?1:0;
  const total=MEALS.length+1+2+sups.length+tT;
  const done=mD+wD+slD+coD+spD+tD;
  return{meals:{d:mD,t:MEALS.length},water:{d:wD,t:1},sleep:{d:slD+coD,t:2},
         sups:{d:spD,t:sups.length},treino:{d:tD,t:tT},
         pct:total>0?Math.round(done/total*100):0,done,total};
}

// ─── CLOUD SYNC ──────────────────────────────────────────────────────────────
async function syncGoals(){
  if(!USE_API||!authToken) return;
  try{
    const r=await fetch(`${API_URL}?date=__goals__`,{headers:{authorization:'Bearer '+authToken}});
    if(r.ok){const d=await r.json();if(d&&typeof d==='object'&&!Array.isArray(d)){goals={...DEFAULT_GOALS,...d};try{localStorage.setItem('ht:goals',JSON.stringify(goals));}catch{}}}
  }catch{}
  try{
    const r=await fetch(`${API_URL}?date=__csups__`,{headers:{authorization:'Bearer '+authToken}});
    if(r.ok){const d=await r.json();if(Array.isArray(d)&&d.length>0){customSups=d;try{localStorage.setItem('ht:csups',JSON.stringify(d));}catch{}}}
  }catch{}
  await syncBodyEntries();
  await syncGymPlan();
  await syncUserWorkouts();
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
let _homeTab='hoje';
function setHomeTab(t){_homeTab=t;renderUI();}

async function render(syncG=false){
  dayData=loadDay(currentDate);
  renderUI();
  if(USE_API){
    if(syncG) await syncGoals();
    const remote=await fetchRemote(currentDate);
    if(remote){
      if(JSON.stringify(remote)!==JSON.stringify(dayData)){
        dayData=remote;
        try{localStorage.setItem('ht:'+currentDate,JSON.stringify(dayData));}catch{}
        renderUI();
      }
    }else if(JSON.stringify(dayData)!==JSON.stringify(makeEmpty(currentDate))){
      saveDay(currentDate,dayData);
    }
  }
}
function renderUI(){
  const sc=calcScore(dayData,currentDate);

  document.getElementById('hdr-day').textContent=day;

    <div style="margin-bottom:10px"><div style="font-size:10px;color:#6e7681;font-weight:700;letter-spacing:.08em;margin-bottom:6px">VARIANTE DO JANTAR</div><div style="display:flex;gap:6px">${jBtns}</div></div>
    ${mealCards}
  </div>`;
  body.innerHTML=html;
}

function renderSuplDay(body,sc){
  const sups=getSups(dayData.tr);
  const wk=getWorkoutById(dayData.tr);
  const contextLabel=wk?`${wk.icon} ${wk.name}`:'Descanso';
  let html='';
  if(sups.length===0){
    html=`<div class="card fade-in" style="text-align:center;padding:28px 16px">
      <div style="font-size:36px;margin-bottom:10px">💊</div>
      <div style="font-size:14px;font-weight:700;color:#e6edf3;margin-bottom:6px">Nenhum suplemento configurado</div>
      <div style="font-size:12px;color:#6e7681;margin-bottom:16px">Configure seus suplementos em Mais → Gerenciar Suplementos</div>
      <button onclick="showBnav('mais')" style="padding:10px 20px;background:#21262d;border-radius:10px;color:#e6edf3;font-size:13px;font-weight:600">Ir para Mais →</button>
    </div>`;
  } else {
    const supRows=sups.map(s=>{
      const done=!!dayData.sups[s.id];
      return`<button class="check-row ${done?'done':''}" onclick="toggleSup('${s.id}')">
        <div class="check-circle ${done?'done':''}" style="${done?'':'border-color:#30363d'}">${done?'✓':''}</div>
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:6px"><span style="font-size:16px">${s.icon}</span><span style="font-size:13px;font-weight:700;color:${done?'#6e7681':'#c9d1d9'};text-decoration:${done?'line-through':'none'}">${s.label}</span></div>
          <div style="font-size:11px;color:${done?'#3d5040':'#4d5863'};margin-top:3px;line-height:1.4">${s.sub}</div>
        </div>
      </button>`;
    }).join('');
    const doneCnt=sups.filter(s=>dayData.sups[s.id]).length;
    const allDone=doneCnt===sups.length;
    html=`<div class="card fade-in">
      <div class="sec-hdr">
        <div class="sec-lbl"><span>💊</span> SUPLEMENTOS DO DIA</div>
        <span style="font-size:11px;font-family:'DM Mono',monospace;color:${allDone?'#fbbf24':'#6e7681'}">${doneCnt}/${sups.length}</span>
      </div>
      <div style="font-size:11px;color:#6e7681;margin-bottom:12px">Protocolo: <b style="color:#8b949e">${contextLabel}</b></div>
      ${supRows}
      ${allDone?'<div style="text-align:center;font-size:11px;color:#fbbf24;font-weight:600;padding-top:4px">⭐ Todos os suplementos tomados!</div>':''}
    </div>
    <div style="text-align:center;margin-top:8px">
      <button onclick="showBnav('mais')" style="font-size:11px;color:#4d5863;background:none;text-decoration:underline">Gerenciar lista de suplementos →</button>
    </div>`;
  }
  body.innerHTML=html;
}

// ─── BOTTOM NAV ──────────────────────────────────────────────────────────────
function showBnav(id){
  if(id==='hoje'||id==='nutricao'||id==='suplday'){
    _homeTab=id;showScreen('home');renderUI();
  } else if(id==='gym'){showGym();}
  else if(id==='mais'){showMais();}
  else if(id==='history'){showHistory();}
  else if(id==='body'){showBodyComp();}
  setBnavActive(id);
}
function setBnavActive(id){
  document.querySelectorAll('.bnav-btn').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById('bnav-'+id);if(el) el.classList.add('active');
}
function closeBnavMore(){}
function showMais(){
  renderMais();
  showScreen('mais');
  setBnavActive('mais');
}
function renderMais(){
  const body=document.getElementById('mais-body');
  if(!body) return;
  const items=[
    {icon:'📈',label:'Composição Corporal',sub:'Peso · % gordura · massa magra',fn:"showBodyComp()",c:'#38bdf8'},
    {icon:'📋',label:'Histórico',sub:'Seus últimos 60 dias',fn:"showHistory()",c:'#818cf8'},
    {icon:'🎯',label:'Metas Pessoais',sub:'Água, exercícios, calorias e mais',fn:"showGoals()",c:'#34d399'},
    {icon:'💊',label:'Gerenciar Suplementos',sub:'Cadastrar e editar seus suplementos',fn:"showSups()",c:'#fbbf24'},
  ];
  const cards=items.map(it=>`
    <button onclick="${it.fn}" style="width:100%;display:flex;align-items:center;gap:14px;padding:16px 14px;background:#161b22;border:1px solid #21262d;border-radius:14px;margin-bottom:8px;text-align:left">
      <div style="width:44px;height:44px;border-radius:12px;background:${it.c}18;border:1px solid ${it.c}40;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">${it.icon}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:700;color:#e6edf3">${it.label}</div>
        <div style="font-size:11px;color:#6e7681;margin-top:2px">${it.sub}</div>
      </div>
      <span style="color:#4d5863;font-size:16px">›</span>
    </button>`).join('');
  body.innerHTML=`
    <div class="fade-in">
      ${cards}
      <div style="height:1px;background:#21262d;margin:12px 0"></div>
      <button onclick="signOut()" style="width:100%;display:flex;align-items:center;gap:14px;padding:14px;background:none;border:1px solid #21262d;border-radius:14px;text-align:left">
        <div style="width:44px;height:44px;border-radius:12px;background:#f8717118;border:1px solid #f8717140;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">🚪</div>
        <div style="font-size:14px;font-weight:700;color:#f87171">Sair da conta</div>
      </button>
    </div>`;
}

// ─── HISTORY ─────────────────────────────────────────────────────────────────
function showHistory(){
  const days=60;
  const hist=[];
  for(let i=0;i<days;i++){
    const d=addDays(today(),-i);
    const dd=loadDay(d);
    hist.push({date:d,pct:calcScore(dd,d).pct});
  }
  const avg=Math.round(hist.reduce((a,d)=>a+d.pct,0)/hist.length);
  const great=hist.filter(d=>d.pct>=80).length;
  let streak=0; for(const d of hist){if(d.pct>=80)streak++;else break;}

  const stats=[{l:'Média 60d',v:avg+'%',c:'#818cf8'},{l:'Dias ótimos',v:great,c:'#34d399'},{l:'Sequência',v:streak+'d',c:'#fbbf24'}];
  const statsHtml=stats.map(s=>`<div class="card" style="padding:14px 10px;text-align:center;margin-bottom:0"><div style="font-size:22px;font-weight:800;color:${s.c}">${s.v}</div><div style="font-size:10px;color:#6e7681;font-weight:600;margin-top:3px">${s.l}</div></div>`).join('');

  const hist60=[...hist].reverse();
  const firstDow=getDow(hist60[0].date);
  const offsetCells=Array(firstDow).fill('<div></div>').join('');
  const calCells=hist60.map(({date,pct})=>{
    const bg=pct===0?'#1c2128':pct>=80?'#166534':pct>=55?'#78350f':'#7f1d1d';
    const c=pct===0?'#30363d':pct>=80?'#86efac':pct>=55?'#fcd34d':'#fca5a5';
    const {date:d}=dispDate(date);
    return`<div title="${d} — ${pct}%" style="aspect-ratio:1;border-radius:6px;background:${bg};display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:${c}">${pct>0?pct:''}</div>`;
  }).join('');

  const listRows=hist.map(({date,pct})=>{
    const{day,date:d}=dispDate(date);
    const c=pct>=80?'#34d399':pct>=55?'#fbbf24':pct>0?'#f87171':'#30363d';
    return`<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 10px;background:#0d1117;border-radius:10px;border:1px solid #21262d;margin-bottom:6px">
      <div><span style="font-size:12px;font-weight:700;color:#e6edf3">${day} </span><span style="font-size:12px;color:#6e7681">${d}</span></div>
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:60px;height:4px;background:#21262d;border-radius:99px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${c};border-radius:99px"></div></div>
        <span style="font-size:12px;font-weight:700;color:${c};font-family:'DM Mono',monospace;width:32px;text-align:right">${pct}%</span>
      </div>
    </div>`;
  }).join('');

  document.getElementById('history-body').innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px">${statsHtml}</div>
    <div class="card">
      <div class="sec-hdr"><div class="sec-lbl"><span>📅</span> ÚLTIMOS 60 DIAS</div></div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">
        ${DAYS.map(d=>`<div style="font-size:9px;color:#6e7681;font-weight:700;text-align:center;margin-bottom:4px">${d}</div>`).join('')}
        ${offsetCells}${calCells}
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;justify-content:center;flex-wrap:wrap">
        ${[{c:'#166534',tc:'#86efac',l:'≥80%'},{c:'#78350f',tc:'#fcd34d',l:'55–79%'},{c:'#7f1d1d',tc:'#fca5a5',l:'<55%'},{c:'#1c2128',tc:'#30363d',l:'Sem dado'}].map(x=>`<div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:10px;border-radius:3px;background:${x.c}"></div><span style="font-size:10px;color:${x.tc}">${x.l}</span></div>`).join('')}
      </div>
    </div>
    <div class="card"><div class="sec-hdr"><div class="sec-lbl"><span>📋</span> DETALHES</div></div><div style="max-height:360px;overflow-y:auto">${listRows}</div></div>`;

  showScreen('history');setBnavActive('mais');
}

// ─── CUSTOM GOALS ────────────────────────────────────────────────────────────
function renderCustomGoalsSection(){
  const cgs=goals.customGoals||[];
  const freqOpts=['diaria','semanal','mensal'].map(f=>`<option value="${f}">${{diaria:'Diária',semanal:'Semanal',mensal:'Mensal'}[f]}</option>`).join('');
  const inp='background:#0d1117;border:1px solid #21262d;border-radius:8px;padding:9px 10px;color:#e6edf3;font-size:13px;outline:none';
  const listRows=cgs.map((g,i)=>`
    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;${i<cgs.length-1?'border-bottom:1px solid #21262d':''}">
      <div style="font-size:22px">${g.icon||'🎯'}</div>
      <div style="flex:1">
        <div style="font-size:13px;font-weight:700;color:#e6edf3">${g.name}</div>
        <div style="font-size:11px;color:#6e7681">${{diaria:'Diária',semanal:'Semanal',mensal:'Mensal'}[g.frequency]} · Meta: ${g.target} ${g.unit}</div>
      </div>
      <button onclick="goalsDeleteCustom(${i})" style="padding:5px 9px;border-radius:7px;background:#7f1d1d20;border:1px solid #7f1d1d60;color:#f87171;font-size:12px">🗑️</button>
    </div>`).join('');
  const form=_cgFormOpen?`
    <div style="background:#0d1117;border:1px solid #21262d;border-radius:12px;padding:14px;margin-top:10px">
      <div style="display:grid;grid-template-columns:1fr 80px;gap:8px;margin-bottom:8px">
        <div><div style="font-size:11px;color:#6e7681;margin-bottom:4px">Nome da meta</div><input id="cg-name" placeholder="ex: Bike, Corrida" style="width:100%;${inp}"></div>
        <div><div style="font-size:11px;color:#6e7681;margin-bottom:4px">Ícone</div><input id="cg-icon" value="🎯" style="width:100%;${inp};text-align:center;font-size:18px"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px">
        <div><div style="font-size:11px;color:#6e7681;margin-bottom:4px">Unidade</div><input id="cg-unit" placeholder="min / km / h" style="width:100%;${inp}"></div>
        <div><div style="font-size:11px;color:#6e7681;margin-bottom:4px">Frequência</div><select id="cg-freq" style="width:100%;${inp}">${freqOpts}</select></div>
        <div><div style="font-size:11px;color:#6e7681;margin-bottom:4px">Meta</div><input id="cg-target" type="number" placeholder="150" style="width:100%;${inp}"></div>
      </div>
      <div style="margin-bottom:10px"><div style="font-size:11px;color:#6e7681;margin-bottom:4px">Vincular a treino <span style="color:#4d5863">(lê duração automaticamente)</span></div><select id="cg-linked" style="width:100%;${inp}"><option value="">— nenhum (entrada manual) —</option>${userWorkouts.map(w=>`<option value="${w.id}">${w.icon} ${w.name}</option>`).join('')}</select></div>
      <div style="display:flex;gap:7px">
        <button onclick="goalsCancelCustom()" style="flex:1;padding:9px;border-radius:9px;background:#21262d;color:#6e7681;font-size:13px;font-weight:700">Cancelar</button>
        <button onclick="goalsSaveCustom()" style="flex:2;padding:9px;border-radius:9px;background:#16a34a;color:#fff;font-size:13px;font-weight:700">Salvar meta</button>
      </div>
    </div>`:'';
  return`<div class="card"><div class="sec-hdr"><div class="sec-lbl"><span>🎯</span> METAS PERSONALIZADAS</div><button onclick="goalsAddCustomForm()" style="background:#21262d;color:#8b949e;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:700">+ Nova</button></div>
    ${cgs.length?listRows:'<div style="font-size:12px;color:#4d5863;text-align:center;padding:10px 0">Nenhuma meta cadastrada</div>'}
    ${form}
  </div>`;
}
function goalsAddCustomForm(){_cgFormOpen=true;showGoals();setTimeout(()=>document.getElementById('cg-name')?.focus(),50);}
function goalsCancelCustom(){_cgFormOpen=false;showGoals();}
function goalsSaveCustom(){
  const name=(document.getElementById('cg-name')?.value||'').trim();
  const target=parseFloat(document.getElementById('cg-target')?.value)||0;
  if(!name||!target) return;
  const icon=document.getElementById('cg-icon')?.value||'🎯';
  const unit=(document.getElementById('cg-unit')?.value||'min').trim();
  const frequency=document.getElementById('cg-freq')?.value||'semanal';
  const linkedWorkout=document.getElementById('cg-linked')?.value||'';
  const cgs=[...(goals.customGoals||[])];
  cgs.push({id:'cg_'+Date.now(),name,icon,unit,frequency,target,linkedWorkout});
  saveGoals({...goals,customGoals:cgs});
  _cgFormOpen=false;showGoals();
}
function goalsDeleteCustom(i){
  if(!confirm('Excluir esta meta?')) return;
  const cgs=[...(goals.customGoals||[])];cgs.splice(i,1);
  saveGoals({...goals,customGoals:cgs});showGoals();
}
function setCustomLog(id,val){
  if(!dayData.customLogs) dayData.customLogs={};
  dayData.customLogs[id]=Math.max(0,+val||0);save();renderUI();
}
function addCustomLog(id,delta){
  if(!dayData.customLogs) dayData.customLogs={};
  setCustomLog(id,Math.max(0,(dayData.customLogs[id]||0)+delta));
}

// ─── ACTIONS ─────────────────────────────────────────────────────────────────
function save(){saveDay(currentDate,dayData);}
function changeDay(n){currentDate=addDays(currentDate,n);render();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('screen-'+id).classList.add('active');}
function toggleMeal(id){dayData.meals[id]=!dayData.meals[id];save();renderUI();}
function toggleSup(id){dayData.sups[id]=!dayData.sups[id];save();renderUI();}
function setTr(id){dayData.tr=id;save();renderUI();}
function toggle(k){dayData[k]=!dayData[k];save();renderUI();}
function setJantar(v){dayData.jantarV=v;save();renderUI();}
function setWater(i){dayData.water=i<dayData.water?i:i+1;save();renderUI();}
function addWater(n){dayData.water=Math.max(0,Math.min(12,dayData.water+n));save();renderUI();}
function setSleep(id){dayData.sleep=id;save();renderUI();}
function setSleepOk(v){dayData.sleepOk=v;save();renderUI();}
function setNotes(v){dayData.notes=v;save();}
function dispDate(s){const[y,m,d]=s.split('-');const dt=new Date(+y,+m-1,+d);return{day:DAYS[dt.getDay()],date:d+' '+MONTHS[+m-1]};}

// ─── INIT ─────────────────────────────────────────────────────────────────────
if(authToken){showScreen('home');setBnavActive('hoje');render(true);}else{showScreen('auth');}
</script>
