name: Deploy to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1

      - name: Registrar identidade SES para e-mails do Cognito
        run: |
          aws ses verify-email-identity \
            --email-address pulso457@gmail.com \
            --region sa-east-1
          echo "E-mail de verificação enviado para pulso457@gmail.com"

      - name: Limpar stack em ROLLBACK_COMPLETE se necessário
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name tracker-habitos-backend \
            --query "Stacks[0].StackStatus" \
            --output text \
            --region sa-east-1 2>/dev/null || echo "DOES_NOT_EXIST")
          if [[ "$STATUS" == *"ROLLBACK_COMPLETE"* ]]; then
            echo "Stack em $STATUS, deletando..."
            aws cloudformation delete-stack --stack-name tracker-habitos-backend --region sa-east-1
            aws cloudformation wait stack-delete-complete --stack-name tracker-habitos-backend --region sa-east-1
            echo "Stack deletado."
          fi

      - name: Deploy infraestrutura (Cognito + DynamoDB + Lambda)
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/template.yaml \
            --stack-name tracker-habitos-backend \
            --capabilities CAPABILITY_NAMED_IAM \
            --region sa-east-1 \
            --no-fail-on-empty-changeset \
            --parameter-overrides "RapidApiKey=${{ secrets.RAPIDAPI_KEY }}"

      - name: Atualizar RAPIDAPI_KEY no Lambda
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          echo "RAPIDAPI_KEY definida: $([ -n "$RAPIDAPI_KEY" ] && echo 'SIM' || echo 'NAO')"
          aws lambda update-function-configuration \
            --function-name tracker-habitos-api \
            --region sa-east-1 \
            --environment "Variables={TABLE_NAME=tracker-habitos-data,CACHE_TABLE_NAME=exercise-cache,RAPIDAPI_KEY=$RAPIDAPI_KEY}"
          aws lambda wait function-updated \
            --function-name tracker-habitos-api \
            --region sa-east-1

      - name: Garantir permissão pública no Lambda URL
        run: |
          aws lambda remove-permission \
            --function-name tracker-habitos-api \
            --statement-id AllowPublicFunctionUrlAccess \
            --region sa-east-1 2>/dev/null || true
          aws lambda add-permission \
            --function-name tracker-habitos-api \
            --statement-id AllowPublicFunctionUrlAccess \
            --action lambda:InvokeFunctionUrl \
            --principal "*" \
            --function-url-auth-type NONE \
            --region sa-east-1

      - name: Obter outputs do stack
        id: stack
        run: |
          OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name tracker-habitos-backend \
            --query "Stacks[0].Outputs" \
            --output json \
            --region sa-east-1)
          API_URL=$(echo $OUTPUTS | python3 -c "import sys,json; o=json.load(sys.stdin); print(next(x['OutputValue'] for x in o if x['OutputKey']=='ApiUrl'))")
          CLIENT_ID=$(echo $OUTPUTS | python3 -c "import sys,json; o=json.load(sys.stdin); print(next(x['OutputValue'] for x in o if x['OutputKey']=='UserPoolClientId'))")
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "client_id=$CLIENT_ID" >> $GITHUB_OUTPUT

      - name: Injetar configurações no HTML
        run: |
          sed -i "s|__API_URL__|${{ steps.stack.outputs.api_url }}|g" habit-tracker.html
          sed -i "s|__COGNITO_CLIENT_ID__|${{ steps.stack.outputs.client_id }}|g" habit-tracker.html

      - name: Sincronizar arquivos com o S3
        run: |
          aws s3 sync . s3://tracker-habitos \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "infrastructure/*" \
            --exclude "README.md" \
            --delete

      - name: Invalidar cache do CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2ILQ9T2EA1B14 \
            --paths "/*"
