name: Deploy to S3

on:
  push:
    branches:
      - main

# Serializa deploys na main: um push espera o anterior terminar em vez de correr
# em paralelo na mesma stack (a corrida entre dois deploys já derrubou o acesso
# público do Function URL). Não cancela o que está em andamento — deploy pela
# metade deixa infra em estado inconsistente.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1

      - name: Empacotar Lambda de notificações push
        run: |
          mkdir -p build/push-sender
          pip install -r infrastructure/push-sender/requirements.txt -t build/push-sender
          cp infrastructure/push-sender/index.py build/push-sender/
          cd build/push-sender
          zip -r ../../push-sender.zip .
          cd ../..
          aws s3 cp push-sender.zip s3://tracker-habitos/lambda-builds/push-sender.zip --region sa-east-1

      # Precisa rodar ANTES do deploy da stack: o template referencia essa S3Key,
      # e num deploy do zero o objeto tem que existir. Sem dependências de terceiros
      # — a API usa só stdlib + boto3, que já vem no runtime.
      # O zip vai para build/ porque esse diretório já está no .gitignore e nos
      # excludes do `s3 sync`, então o código-fonte da Lambda nunca vaza para o site.
      - name: Empacotar Lambda da API
        run: |
          mkdir -p build
          zip -j build/api.zip infrastructure/api/index.py
          aws s3 cp build/api.zip s3://tracker-habitos/lambda-builds/api.zip --region sa-east-1

      - name: Registrar identidade SES para e-mails do Cognito
        run: |
          aws ses verify-email-identity \
            --email-address pulso457@gmail.com \
            --region sa-east-1 \
          && echo "E-mail de verificação enviado para pulso457@gmail.com" \
          || echo "Aviso: não foi possível (re)enviar verificação SES (permissão ausente ou identidade já verificada) — seguindo com o deploy"

      - name: Limpar stack em ROLLBACK_COMPLETE se necessário
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name tracker-habitos-backend \
            --query "Stacks[0].StackStatus" \
            --output text \
            --region sa-east-1 2>/dev/null || echo "DOES_NOT_EXIST")
          echo "StackStatus: $STATUS"
          # Comparação EXATA, nunca glob. ROLLBACK_COMPLETE (sem prefixo) é o
          # estado de um stack cuja PRIMEIRA criação falhou: não tem recurso vivo
          # e só sai do caminho sendo deletado.
          #
          # UPDATE_ROLLBACK_COMPLETE é coisa totalmente diferente — stack saudável
          # que reverteu um update. O padrão antigo, *"ROLLBACK_COMPLETE"*, casava
          # com os dois e mandava deletar a stack inteira: DynamoDB com todo o
          # histórico, o User Pool do Cognito e o userId que é chave de partição.
          # Um update falho passava a armar a destruição no push seguinte.
          if [[ "$STATUS" == "ROLLBACK_COMPLETE" ]]; then
            echo "Stack em ROLLBACK_COMPLETE (criação inicial falhou, sem recursos) — deletando para recriar."
            aws cloudformation delete-stack --stack-name tracker-habitos-backend --region sa-east-1
            aws cloudformation wait stack-delete-complete --stack-name tracker-habitos-backend --region sa-east-1
            echo "Stack deletado."
          elif [[ "$STATUS" == *ROLLBACK* ]]; then
            echo "Stack em $STATUS — reverteu um update, mas os recursos estão vivos. NÃO deletar; o deploy a seguir atualiza normalmente."
          fi

      # Uma Lambda só aceita UM Function URL. Se existir um Function URL FÍSICO que
      # não está no estado da stack (ex.: recriado por CLI fora do CloudFormation, ou
      # deixado para trás por um rollback anterior), o próximo deploy tenta criar o
      # TrackerFunctionUrl e bate 409 "FunctionUrlConfig exists" — a stack reverte em
      # loop e a permissão pública nunca chega a ser aplicada. Isso já travou a esteira
      # e exigiu deleção manual. Aqui detectamos o órfão (físico existe, mas a stack não
      # o gerencia) e o removemos para o CloudFormation recriá-lo limpo. Quando a stack
      # já é dona da URL, não tocamos em nada — o endereço não muda.
      - name: Reconciliar Function URL órfão (evita 409 no CloudFormation)
        run: |
          MANAGED=$(aws cloudformation describe-stack-resources \
            --stack-name tracker-habitos-backend \
            --logical-resource-id TrackerFunctionUrl \
            --region sa-east-1 \
            --query "StackResources[0].PhysicalResourceId" --output text 2>/dev/null || echo "NONE")
          PHYS=$(aws lambda get-function-url-config \
            --function-name tracker-habitos-api \
            --region sa-east-1 \
            --query FunctionUrl --output text 2>/dev/null || echo "NONE")
          echo "Function URL gerenciado pela stack: $MANAGED | físico na função: $PHYS"
          if [[ ( -z "$MANAGED" || "$MANAGED" == "NONE" || "$MANAGED" == "None" ) && "$PHYS" != "NONE" ]]; then
            echo "::warning::Function URL órfão (existe físico, fora do estado da stack). Removendo para o CloudFormation recriar sem 409."
            aws lambda delete-function-url-config --function-name tracker-habitos-api --region sa-east-1
          else
            echo "OK: sem órfão — a stack já gerencia o Function URL (ou não há nenhum físico)."
          fi

      - name: Deploy infraestrutura (Cognito + DynamoDB + Lambda)
        id: cfn
        continue-on-error: true
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/template.yaml \
            --stack-name tracker-habitos-backend \
            --capabilities CAPABILITY_NAMED_IAM \
            --region sa-east-1 \
            --no-fail-on-empty-changeset \
            --parameter-overrides "RapidApiKey=${{ secrets.RAPIDAPI_KEY }}" "VapidPrivateKey=${{ secrets.VAPID_PRIVATE_KEY }}"

      - name: Diagnosticar falha da stack (se houver)
        if: steps.cfn.outcome == 'failure'
        continue-on-error: true
        run: |
          aws cloudformation describe-stack-events \
            --stack-name tracker-habitos-backend \
            --region sa-east-1 \
            --query "StackEvents[?contains(ResourceStatus, 'FAILED')].[LogicalResourceId,ResourceStatusReason]" \
            --output table

      - name: Atualizar código da Lambda de notificações push
        if: steps.cfn.outcome == 'success'
        run: |
          aws lambda update-function-code \
            --function-name tracker-habitos-push-sender \
            --s3-bucket tracker-habitos \
            --s3-key lambda-builds/push-sender.zip \
            --region sa-east-1
          aws lambda wait function-updated \
            --function-name tracker-habitos-push-sender \
            --region sa-east-1

      # O CloudFormation só re-publica o código quando a S3Key muda, e a chave aqui
      # é fixa. Sem este passo, uma alteração em infrastructure/api/index.py subiria
      # para o S3 mas nunca chegaria à função — mesma razão do passo do push-sender.
      - name: Atualizar código da Lambda da API
        if: steps.cfn.outcome == 'success'
        run: |
          aws lambda update-function-code \
            --function-name tracker-habitos-api \
            --s3-bucket tracker-habitos \
            --s3-key lambda-builds/api.zip \
            --region sa-east-1
          aws lambda wait function-updated \
            --function-name tracker-habitos-api \
            --region sa-east-1

      # --environment SUBSTITUI o mapa inteiro, não faz merge: toda variável do
      # template precisa ser repetida aqui. SUB_TABLE_NAME estava faltando e era
      # apagada a cada deploy — só não quebrou o push porque o código tem default.
      - name: Atualizar RAPIDAPI_KEY no Lambda
        if: steps.cfn.outcome == 'success'
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          echo "RAPIDAPI_KEY definida: $([ -n "$RAPIDAPI_KEY" ] && echo 'SIM' || echo 'NAO')"
          aws lambda update-function-configuration \
            --function-name tracker-habitos-api \
            --region sa-east-1 \
            --environment "Variables={TABLE_NAME=tracker-habitos-data,CACHE_TABLE_NAME=exercise-cache,SUB_TABLE_NAME=tracker-habitos-push-subscriptions,RAPIDAPI_KEY=$RAPIDAPI_KEY}"
          aws lambda wait function-updated \
            --function-name tracker-habitos-api \
            --region sa-east-1

      # O AuthType do Function URL é a causa provável do 403 AccessDeniedException:
      # os três statements da policy são condicionados a
      # lambda:FunctionUrlAuthType == NONE, então se o AuthType real virar AWS_IAM
      # nenhum Allow se aplica e toda requisição não assinada é negada — com
      # exatamente a mensagem que aponta para urls-auth.html.
      #
      # O template declara NONE, mas o CloudFormation NÃO corrige drift: se o valor
      # foi mudado fora dele, o template continua igual, nenhum update é emitido e
      # o deploy passa verde sem consertar nada. Daí a correção via CLI.
      - name: Garantir AuthType NONE no Function URL
        if: steps.cfn.outcome == 'success'
        run: |
          AUTH=$(aws lambda get-function-url-config \
            --function-name tracker-habitos-api \
            --region sa-east-1 \
            --query AuthType --output text 2>/dev/null || echo "ERRO")
          echo "AuthType atual: $AUTH"
          if [[ "$AUTH" == "NONE" ]]; then
            echo "OK: já está NONE — o 403 não vem daqui."
          elif [[ "$AUTH" == "ERRO" ]]; then
            echo "::error::Não foi possível ler a config do Function URL."
          else
            echo "::warning::AuthType estava $AUTH (esperado NONE) — esta era a causa do 403. Corrigindo."
            aws lambda update-function-url-config \
              --function-name tracker-habitos-api \
              --auth-type NONE \
              --region sa-east-1 \
              --query AuthType --output text
            echo "AuthType corrigido para NONE."
          fi

      # Diagnóstico: imprime a policy efetiva da função. Foi este passo que
      # provou que a permissão pública NÃO era a causa do 403 — a policy já tinha
      # dois statements de InvokeFunctionUrl antes de qualquer intervenção. Um
      # passo add-permission chegou a ser adicionado aqui e foi removido por ser
      # redundante; o statement FunctionURLPublicAccessGuard que ele criou ficou
      # na AWS e é inofensivo (Allow idêntico aos outros dois).
      - name: Conferir policy do Function URL
        if: steps.cfn.outcome == 'success'
        continue-on-error: true
        run: |
          POLICY=$(aws lambda get-policy \
            --function-name tracker-habitos-api \
            --region sa-east-1 \
            --query Policy --output text 2>/dev/null || echo "")
          if [[ -z "$POLICY" ]]; then
            echo "::error::A função NÃO tem policy — toda chamada à API responde 403."
          else
            echo "$POLICY" | python3 -m json.tool
            # Desde out/2025 um Function URL NONE exige AS DUAS permissões. Conferir só
            # InvokeFunctionUrl deixava passar exatamente o 403 que derrubou a API.
            echo "$POLICY" | grep -q "InvokeFunctionUrl" \
              && echo "OK: existe statement de lambda:InvokeFunctionUrl" \
              || echo "::error::Policy SEM lambda:InvokeFunctionUrl — causa 403."
            # grep de InvokeFunction que não case com InvokeFunctionUrl
            echo "$POLICY" | grep -qE '"lambda:InvokeFunction"' \
              && echo "OK: existe statement de lambda:InvokeFunction (exigido desde out/2025)" \
              || echo "::error::Policy SEM lambda:InvokeFunction — desde out/2025 isto sozinho causa 403 no Function URL NONE."
          fi

      - name: Obter outputs do stack
        id: stack
        continue-on-error: true
        run: |
          OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name tracker-habitos-backend \
            --query "Stacks[0].Outputs" \
            --output json \
            --region sa-east-1 2>/dev/null || echo "[]")
          API_URL=$(echo "$OUTPUTS" | python3 -c "import sys,json; o=json.load(sys.stdin) or []; print(next((x['OutputValue'] for x in o if x['OutputKey']=='ApiUrl'),''))")
          CLIENT_ID=$(echo "$OUTPUTS" | python3 -c "import sys,json; o=json.load(sys.stdin) or []; print(next((x['OutputValue'] for x in o if x['OutputKey']=='UserPoolClientId'),''))")
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "client_id=$CLIENT_ID" >> $GITHUB_OUTPUT
          if [[ -z "$API_URL" || -z "$CLIENT_ID" ]]; then
            echo "::warning::Outputs da stack indisponíveis (api_url/client_id vazios) — deploy do frontend será pulado."
          fi

      # ── Frontend (S3 + CloudFront) ──────────────────────────────────────────────
      # Publica somente quando os outputs reais da stack existem, para nunca subir
      # HTML com placeholders (__API_URL__/__COGNITO_CLIENT_ID__) não substituídos.
      # Roda independente do backend: se só a parte de EventBridge falhar mas a
      # stack anterior tiver rollback para um estado válido, o site ainda sobe.
      # O config.json recebe os mesmos valores do HTML e é publicado com
      # no-store. É ele que o app relê a cada boot: se o endereço do Function URL
      # mudar, um aparelho com HTML velho no cache ainda descobre o endereço novo
      # em vez de bater para sempre num endpoint morto (403 AccessDeniedException).
      - name: Injetar configurações no HTML e no config.json
        if: steps.stack.outputs.api_url != '' && steps.stack.outputs.client_id != ''
        run: |
          sed -i "s|__API_URL__|${{ steps.stack.outputs.api_url }}|g" habit-tracker.html config.json
          sed -i "s|__COGNITO_CLIENT_ID__|${{ steps.stack.outputs.client_id }}|g" habit-tracker.html config.json
          grep -q "__API_URL__\|__COGNITO_CLIENT_ID__" habit-tracker.html config.json \
            && { echo "::error::Sobrou placeholder não substituído"; exit 1; } || true
          cat config.json

      - name: Sincronizar arquivos com o S3
        if: steps.stack.outputs.api_url != '' && steps.stack.outputs.client_id != ''
        run: |
          aws s3 sync . s3://tracker-habitos \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".claude/*" \
            --exclude ".gitignore" \
            --exclude "infrastructure/*" \
            --exclude "README.md" \
            --exclude "*.md" \
            --exclude "build/*" \
            --exclude "push-sender.zip" \
            --exclude "lambda-builds/*" \
            --delete

      # O `s3 sync` sobe sem Cache-Control nenhum, e aí o navegador guarda o
      # arquivo por heurística (uma fração da idade do Last-Modified) — a
      # invalidação do CloudFront limpa a CDN, mas não o cache do aparelho. Foi
      # assim que o celular continuou dias com o HTML antigo, chamando um
      # Function URL que já não existia. Os arquivos de configuração agora
      # exigem revalidação a cada carga; o ícone, esse sim, pode ficar em cache.
      - name: Definir cache dos arquivos mutáveis
        if: steps.stack.outputs.api_url != '' && steps.stack.outputs.client_id != ''
        run: |
          put() {
            aws s3 cp "$1" "s3://tracker-habitos/$1" \
              --cache-control "$2" --content-type "$3"
          }
          put config.json          "no-store"                 "application/json"
          put habit-tracker.html   "no-cache, must-revalidate" "text/html; charset=utf-8"
          put sw.js                "no-cache, must-revalidate" "application/javascript; charset=utf-8"
          put manifest.json        "no-cache, must-revalidate" "application/manifest+json"
          aws s3 cp icon.svg s3://tracker-habitos/icon.svg \
            --cache-control "public, max-age=604800" --content-type "image/svg+xml"

      - name: Invalidar cache do CloudFront
        if: steps.stack.outputs.api_url != '' && steps.stack.outputs.client_id != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2ILQ9T2EA1B14 \
            --paths "/*"

      # Prova de fogo do endpoint, do lado de fora da AWS: sem Authorization o
      # NOSSO código responde 401 {"error":"unauthorized"}. Se em vez disso vier
      # 403 [AccessDeniedException], a requisição nem chegou à função — endereço
      # inexistente, AuthType errado ou policy sem InvokeFunctionUrl.
      #
      # Roda depois do deploy do frontend, de propósito: o site sobe de qualquer
      # jeito e só o resultado do teste decide a cor do workflow. Os dois deploys
      # anteriores passaram verdes com a API respondendo 403 para tudo, e o erro
      # só apareceu no celular — este passo fecha essa lacuna.
      - name: Testar o Function URL de fora
        if: steps.stack.outputs.api_url != ''
        run: |
          URL="${{ steps.stack.outputs.api_url }}"
          echo "Testando $URL"
          # Retry porque uma permissão de Function URL recém-criada leva alguns
          # segundos para valer — sem isso um 403 de propagação reprovaria um deploy
          # que na verdade está correto. 5 tentativas com espera crescente.
          CODE=000; TIPO=""
          for i in 1 2 3 4 5; do
            CODE=$(curl -sS -o /tmp/probe.txt -D /tmp/probe-h.txt -w "%{http_code}" \
                     --max-time 20 "${URL%/}/?date=__probe__" || echo "000")
            TIPO=$(grep -i "^x-amzn-errortype" /tmp/probe-h.txt | tr -d '\r' | cut -d' ' -f2- || true)
            echo "tentativa $i: HTTP $CODE"
            [[ "$CODE" == "401" ]] && break
            [[ $i -lt 5 ]] && sleep $((i*5))
          done
          echo "HTTP final: $CODE"
          head -c 400 /tmp/probe.txt; echo
          if [[ "$CODE" == "401" ]]; then
            echo "OK: a função respondeu (401 unauthorized é o esperado sem token)."
          elif [[ "$CODE" == "403" ]]; then
            echo "::error::403 no Function URL (${TIPO:-sem x-amzn-errortype}) — a requisição não chegou à função. Desde out/2025 a causa mais comum é a resource policy faltar lambda:InvokeFunction (além de InvokeFunctionUrl). Confira também se o endereço $URL existe (get-function-url-config) e o AuthType."
            exit 1
          else
            echo "::error::Resposta inesperada do Function URL: HTTP $CODE. Esperado 401."
            exit 1
          fi

      # Mantém o workflow VERMELHO se o backend falhou, mesmo que o frontend tenha
      # sido publicado — assim a falha de infra (ex.: permissão EventBridge ausente)
      # continua visível em vez de ser mascarada pelo continue-on-error acima.
      - name: Sinalizar falha do backend
        if: steps.cfn.outcome == 'failure'
        run: |
          echo "::error::Deploy do backend (CloudFormation) falhou — veja o passo de diagnóstico acima."
          exit 1
