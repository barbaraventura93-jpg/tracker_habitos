AWSTemplateFormatVersion: '2010-09-09'
Description: Tracker Habitos - Backend API

Resources:

  TrackerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: tracker-habitos-data
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: date
          KeyType: RANGE

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tracker-habitos-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !GetAtt TrackerTable.Arn

  TrackerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tracker-habitos-api
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: tracker-habitos-data
      Code:
        ZipFile: |
          import json,boto3,os
          dynamo=boto3.resource('dynamodb')
          table=dynamo.Table(os.environ['TABLE_NAME'])
          CORS={'Access-Control-Allow-Origin':'*','Access-Control-Allow-Headers':'content-type','Access-Control-Allow-Methods':'GET,PUT,OPTIONS'}
          def handler(event,context):
            method=event.get('requestContext',{}).get('http',{}).get('method','')
            if method=='OPTIONS':
              return{'statusCode':200,'headers':CORS,'body':''}
            params=event.get('queryStringParameters') or {}
            uid=params.get('userId','')
            date=params.get('date','')
            if not uid or not date:
              return{'statusCode':400,'headers':CORS,'body':json.dumps({'error':'missing params'})}
            if method=='GET':
              resp=table.get_item(Key={'userId':uid,'date':date})
              data=resp.get('Item',{}).get('data')
              return{'statusCode':200,'headers':CORS,'body':json.dumps(data)}
            if method=='PUT':
              body=json.loads(event.get('body') or '{}')
              table.put_item(Item={'userId':uid,'date':date,'data':body})
              return{'statusCode':200,'headers':CORS,'body':json.dumps({'ok':True})}
            return{'statusCode':405,'headers':CORS,'body':json.dumps({'error':'not allowed'})}

  TrackerFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      Cors:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - PUT
          - OPTIONS
        AllowHeaders:
          - content-type
      TargetFunctionArn: !Ref TrackerFunction

  TrackerFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref TrackerFunction
      Principal: '*'
      FunctionUrlAuthType: NONE

Outputs:
  ApiUrl:
    Value: !GetAtt TrackerFunctionUrl.FunctionUrl
    Description: Lambda Function URL
