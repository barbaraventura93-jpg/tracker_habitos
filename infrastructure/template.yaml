AWSTemplateFormatVersion: '2010-09-09'
Description: Tracker Habitos - Backend API

Parameters:
  RapidApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: RapidAPI key for ExerciseDB (optional — cache still works without it)

  VapidPrivateKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: VAPID private key for Web Push reminder notifications (optional — push sender no-ops without it)

Resources:

  # ── Cognito ──────────────────────────────────────────────────────────────────
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: tracker-habitos-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: tracker-habitos-web
      UserPoolId: !Ref UserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 24
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        RefreshToken: days

  # ── DynamoDB ─────────────────────────────────────────────────────────────────
  TrackerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: tracker-habitos-data
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: date
          KeyType: RANGE

  ExerciseCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: exercise-cache
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: exerciseName
          AttributeType: S
      KeySchema:
        - AttributeName: exerciseName
          KeyType: HASH

  PushSubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: tracker-habitos-push-subscriptions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  # ── Lambda ───────────────────────────────────────────────────────────────────
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tracker-habitos-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !GetAtt TrackerTable.Arn
                  - !GetAtt ExerciseCacheTable.Arn
                  - !GetAtt PushSubscriptionsTable.Arn
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: "*"

  TrackerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tracker-habitos-api
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: tracker-habitos-data
          CACHE_TABLE_NAME: exercise-cache
          SUB_TABLE_NAME: tracker-habitos-push-subscriptions
          RAPIDAPI_KEY: !Ref RapidApiKey
      # Codigo em infrastructure/api/index.py. O CloudFormation so re-publica
      # quando a S3Key muda, entao o workflow tambem chama update-function-code
      # apos o deploy — mesmo padrao do push-sender.
      Code:
        S3Bucket: tracker-habitos
        S3Key: lambda-builds/api.zip

  TrackerFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      Cors:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - PUT
          - POST
        AllowHeaders:
          - content-type
          - authorization
      TargetFunctionArn: !Ref TrackerFunction

  # Acesso público ao Function URL declarado como recurso (idempotente).
  # Substitui o antigo passo CLI remove/add do workflow, que criava janela de
  # outage e quebrava sob deploys concorrentes.
  TrackerFunctionUrlPublicPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TrackerFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  # ── Push notifications (lembretes diários) ──────────────────────────────────
  PushSenderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tracker-habitos-push-sender
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: tracker-habitos-data
          SUB_TABLE_NAME: tracker-habitos-push-subscriptions
          VAPID_PRIVATE_KEY: !Ref VapidPrivateKey
          VAPID_SUBJECT: mailto:barbaraventura93@gmail.com
      Code:
        S3Bucket: tracker-habitos
        S3Key: lambda-builds/push-sender.zip

  PushSenderScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: tracker-habitos-push-schedule
      ScheduleExpression: rate(1 hour)
      State: ENABLED
      Targets:
        - Arn: !GetAtt PushSenderFunction.Arn
          Id: PushSenderTarget

  PushSenderInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PushSenderFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt PushSenderScheduleRule.Arn

Outputs:
  ApiUrl:
    Value: !GetAtt TrackerFunctionUrl.FunctionUrl
    Description: Lambda Function URL

  UserPoolClientId:
    Value: !Ref UserPoolClient
    Description: Cognito User Pool Client ID
