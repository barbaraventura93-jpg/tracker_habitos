AWSTemplateFormatVersion: '2010-09-09'
Description: Tracker Habitos - Backend API

Parameters:
  RapidApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: RapidAPI key for ExerciseDB (optional — cache still works without it)

  VapidPrivateKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: VAPID private key for Web Push reminder notifications (optional — push sender no-ops without it)

Resources:

  # ── Cognito ──────────────────────────────────────────────────────────────────
  UserPool:
    Type: AWS::Cognito::UserPool
    # Retain: apagar o pool apaga os usuarios e os uid, que sao a chave de
    # particao do DynamoDB — sem eles o dado remanescente fica orfao.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: tracker-habitos-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: tracker-habitos-web
      UserPoolId: !Ref UserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 24
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        RefreshToken: days

  # ── DynamoDB ─────────────────────────────────────────────────────────────────
  TrackerTable:
    Type: AWS::DynamoDB::Table
    # Retain: esta tabela guarda o historico inteiro do usuario.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: tracker-habitos-data
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: date
          KeyType: RANGE

  ExerciseCacheTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: exercise-cache
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: exerciseName
          AttributeType: S
      KeySchema:
        - AttributeName: exerciseName
          KeyType: HASH

  PushSubscriptionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: tracker-habitos-push-subscriptions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  # ── Lambda ───────────────────────────────────────────────────────────────────
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tracker-habitos-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !GetAtt TrackerTable.Arn
                  - !GetAtt ExerciseCacheTable.Arn
                  - !GetAtt PushSubscriptionsTable.Arn
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: "*"

  TrackerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tracker-habitos-api
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      # Precisa acomodar o pior caso do Bedrock (2 tentativas x read_timeout de
      # 20s). Estourando o tempo aqui o Function URL devolve 502 sem CORS, e o
      # erro chega ao navegador como "Failed to fetch", sem causa.
      Timeout: 60
      # Sem isto a funcao rodava com o default de 128 MB, apertado para boto3 +
      # cliente do bedrock-runtime + decode de imagem/PDF em base64. Estouro de
      # memoria MATA o processo: nenhum except roda e a plataforma responde
      # {"message":"Internal Server Error"} — indistinguivel de timeout, e sem a
      # causa. A CPU tambem escala com a memoria, entao 128 MB deixava tudo lento.
      MemorySize: 512
      Environment:
        Variables:
          TABLE_NAME: tracker-habitos-data
          CACHE_TABLE_NAME: exercise-cache
          SUB_TABLE_NAME: tracker-habitos-push-subscriptions
          RAPIDAPI_KEY: !Ref RapidApiKey
      # Codigo em infrastructure/api/index.py. O CloudFormation so re-publica
      # quando a S3Key muda, entao o workflow tambem chama update-function-code
      # apos o deploy — mesmo padrao do push-sender.
      Code:
        S3Bucket: tracker-habitos
        S3Key: lambda-builds/api.zip

  # ⚠️ NÃO renomeie este logical ID para forçar recriação da URL. Já tentado e
  # impossível: uma Lambda aceita só UMA FunctionUrlConfig por qualifier, e o
  # CloudFormation renomeia com CREATE antes de DELETE. A criação da segunda URL
  # falha com 409 "FunctionUrlConfig exists for this Lambda function" e a stack
  # inteira faz rollback.
  #
  # Recriar de fato exigiria dois deploys — um removendo o recurso, outro
  # re-adicionando — com a API fora do ar no intervalo.
  TrackerFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      Cors:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - PUT
          - POST
        AllowHeaders:
          - content-type
          - authorization
        # Sem ExposeHeaders o navegador só entrega ao JS os headers da safelist
        # do CORS, e estes dois ficam invisíveis. São justamente os que a AWS usa
        # para nomear a causa de um erro de plataforma (403/502), que acontece
        # antes do nosso código rodar — sem eles, resta adivinhar.
        ExposeHeaders:
          - x-amzn-errortype
          - x-amzn-requestid
          - x-amzn-trace-id
      TargetFunctionArn: !Ref TrackerFunction

  # Acesso público ao Function URL declarado como recurso (idempotente).
  # Substitui o antigo passo CLI remove/add do workflow, que criava janela de
  # outage e quebrava sob deploys concorrentes.
  TrackerFunctionUrlPublicPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TrackerFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  # ── Push notifications (lembretes diários) ──────────────────────────────────
  PushSenderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tracker-habitos-push-sender
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: tracker-habitos-data
          SUB_TABLE_NAME: tracker-habitos-push-subscriptions
          VAPID_PRIVATE_KEY: !Ref VapidPrivateKey
          VAPID_SUBJECT: mailto:barbaraventura93@gmail.com
      Code:
        S3Bucket: tracker-habitos
        S3Key: lambda-builds/push-sender.zip

  PushSenderScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: tracker-habitos-push-schedule
      ScheduleExpression: rate(1 hour)
      State: ENABLED
      Targets:
        - Arn: !GetAtt PushSenderFunction.Arn
          Id: PushSenderTarget

  PushSenderInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PushSenderFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt PushSenderScheduleRule.Arn

Outputs:
  ApiUrl:
    Value: !GetAtt TrackerFunctionUrl.FunctionUrl
    Description: Lambda Function URL

  UserPoolClientId:
    Value: !Ref UserPoolClient
    Description: Cognito User Pool Client ID
