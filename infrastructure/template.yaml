AWSTemplateFormatVersion: '2010-09-09'
Description: Tracker Habitos - Backend API

Resources:

  # ── Cognito ──────────────────────────────────────────────────────────────────
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: tracker-habitos-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: tracker-habitos-web
      UserPoolId: !Ref UserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 24
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        RefreshToken: days

  # ── DynamoDB ─────────────────────────────────────────────────────────────────
  TrackerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: tracker-habitos-data
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: date
          KeyType: RANGE

  # ── Lambda ───────────────────────────────────────────────────────────────────
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tracker-habitos-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !GetAtt TrackerTable.Arn

  TrackerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tracker-habitos-api
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: tracker-habitos-data
      Code:
        ZipFile: |
          import json,boto3,os,urllib.request
          dynamo=boto3.resource('dynamodb')
          table=dynamo.Table(os.environ['TABLE_NAME'])
          REGION=os.environ.get('AWS_REGION','sa-east-1')
          def get_uid(token):
            try:
              req=urllib.request.Request('https://cognito-idp.'+REGION+'.amazonaws.com/',data=json.dumps({'AccessToken':token}).encode(),headers={'Content-Type':'application/x-amz-json-1.1','X-Amz-Target':'AWSCognitoIdentityProviderService.GetUser'})
              with urllib.request.urlopen(req,timeout=5) as r:
                return json.loads(r.read())['Username']
            except:
              return None
          def handler(event,context):
            method=event.get('requestContext',{}).get('http',{}).get('method','')
            auth=(event.get('headers') or {}).get('authorization','')
            uid=get_uid(auth[7:]) if auth.startswith('Bearer ') else None
            if not uid:
              return{'statusCode':401,'body':json.dumps({'error':'unauthorized'})}
            params=event.get('queryStringParameters') or {}
            date=params.get('date','')
            if not date:
              return{'statusCode':400,'body':json.dumps({'error':'missing date'})}
            if method=='GET':
              resp=table.get_item(Key={'userId':uid,'date':date})
              data=resp.get('Item',{}).get('data')
              return{'statusCode':200,'body':json.dumps(data)}
            if method=='PUT':
              body=json.loads(event.get('body') or '{}')
              table.put_item(Item={'userId':uid,'date':date,'data':body})
              return{'statusCode':200,'body':json.dumps({'ok':True})}
            return{'statusCode':405,'body':json.dumps({'error':'not allowed'})}

  TrackerFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      Cors:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - PUT
        AllowHeaders:
          - content-type
          - authorization
      TargetFunctionArn: !Ref TrackerFunction

  TrackerFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    DependsOn: TrackerFunctionUrl
    Properties:
      StatementId: AllowPublicFunctionUrlAccess
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref TrackerFunction
      Principal: '*'
      FunctionUrlAuthType: NONE

Outputs:
  ApiUrl:
    Value: !GetAtt TrackerFunctionUrl.FunctionUrl
    Description: Lambda Function URL

  UserPoolClientId:
    Value: !Ref UserPoolClient
    Description: Cognito User Pool Client ID
