AWSTemplateFormatVersion: '2010-09-09'
Description: Tracker Habitos - Backend API

Parameters:
  RapidApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: RapidAPI key for ExerciseDB (optional — cache still works without it)

Resources:

  # ── Cognito ──────────────────────────────────────────────────────────────────
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: tracker-habitos-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: tracker-habitos-web
      UserPoolId: !Ref UserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 24
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        RefreshToken: days

  # ── DynamoDB ─────────────────────────────────────────────────────────────────
  TrackerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: tracker-habitos-data
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: date
          KeyType: RANGE

  ExerciseCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: exercise-cache
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: exerciseName
          AttributeType: S
      KeySchema:
        - AttributeName: exerciseName
          KeyType: HASH

  # ── Lambda ───────────────────────────────────────────────────────────────────
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tracker-habitos-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource:
                  - !GetAtt TrackerTable.Arn
                  - !GetAtt ExerciseCacheTable.Arn
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: "*"

  TrackerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tracker-habitos-api
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: tracker-habitos-data
          CACHE_TABLE_NAME: exercise-cache
          RAPIDAPI_KEY: !Ref RapidApiKey
      Code:
        ZipFile: |
          import json,boto3,os,urllib.request,urllib.parse,decimal,re,base64,datetime,unicodedata
          dynamo=boto3.resource('dynamodb')
          table=dynamo.Table(os.environ['TABLE_NAME'])
          cache_table=dynamo.Table(os.environ.get('CACHE_TABLE_NAME','exercise-cache'))
          bedrock=boto3.client('bedrock-runtime',region_name='us-east-1')
          REGION=os.environ.get('AWS_REGION','sa-east-1')
          MODEL='us.amazon.nova-lite-v1:0'
          RAPIDAPI_KEY=os.environ.get('RAPIDAPI_KEY','')
          TARGET_MAP={
            'pectorals':'Peito','pectoralis major':'Peito','serratus anterior':'Peito',
            'lats':'Costas','latissimus dorsi':'Costas','traps':'Costas','trapezius':'Costas','rhomboids':'Costas','spine':'Costas','upper back':'Costas','levator scapulae':'Costas',
            'delts':'Ombro','deltoid':'Ombro','deltoids':'Ombro','rotator cuff':'Ombro',
            'biceps':'Bíceps','biceps brachii':'Bíceps','brachialis':'Bíceps','brachioradialis':'Bíceps','forearms':'Bíceps',
            'triceps':'Tríceps','triceps brachii':'Tríceps',
            'quads':'Perna','quadriceps':'Perna','hamstrings':'Perna','calves':'Perna','adductors':'Perna','abductors':'Perna','hip flexors':'Perna',
            'glutes':'Glúteo','gluteus maximus':'Glúteo','gluteus medius':'Glúteo',
            'abs':'Core','obliques':'Core','cardiovascular system':'Cardio',
          }
          BODY_PART_MAP={
            'chest':'Peito','back':'Costas','shoulders':'Ombro',
            'upper arms':'Bíceps','lower arms':'Bíceps',
            'upper legs':'Perna','lower legs':'Perna',
            'waist':'Core','cardio':'Cardio',
          }
          class Dec(json.JSONEncoder):
            def default(self,o):
              if isinstance(o,decimal.Decimal):
                return int(o) if o%1==0 else float(o)
              return super().default(o)
          def get_uid(token):
            try:
              req=urllib.request.Request('https://cognito-idp.'+REGION+'.amazonaws.com/',data=json.dumps({'AccessToken':token}).encode(),headers={'Content-Type':'application/x-amz-json-1.1','X-Amz-Target':'AWSCognitoIdentityProviderService.GetUser'})
              with urllib.request.urlopen(req,timeout=5) as r:
                return json.loads(r.read())['Username']
            except:
              return None
          def call_ai(file_b64,mime,ctx):
            file_bytes=base64.b64decode(file_b64)
            is_pdf=mime=='application/pdf'
            if ctx=='supplements':
              prompt='Extraia todos os suplementos, vitaminas e medicamentos. Retorne APENAS um array JSON: [{"label":"nome e dose","sub":"horario e instrucao","icon":"emoji","showOn":"always"}]. Use showOn=treino para pre/pos-treino, descanso para descanso, always para os demais. Somente o JSON, sem markdown.'
            else:
              prompt='Extraia todos os exercicios deste plano de treino. Retorne APENAS um array JSON: [{"name":"exercicio","group":"Peito|Costas|Ombro|Biceps|Triceps|Perna|Core|Gluteo|Cardio|Outro","sets":3,"reps":"12","obs":""}]. Somente o JSON, sem markdown.'
            if is_pdf:
              content=[{'document':{'format':'pdf','name':'arquivo','source':{'bytes':file_bytes}}},{'text':prompt}]
            else:
              fmt=mime.split('/')[-1].replace('jpg','jpeg')
              content=[{'image':{'format':fmt,'source':{'bytes':file_bytes}}},{'text':prompt}]
            resp=bedrock.converse(modelId=MODEL,messages=[{'role':'user','content':content}],inferenceConfig={'maxTokens':3000})
            txt=resp['output']['message']['content'][0]['text']
            m=re.search(r'\[[\s\S]*\]',txt)
            if not m:
              raise Exception('Nenhum item identificado no arquivo')
            return json.loads(m.group())
          def map_group(body_part,target):
            t=TARGET_MAP.get(target.lower(),'')
            if t: return t
            return BODY_PART_MAP.get(body_part.lower(),'Outro')
          PT_EN={
            'supino':'bench press','supino reto':'bench press','supino plano':'bench press',
            'supino inclinado':'incline bench press','supino declinado':'decline bench press',
            'supino com halter':'dumbbell bench press','supino halteres':'dumbbell bench press',
            'crucifixo':'dumbbell fly','crucifixo inclinado':'incline dumbbell fly',
            'peck deck':'pec deck fly','voador':'pec deck fly',
            'remada':'bent over row','remada curvada':'bent over row','remada baixa':'seated cable row',
            'remada alta':'upright row','remada unilateral':'one arm dumbbell row',
            'pulldown':'lat pulldown','puxada':'lat pulldown','puxada frontal':'lat pulldown',
            'puxada por tras':'behind neck pulldown','puxada neutra':'cable close grip pulldown',
            'barra fixa':'pull up','barra':'pull up',
            'desenvolvimento':'overhead press','desenvolvimento frontal':'overhead press',
            'desenvolvimento com halter':'dumbbell shoulder press','desenvolvimento halteres':'dumbbell shoulder press',
            'elevacao lateral':'lateral raise','elevacao frontal':'front raise',
            'elevacao posterior':'rear delt fly','crucifixo invertido':'rear delt fly',
            'encolhimento':'shrug','encolhimento com halter':'dumbbell shrug',
            'rosca direta':'barbell curl','rosca biceps':'barbell curl',
            'rosca alternada':'dumbbell curl','rosca martelo':'hammer curl',
            'rosca concentrada':'concentration curl','rosca scott':'preacher curl',
            'rosca punho':'wrist curl',
            'triceps pulley':'triceps pushdown','triceps corda':'rope triceps pushdown',
            'triceps testa':'skull crusher','triceps tronco':'triceps pushdown',
            'triceps banco':'bench dips','mergulho':'dips','paralela':'dips',
            'agachamento':'squat','agachamento livre':'squat','agachamento sumô':'sumo squat',
            'agachamento hack':'hack squat','agachamento goblet':'goblet squat',
            'leg press':'leg press','leg press 45':'leg press 45',
            'cadeira extensora':'leg extension','extensora':'leg extension',
            'mesa flexora':'lying leg curl','flexora':'lying leg curl','leg curl':'leg curl',
            'stiff':'romanian deadlift','levantamento terra':'deadlift','terra':'deadlift',
            'afundo':'lunge','passada':'lunge','bulgaro':'bulgarian split squat',
            'panturrilha':'calf raise','elevacao calcanhares':'calf raise',
            'abdominal':'crunch','abdominais':'crunch','sit up':'sit-up',
            'prancha':'plank','abdominal bicicleta':'bicycle crunch',
            'hiperextensao':'back extension','lombar':'back extension',
            'gluteo':'hip thrust','elevacao de quadril':'hip thrust','ponte':'glute bridge',
            'abdutora':'hip abduction','adutora':'hip adduction',
            'corrida':'run','esteira':'treadmill','bike':'stationary bike',
            'bicicleta':'stationary bike','eliptico':'elliptical','remo ergometro':'rowing',
          }
          def translate_pt(name):
            k=name.lower().strip()
            norm=''.join(c for c in unicodedata.normalize('NFD',k) if unicodedata.category(c)!='Mn')
            for pt,en in PT_EN.items():
              pt_norm=''.join(c for c in unicodedata.normalize('NFD',pt) if unicodedata.category(c)!='Mn')
              if pt_norm==norm or pt_norm in norm or norm in pt_norm:
                return en
            return k
          def fetch_exercisedb(search_term):
            encoded=urllib.parse.quote(search_term)
            req=urllib.request.Request(
              'https://exercisedb.p.rapidapi.com/exercises/name/'+encoded+'?limit=3',
              headers={'X-RapidAPI-Key':RAPIDAPI_KEY,'X-RapidAPI-Host':'exercisedb.p.rapidapi.com'}
            )
            with urllib.request.urlopen(req,timeout=6) as r:
              return json.loads(r.read())
          def identify_exercise(name):
            key=name.lower().strip()
            cached=cache_table.get_item(Key={'exerciseName':key}).get('Item')
            if cached: return cached
            if not RAPIDAPI_KEY:
              return {'exerciseName':key,'found':False,'fromCache':False}
            en_term=translate_pt(key)
            try:
              data=fetch_exercisedb(en_term)
              if not data and en_term!=key:
                data=fetch_exercisedb(key)
            except:
              return {'exerciseName':key,'found':False,'fromCache':False}
            if not data:
              cache_table.put_item(Item={'exerciseName':key,'found':False,'cachedAt':datetime.datetime.utcnow().isoformat()+'Z'})
              return {'exerciseName':key,'found':False}
            ex=data[0]
            grp=map_group(ex.get('bodyPart',''),ex.get('target',''))
            result={
              'exerciseName':key,
              'exerciseId':ex.get('id',''),
              'bodyPart':ex.get('bodyPart',''),
              'targetMuscle':ex.get('target',''),
              'group':grp,
              'secondaryMuscles':ex.get('secondaryMuscles',[]),
              'gifUrl':ex.get('gifUrl',''),
              'instructions':ex.get('instructions',[]),
              'found':True,
              'cachedAt':datetime.datetime.utcnow().isoformat()+'Z',
            }
            cache_table.put_item(Item=result)
            return result
          def week_suggestion(week_summary,untrained,remaining_days):
            if remaining_days==0: return []
            untrained_str=', '.join(untrained) if untrained else 'nenhum — semana equilibrada'
            prompt=(
              'O usuario treinou isso essa semana: '+json.dumps(week_summary,ensure_ascii=False)+'\n\n'
              'Grupos musculares NAO treinados: '+untrained_str+'\n'
              'Dias restantes na semana: '+str(remaining_days)+'\n\n'
              'Gere 1 ou 2 sugestoes curtas e motivadoras (max 2 linhas cada) sobre o que faz sentido '
              'treinar nos dias restantes para equilibrar a semana. Linguagem simples, sem jargao tecnico. '
              'Responda so com as sugestoes, sem introducao ou numeracao.'
            )
            resp=bedrock.converse(modelId=MODEL,messages=[{'role':'user','content':[{'text':prompt}]}],inferenceConfig={'maxTokens':200})
            txt=resp['output']['message']['content'][0]['text']
            return [s.strip() for s in txt.strip().split('\n') if s.strip()]
          def handler(event,context):
            method=event.get('requestContext',{}).get('http',{}).get('method','')
            auth=(event.get('headers') or {}).get('authorization','')
            uid=get_uid(auth[7:]) if auth.startswith('Bearer ') else None
            if not uid:
              return{'statusCode':401,'body':json.dumps({'error':'unauthorized'})}
            params=event.get('queryStringParameters') or {}
            action=params.get('action','')
            date=params.get('date','')
            if action=='analyze' and method=='POST':
              try:
                body=json.loads(event.get('body') or '{}')
                items=call_ai(body['file'],body['mimeType'],body.get('context','gym_plan'))
                return{'statusCode':200,'body':json.dumps({'items':items})}
              except Exception as e:
                return{'statusCode':500,'body':json.dumps({'error':str(e)})}
            if action=='identify_exercise' and method=='GET':
              name=params.get('name','').strip()
              if not name:
                return{'statusCode':400,'body':json.dumps({'error':'missing name'})}
              try:
                result=identify_exercise(name)
                return{'statusCode':200,'body':json.dumps(result,cls=Dec)}
              except Exception as e:
                return{'statusCode':500,'body':json.dumps({'error':str(e)})}
            if action=='week_suggestion' and method=='POST':
              try:
                body=json.loads(event.get('body') or '{}')
                suggestions=week_suggestion(body.get('weekSummary',{}),body.get('untrainedGroups',[]),body.get('remainingDays',0))
                return{'statusCode':200,'body':json.dumps({'suggestions':suggestions})}
              except Exception as e:
                return{'statusCode':500,'body':json.dumps({'error':str(e)})}
            if not date:
              return{'statusCode':400,'body':json.dumps({'error':'missing date'})}
            if method=='GET':
              resp=table.get_item(Key={'userId':uid,'date':date})
              data=resp.get('Item',{}).get('data')
              return{'statusCode':200,'body':json.dumps(data,cls=Dec)}
            if method=='PUT':
              body=json.loads(event.get('body') or '{}')
              table.put_item(Item={'userId':uid,'date':date,'data':body})
              return{'statusCode':200,'body':json.dumps({'ok':True})}
            return{'statusCode':405,'body':json.dumps({'error':'not allowed'})}

  TrackerFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      Cors:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - PUT
          - POST
        AllowHeaders:
          - content-type
          - authorization
      TargetFunctionArn: !Ref TrackerFunction

Outputs:
  ApiUrl:
    Value: !GetAtt TrackerFunctionUrl.FunctionUrl
    Description: Lambda Function URL

  UserPoolClientId:
    Value: !Ref UserPoolClient
    Description: Cognito User Pool Client ID
